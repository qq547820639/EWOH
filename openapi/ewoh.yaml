    DeadLetterRecordRequest:
      type: object
      description: >
        死信落账请求（ADR-024 / NO-11a）。契约权威源： contracts/reliability/dead-letter.schema.json（5 reason / 3 status 封闭注册表 + envelope 快照必填 + 人审重放 + discard 理由强制）。
      properties:
        sourceId:
          type: string
          description: 失败源（管道归属），如 cloud:ingest
        reason:
          type: string
          enum: [ contract_violation, unknown_event_type, permanent_failure, ttl_expired, max_attempts_exceeded ]
        envelope:
          type: object
          description: 失败消息信封快照（§3 失败证据可审计）
          additionalProperties: true
        correlationId:
          type: [ string, 'null' ]
      required:
        - sourceId
        - reason
        - envelope
    DeadLetter:
      type: object
      properties:
        letterId:
          type: string
        sourceId:
          type: string
        reason:
          type: string
          enum: [ contract_violation, unknown_event_type, permanent_failure, ttl_expired, max_attempts_exceeded ]
        attempts:
          type: integer
        status:
          type: string
          enum: [ pending, requeued, discarded ]
        envelope:
          type: object
          additionalProperties: true
        correlationId:
          type: [ string, 'null' ]
        discardedReason:
          type: [ string, 'null' ]
        auditTrail:
          type: boolean
      required:
        - letterId
        - sourceId
        - reason
        - attempts
        - status
        - envelope
        - auditTrail
    DeadLetterRecordResponse:
      type: object
      properties:
        record:
          $ref: '#/components/schemas/DeadLetter'
        created:
          type: boolean
      required:
        - record
        - created
    DeadLetterTransitionResult:
      type: object
      properties:
        letterId:
          type: string
        from:
          type: string
        to:
          type: string
        attempts:
          type: integer
      required:
        - letterId
        - from
        - to
    SimulationRunRequest:
      type: object
      description: >
        仿真运行请求（ADR-025 / NO-12a）。契约权威源： contracts/simulation/simulation-run.schema.json（4 kind / 4 status 封闭注册表 + isSimulation=true 隔离强制 + baseRef 可追溯 + completed/failed 终态契约）。
      properties:
        runId:
          type: string
          description: 可选幂等键；缺省由服务端确定性生成
        kind:
          type: string
          enum: [ what_if, capacity, layout, material_flow ]
        baseRef:
          type: object
          description: 基准世界快照引用（snapshotVersion ≥ 0 + 可选 scenarioId）
          properties:
            snapshotVersion:
              type: integer
              minimum: 0
            scenarioId:
              type: string
          required:
            - snapshotVersion
        parameters:
          type: object
          description: 评估器输入（kind 决定形状，fail-closed）
          additionalProperties: true
        engineVersion:
          type: string
      required:
        - kind
        - baseRef
        - parameters
    SimulationRun:
      type: object
      properties:
        runId:
          type: string
        kind:
          type: string
          enum: [ what_if, capacity, layout, material_flow ]
        status:
          type: string
          enum: [ created, running, completed, failed ]
        isSimulation:
          type: boolean
        baseRef:
          type: object
          additionalProperties: true
        parameters:
          type: object
          additionalProperties: true
        results:
          type: object
          additionalProperties: true
        failureReason:
          type: string
        engineVersion:
          type: string
        auditTrail:
          type: boolean
      required:
        - runId
        - kind
        - status
        - isSimulation
        - baseRef
        - parameters
        - engineVersion
        - auditTrail
    SimulationRunResponse:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/SimulationRun'
        created:
          type: boolean
      required:
        - run
        - created
