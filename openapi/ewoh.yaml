          schema:
            type: string
            enum: [ operator, team_lead, quality, equipment, manager ]
        - name: personId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Role workbench data
          content:
            application/json:
              schema:
                type: object
                required:
                  - role
                  - generatedAt
                  - authorizedRoles
                  - canDebug
                  - simulating
                  - data
                properties:
                  role:
                    type: string
                    enum: [ operator, team_lead, quality, equipment, manager ]
                  generatedAt:
                    type: string
                    format: date-time
                  authorizedRoles:
                    type: array
                    description: >
                      Workbench roles the authenticated user is allowed to view, resolved server-side from the JWT auth roles. A forged `role` query param is rejected (403) when it is not in this set.
                    items:
                      type: string
                      enum: [ operator, team_lead, quality, equipment, manager ]
                  canDebug:
                    type: boolean
                    description: >
                      Server-granted debug/diagnostics permission (admin only); never derived from a client localStorage flag.
                  simulating:
                    type: boolean
                    description: >
                      True when the requested role is not the user's own default role (admin simulate-as-role view).
                  data:
                    type: object
                    additionalProperties: true
