  /api/scheduler/field/my-work:
    get:
      tags:
        - scheduler
      summary: Field workbench projection — only the caller's own work
      description: >-
        现场作业台只读投影。范围由服务端从签名令牌中的账号↔人员绑定
        (personId) 推导，**不接受**客户端传入 personId。未绑定人员返回 403
        FIELD_WORK_PERSON_UNBOUND（fail-closed，不返回空列表充数）。
        与 GET /api/scheduler/executions 的区别：后者是全厂执行台账，仅限
        dispatcher/workshop_lead/global_admin；本端点允许 worker 读取本人工作。
      responses:
        '200':
          description: Caller's own field work
          content:
