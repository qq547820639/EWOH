  /api/observability/frontend-metrics:
    post:
      tags:
        - observability
      summary: Ingest frontend Web Vitals / route / API / offline metrics
      description: >
        Batch ingestion endpoint for browser metrics (LCP, CLS, INP, TTFB, route latency, API latency/failure, white screen, unhandled errors, offline sync latency/conflict rate). Records are bound to the requester's org from the auth token; sensitive values are redacted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ metrics ]
              properties:
                metrics:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [ name, value ]
                    properties:
                      name:
                        type: string
                        maxLength: 200
                      value:
                        type: number
                      tags:
                        type: object
                        additionalProperties: true
                      at:
                        type: integer
                        description: epoch ms
                requestId:
                  type: string
                traceId:
                  type: string
                page:
                  type: string
                buildVersion:
                  type: string
                deviceCategory:
                  type: string
      responses:
        '201':
          description: Accepted metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
        '400':
          description: Invalid metrics / missing org context
        '429':
          description: Rate limited
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
        - observability
      summary: Query ingested frontend metrics (org-isolated, roles restricted)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: metric
          in: query
          required: false
          schema:
            type: string
        - name: orgId
          in: query
          required: false
          schema:
            type: string
            description: only honored for global admins
      responses:
        '200':
          description: Query result with summary and org-scoped metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId:
                    type: string
                  summary:
                    type: object
                    additionalProperties:
                      type: number
                  metrics:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'

