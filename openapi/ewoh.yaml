  /api/exo/sessions:
    post:
      tags:
        - exo
      summary: "Start an exoskeleton-person binding session (ADR-032: contract fail-closed + active-unique + execution-boundary guards)"
      description: >-
        Starts an explicit, temporary, auditable wearer binding. The device row is locked
        (SELECT ... FOR UPDATE) for the duration of the transaction, so session starts are
        serialized against plan dispatch for the same device. Two execution-boundary rules
        apply: (1) the device must not already have another ACTIVE session (partial unique
        index + explicit conflict); (2) NO-39a — the device must not be committed to another
        person by an in-flight task (status dispatched/received/executing/paused/exception):
        a wearer different from the task assignee is rejected with 409
        EXO_SESSION_TASK_CONFLICT, a task without an assignee is rejected as well
        (fail-closed), and only the assignee may wear the device (human-machine pairing).
        Pre-dispatch tasks are proposals, not execution boundaries, and therefore do not
        block a session start; they are re-checked at dispatch time instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string }
                exoId: { type: string }
                personId: { type: string }
                startedAt: { type: string, format: date-time }
                expectedEndAt: { type: string, format: date-time }
                operatorId: { type: string }
                reason: { type: string }
                taskId:
                  type: string
                  description: >-
                    NO-40a: optional business task (ewoh_production_task.id) this wear belongs to.
                    When set and expectedEndAt is omitted, the task plan end is inherited as the
                    expected end (source task_plan_end); an explicit expectedEndAt always wins
                    (source operator). A task bound to a different device is rejected with 409.
                    Unknown task ids are rejected with 400 (the binding declaration is never
                    silently ignored).
              required:
                - exoId
                - personId
      responses:
        '201':
          description: Started session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        Conflict:
          $ref: '#/components/responses/Conflict'
        InternalError:
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - exo
      summary: List exo sessions (tenant-scoped ledger, includes history)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ active, ended, aborted ]
          required: false
        - in: query
          name: exoId
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Sessions in the caller tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/reminder-sweep:
    post:
      tags:
        - exo
      summary: "Sweep active exoskeleton sessions and raise idempotent reminders (NO-37a)"
      description: >-
        Scans ACTIVE exoskeleton sessions and creates idempotent in-app notifications on two
        dimensions. Time: sessions past their expected end (with a 15-minute grace) or worn
        continuously for at least 4 hours. Evidence (NO-42a, reusing the NO-41a cross-check):
        sessions whose declared wearer disagrees with the telemetry-reported wearer
        (telemetry_wearer_mismatch, high) or whose telemetry shows a fresh frame with no wearer
        and quiet metrics (telemetry_inactive_suspect, medium). Every tag carries its own
        deterministic id (NTF-EXO-<session>-<tag>[-user-<who>]-<channel>), so re-sweeping only
        increments duplicates; 'consistent', 'activity_only', 'stale_telemetry' and
        'no_telemetry' never raise a reminder. The sweep is read-only with respect to session
        state. Recipients are the workshop_lead role plus the
        wearer's own bound account (ewoh_user.person_id, resolved through the SECURITY DEFINER
        helper ewoh_find_active_users_by_person); wearers without a bound account are reported
        in unresolvedWearers instead of being silently dropped. Notification ids are derived
        from (sessionId, bucket, recipient, channel), so repeated sweeps only increment
        duplicates. The sweep is read-only with respect to session state: it never ends a
        session and never issues device commands. The same implementation runs on a periodic
        worker (EXO_SESSION_REMINDER_WORKER_INTERVAL_MS, default 10 minutes).
      responses:
        '200':
          description: Sweep counters (scanned/overdue/longRunning/created/duplicates/unresolvedWearers) + per-session notifications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/consistency:
    get:
      tags:
        - exo
      summary: "Cross-check declared wearer (session) against device telemetry (NO-41a)"
      description: >-
        Read-only reconciliation of every ACTIVE session against the latest telemetry frame of
        its device (DISTINCT ON (device_id), indexed by (org_id, device_id, ts DESC)).
        Verdicts: consistent (frame names the session wearer), wearer_mismatch (frame names a
        DIFFERENT person - a hard conflict that a human must resolve, the platform takes no
        side), activity_only (device is moving but the frame reported no wearer), inactive_suspect
        (frame reported no wearer and all metrics are quiet - "suspected" not "proven"),
        stale_telemetry (latest frame older than the freshness window, or unparsable timestamp:
        no conclusion), no_telemetry (no frame at all: absence of evidence, NOT evidence of
        absence). Notes in the response carry the same caveats for the UI to display verbatim.
      responses:
        '200':
          description: Per-session verdicts + summary counts + freshness window + caveat notes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/device-context:
    get:
      tags:
        - exo
      summary: "Device context for starting a session (NO-40a: in-flight tasks + bindable plan end)"
      description: >-
        Read-only context for one exoskeleton device: whether it is registered in the asset
        ledger, the ACTIVE session (if any), the in-flight tasks committed to it
        (dispatched/received/executing/paused/exception) and one actionable suggestion.
        The suggestion binds a task only when exactly one in-flight task exists (choosing
        among several is a human decision and is therefore not guessed), marks whether that
        task's assignee equals the person about to wear the device (human-machine pairing),
        and exposes the task plan end as an inheritable expectedEndAt (expired plan ends are
        never inherited). Binding the task at session start makes deviation samples
        comparable, which is what NO-38a aggregates.
      parameters:
        - in: query
          name: exoId
          schema:
            type: string
          required: true
          description: Canonical device identity (device:<business device id>).
        - in: query
          name: personId
          schema:
            type: string
          required: false
          description: Canonical person identity considered as the next wearer (for assignee matching).
      responses:
        '200':
          description: Device context (registered/activeSession/inFlightTasks/suggestion)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/deviation-summary:
    get:
      tags:
        - exo
      summary: "Aggregate planned-vs-actual session deviation (NO-38a runtime memory)"
      description: >-
        Aggregates COMPLETED (ended/aborted) exoskeleton sessions whose started_at falls inside
        the requested window into per-device or per-person deviation groups. Only sessions that
        record BOTH expectedEndAt and actualEndAt are comparable; sessions missing either
        timestamp are counted as notComparable and excluded from every rate. onTimeRate is null
        (never 0%) when the comparable sample is below the minSample threshold, and the response
        carries explicit notes describing the caveats. Results are capped and flagged with
        truncated=true when the cap is hit, so a partial window is never presented as full
        history.
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
          required: false
          description: Window length in days (default 30, normalized server-side).
        - in: query
          name: groupBy
          schema:
            type: string
            enum: [ device, person ]
          required: false
          description: Grouping dimension (default device).
      responses:
        '200':
          description: Deviation summary (totals + groups + minSample + truncated + caveat notes)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/{sessionId}:
    get:
      tags:
        - exo
      summary: Get one exo session (tenant-scoped)
      parameters:
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Session record
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/{sessionId}/correct-wearer:
    post:
      tags:
        - exo
      summary: Hand the exoskeleton over to the person the telemetry says is actually wearing it
      description: >-
        Closes the current session at the wearer hand-over point (CAS on the active session,
        reason plus a pointer to the successor) and opens a successor session for the actual
        wearer in one transaction. The declared wearer is never overwritten in place: the
        platform keeps both the mistaken and the corrected record, because 缺失 ≠ 事实 and
        the audit trail must show who wore what, when, and who decided the correction.
        Telemetry alone never triggers this call; a human (or an approved workflow) invokes it.
      parameters:
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personId:
                  type: string
                  description: Actual wearer; bare uuid and `person:<uuid>` are equivalent (ADR-006)
                endedBy: { type: string }
                reason: { type: string }
              required:
                - personId
      responses:
        '201':
          description: >-
            Correction applied (previous session ended, successor session started).
            The ended session's pending alerts are closed in the same transaction with
            `resolution=session_corrected` and `resolutionRef` pointing at the successor
            session; the response reports `resolvedNotificationCount` /
            `annotatedNotificationCount`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/{sessionId}/end:
    post:
      tags:
        - exo
      summary: End a session normally (state machine + endedBy required)
      description: >-
        Ends the session and, in the SAME transaction, closes every pending alert that
        was raised about it (NO-44a): those rows get `status=resolved` plus
        `resolution=session_ended`, `resolvedBy`, `resolvedAt`, `resolutionRef`, so an
        alert never lingers in someone's to-do list after the matter is handled and
        never disappears without a trace. The response therefore carries
        `resolvedNotificationCount` (pending → resolved) and `annotatedNotificationCount`
        (rows that were already read and only received the disposition metadata). Both
        fields are **absent** on the idempotent re-end path: "no disposition happened in
        this call" is not the same fact as "closed zero alerts".
      parameters:
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endedBy: { type: string }
                reason: { type: string }
              required:
                - endedBy
      responses:
        '201':
          description: Ended session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/exo/sessions/{sessionId}/abort:
    post:
      tags:
        - exo
      summary: Abort a session (state machine + endedBy required)
      description: >-
        Same disposition wiring as `end`, with `resolution=session_aborted` so an
        abnormal termination stays distinguishable from a normal hand-off in the
        alert history.
      parameters:
        - in: path
          name: sessionId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endedBy: { type: string }
                reason: { type: string }
              required:
                - endedBy
      responses:
        '201':
          description: Aborted session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/notifications:
    get:
      tags:
        - notifications
      summary: List in-app notifications (tenant + role scoped, ADR-030)
      description: >-
        Returns the notifications visible to the caller (tenant + role/user scoped).
        Notifications are derived facts; their `status` is one of pending / read /
        resolved / sent / failed, and `resolution` records **why a pending alert was
        closed by a disposition of its subject** (NO-44a: session ended / aborted /
        corrected). `read` means "a human looked at it"; `resolution` means "the
        matter was closed by an audited disposition" — the two are not interchangeable
        and `resolved` is never downgraded back to `read`.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ pending, read, resolved ]
          required: false
      responses:
        '200':
          description: Notifications visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    notificationId: { type: string }
                    status:
                      type: string
                      description: pending / read / resolved / sent / failed（投递状态与处置状态互不替代）
                    externalRef:
                      type: string
                      nullable: true
                      description: 主事实引用（外骨骼提醒=会话号）；处置按它定位待办提醒
                    resolution:
                      type: string
                      nullable: true
                      enum:
                        - session_ended
                        - session_aborted
                        - session_corrected
                        - approval_expired
                        - approval_superseded
                        - andon_cleared
                        - agent_approval_decided
                        - agent_approval_expired
                        - null
                      description: >-
                        处置类型（NULL=未被处置关闭）；未登记值由调用方原样展示。
                        session_* = 外骨骼会话侧（收工/中止/按实际佩戴人更正）；
                        approval_* = 执行边界授权侧（失效 / 被新审批取代）；
                        andon_cleared = 安灯被关闭（acknowledged/processing 不关闭提醒）；
                        agent_approval_* = Agent 待批命令被人处理 / 超时作废
                    resolvedAt: { type: string, nullable: true }
                    resolvedBy: { type: string, nullable: true }
                    resolutionRef:
                      type: string
                      nullable: true
                      description: 处置指向的引用（更正=新会话号；收工/中止=会话号）
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/notifications/metrics:
    get:
      tags:
        - notifications
      summary: Notification governance metrics (disposition rate/latency, aging, repeat sources)
      description: >-
        Read-only operating memory for the notification layer (NO-46a). Answers the
        management questions the disposition work made possible: how fast are alerts
        closed, which objects keep generating them, how many are left unattended, and
        whether push delivery failures were missed. Scope is identical to the
        notification list (tenant + role / addressed-to-me), so the numbers never cover
        more than the caller can act on. Time-to-resolve only counts comparable rows
        (both timestamps parseable and ordered); `dispositionRate` is null when the
        window holds fewer than `minSample` alerts — the UI must say "insufficient
        evidence" instead of showing 0%. Notification kinds come from the deterministic
        id rules; unregistered shapes land in other/unknown rather than being guessed.
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          required: false
      responses:
        '200':
          description: Governance summary (totals / rates / latency / aging / byKind / topSources + notes)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/notifications/{id}/read:
    post:
