      responses:
        '200':
          description: Published retrospective
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrospectiveRecord' }
        NotFound:
          $ref: '#/components/responses/NotFound'
  /api/retrospective/{retrospectiveId}/lessons:
    post:
      tags:
        - retrospective
      summary: Revise lessons (AI-suggested lessons are human-editable; memory belongs to people)
      parameters:
        - name: retrospectiveId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lessons:
                  type: array
                  items: { $ref: '#/components/schemas/RetrospectiveLesson' }
      responses:
        '200':
          description: Updated retrospective
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetrospectiveRecord' }
        NotFound:
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    IngestKey:
      type: apiKey
      in: header
      name: X-Ingest-Key
  parameters:
    OrgIdHeader:
      name: X-Org-Id
      in: header
      required: true
      description: Target organization UUID for machine-to-machine ingestion
      schema:
