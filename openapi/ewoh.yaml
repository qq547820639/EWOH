      summary: Delivery backlog history snapshots (newest first, NO-91a)
      description: >
        投递积压**历史序列**（最近在前）。每次巡检顺带落一条历史快照，趋势可见、漂移早发现。
        `limit` 上限 48（超出按 48 截断）；无快照如实返回空数组（不伪造趋势，原则 7）。
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
          description: 最多返回的快照条数（最近 N 条）。
      responses:
        '200':
          description: Backlog history (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [slaMs, escalationMultiplier, snapshots]
                properties:
                  slaMs: { type: integer }
                  escalationMultiplier: { type: integer }
                  snapshots:
                    type: array
                    description: 最近在前；空数组=尚无历史快照（巡检从未运行）。
                    items:
                      type: object
                      required: [checkedAt, commands, undelivered, receivedNotExecuted, escalatedDevices]
                      properties:
                        checkedAt: { type: string }
                        commands: { type: integer }
                        undelivered: { type: integer }
                        receivedNotExecuted: { type: integer }
                        escalatedDevices: { type: integer }
        Unauthorized:
