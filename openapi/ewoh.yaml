        authority:
          type: string
          enum: [ registration, adapter, manual ]
        validFrom:
          type: [ string, 'null' ]
          format: date-time
        validTo:
          type: [ string, 'null' ]
          format: date-time
        evidenceId:
          type: [ string, 'null' ]
      required:
        - source
        - target
        - authority
