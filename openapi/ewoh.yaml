openapi: 3.0.3
info:
  title: EWOH Embodied Factory OS API
  version: 1.0.0
  description: >-
    OpenAPI contract for EWOH NestJS controllers. Auth, dashboard, world, task, resource, alert, approval, control, AI,
    scheduler, gamification, ingest, files, simulator, spatial, system, audit, and health surfaces.
servers:
  - url: https://api.ewoh.local
    description: Production/edge gateway
  - url: http://127.0.0.1:3000
    description: Local NestJS dev server
security:
  - BearerAuth: []
tags:
  - name: auth
  - name: world
  - name: devices
  - name: organization
  - name: spatial
  - name: tasks
  - name: resources
  - name: alerts
  - name: approvals
  - name: control
  - name: ai
  - name: audit
  - name: system
  - name: scheduler
  - name: gamification
  - name: ingest
  - name: simulator
  - name: files
  - name: health
  - name: view
paths:
  /api/auth/login:
    post:
      tags:
        - auth
      summary: Login
      description: Authenticates an active EWOH user and issues access/refresh token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        TooManyRequests:
          $ref: '#/components/responses/TooManyRequests'
        ServiceUnavailable:
          $ref: '#/components/responses/ServiceUnavailable'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh token
      description: Rotates a refresh token and returns a new token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        TooManyRequests:
          $ref: '#/components/responses/TooManyRequests'
        ServiceUnavailable:
          $ref: '#/components/responses/ServiceUnavailable'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags:
        - auth
      summary: Logout
      description: Revokes the presented refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        ServiceUnavailable:
          $ref: '#/components/responses/ServiceUnavailable'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      tags:
        - auth
      summary: Current auth user
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags:
        - auth
      summary: Current user context
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/snapshot:
    get:
      tags:
        - world
      summary: World snapshot
      description: Returns the next snapshot version, opaque cursor, entities, and generation time.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldSnapshot'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/delta:
    get:
      tags:
        - world
      summary: World delta
      description: Returns incremental world changes after the supplied cursor.
      parameters:
        - name: cursor
          in: query
          required: true
          description: Opaque cursor from snapshot or previous delta
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of deltas
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldDelta'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Gone:
          $ref: '#/components/responses/Gone'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/replay:
    get:
      tags:
        - world
      summary: World replay
      description: Returns minute-level replay snapshots for the requested window.
      parameters:
        - name: from
          in: query
          required: false
          description: ISO 8601 window start
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: ISO 8601 window end
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum snapshot count
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaySnapshotList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/state:
    get:
      tags:
        - world
      summary: Current world state
      description: Aggregates person, device, workstation, and recent event state.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWorldState'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/events/chain/{eventId}:
    get:
      tags:
        - world
      summary: Event causal chain
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event id
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventChain'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices:
    get:
      tags:
        - devices
      summary: List devices
      parameters: &ref_0
        - &ref_1
          name: keyword
          in: query
          required: false
          description: Search by device id, worker name, or model
          schema:
            type: string
        - &ref_2
          name: online
          in: query
          required: false
          description: Filter by online state
          schema:
            type: boolean
        - &ref_3
          name: batteryMin
          in: query
          required: false
          description: Minimum battery percentage
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - &ref_4
          name: batteryMax
          in: query
          required: false
          description: Maximum battery percentage
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - &ref_5
          name: sourceType
          in: query
          required: false
          description: simulated, real, or controlled_test
          schema:
            type: string
        - &ref_6
          name: model
          in: query
          required: false
          description: Device model
          schema:
            type: string
        - &ref_7
          name: orderby
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - battery
              - batteryDesc
              - lastTelemetryAt
              - lastTelemetryAtDesc
              - deviceId
              - deviceIdDesc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices/{id}:
    get:
      tags:
        - devices
      summary: Device detail
      parameters:
        - name: id
          in: path
          required: true
          description: Device id
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        NotFound:
          $ref: '#/components/responses/NotFound'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices/{id}/bindings:
    post:
      tags:
        - devices
      summary: Bind device to spatial entity or person
      parameters:
        - name: id
          in: path
          required: true
          description: Device id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindDeviceRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBinding'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/overview:
    get:
      tags:
        - devices
      summary: Dashboard overview
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewStats'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/environment/summary:
    get:
      tags:
        - devices
      summary: Latest environment readings per sensor
      responses:
        '200':
          description: Environment readings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    sensorId:
                      type: string
                    entityId:
                      type: string
                      nullable: true
                    temperature:
                      type: number
                      nullable: true
                    vibration:
                      type: number
                      nullable: true
                    noise:
                      type: number
                      nullable: true
                    airQuality:
                      type: number
                      nullable: true
                    ts:
                      type: string
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
  /api/dashboard/devices:
    get:
      tags:
        - devices
      summary: List dashboard devices
      parameters: *ref_0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - devices
      summary: Create device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/devices/search:
    get:
      tags:
        - devices
      summary: Paginated device search
      description: Searches devices with the 19-dimension filter surface.
      parameters:
        - *ref_1
        - *ref_2
        - *ref_3
        - *ref_4
        - *ref_5
        - *ref_6
        - *ref_7
        - name: firmwareVersion
          in: query
          required: false
          description: Firmware version filter
          schema:
            type: string
        - name: protocolVersion
          in: query
          required: false
          description: Protocol version filter
          schema:
            type: string
        - name: faultCode
          in: query
          required: false
          description: Fault code filter
          schema:
            type: string
        - name: bindingStatus
          in: query
          required: false
          description: Binding state filter
          schema:
            type: string
            enum:
              - bound
              - unbound
        - name: page
          in: query
          required: false
          description: One-based page
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSearchResult'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/devices/{deviceId}:
    patch:
      tags:
        - devices
      summary: Update device
      parameters:
        - name: deviceId
          in: path
          required: true
          description: Device id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        NotFound:
          $ref: '#/components/responses/NotFound'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/devices/{deviceId}/bindings:
    get:
      tags:
        - devices
      summary: Get device bindings
      parameters:
        - name: deviceId
          in: path
          required: true
          description: Device id
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBinding'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - devices
      summary: Bind dashboard device
      parameters:
        - name: deviceId
          in: path
          required: true
          description: Device id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindDeviceRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBinding'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - devices
      summary: Unbind dashboard device
      parameters:
        - name: deviceId
          in: path
          required: true
          description: Device id
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/events:
    get:
      tags:
        - devices
      summary: List recent events
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum rows
          schema:
            type: integer
            default: 50
        - name: status
          in: query
          required: false
          description: Event status filter
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/events/stats:
    get:
      tags:
        - devices
      summary: Event statistics
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStats'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/events/{eventId}/handle:
    post:
      tags:
        - devices
      summary: Handle event
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandleEventRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        NotFound:
          $ref: '#/components/responses/NotFound'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/telemetry/{deviceId}:
    get:
      tags:
        - devices
      summary: Device telemetry
      parameters:
        - name: deviceId
          in: path
          required: true
          description: Device id
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum rows
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/workers:
    get:
      tags:
        - devices
      summary: Worker load summary
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerLoadList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/organization:
    get:
      tags:
        - organization
      summary: List organizations
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - organization
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/organization/tree:
    get:
      tags:
        - organization
      summary: Organization tree
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTree'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/organization/{id}:
    patch:
      tags:
        - organization
      summary: Update organization
      parameters:
        - name: id
          in: path
          required: true
          description: Organization id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationDto'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        NotFound:
          $ref: '#/components/responses/NotFound'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/personnel:
    get:
      tags:
        - organization
      summary: List personnel
      parameters:
        - name: keyword
          in: query
          required: false
          description: Search by name, employee number, or position
          schema:
            type: string
        - name: orgId
          in: query
          required: false
          description: Organization id filter
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Personnel status filter
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonnelList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - organization
      summary: Create personnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonnelDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonnelInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/personnel/{id}:
    get:
      tags:
        - organization
      summary: Personnel detail
      parameters:
        - name: id
          in: path
          required: true
          description: Personnel id
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonnelInfo'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        NotFound:
          $ref: '#/components/responses/NotFound'
        InternalError:
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - organization
      summary: Update personnel
      parameters:
        - name: id
          in: path
          required: true
          description: Personnel id
          schema:
            type: string
      requestBody:
