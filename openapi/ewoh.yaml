openapi: 3.0.3
info:
  title: EWOH Embodied Factory OS API
  version: 1.0.0
  description: >-
    OpenAPI contract for EWOH NestJS controllers. Auth, dashboard, world, task, resource, alert, approval, control, AI, scheduler, gamification, ingest, files, simulator, spatial, system, audit, and health surfaces.
servers:
  - url: https://api.ewoh.local
    description: Production/edge gateway
  - url: http://127.0.0.1:3000
    description: Local NestJS dev server
security:
  - BearerAuth: []
tags:
  - name: auth
  - name: world
  - name: devices
  - name: organization
  - name: spatial
  - name: tasks
  - name: resources
  - name: alerts
  - name: approvals
  - name: control
  - name: ai
  - name: audit
  - name: system
  - name: scheduler
  - name: gamification
  - name: ingest
  - name: simulator
  - name: files
  - name: health
  - name: view
  - name: operations
  - name: parameters
  - name: aas
  - name: observability
paths:
  /api/auth/login:
    post:
      tags:
        - auth
      summary: Login
      description: Authenticates an active EWOH user and issues access/refresh token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        TooManyRequests:
          $ref: '#/components/responses/TooManyRequests'
        ServiceUnavailable:
          $ref: '#/components/responses/ServiceUnavailable'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh token
      description: Rotates a refresh token and returns a new token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        TooManyRequests:
          $ref: '#/components/responses/TooManyRequests'
        ServiceUnavailable:
          $ref: '#/components/responses/ServiceUnavailable'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      tags:
        - auth
      summary: Logout
      description: Revokes the presented refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        ServiceUnavailable:
          $ref: '#/components/responses/ServiceUnavailable'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      tags:
        - auth
      summary: Current auth user
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      tags:
        - auth
      summary: Current user context
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/snapshot:
    get:
      tags:
        - world
      summary: World snapshot
      description: Returns the next snapshot version, opaque cursor, entities, and generation time.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldSnapshot'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/delta:
    get:
      tags:
        - world
      summary: World delta
      description: Returns incremental world changes after the supplied cursor.
      parameters:
        - name: cursor
          in: query
          required: true
          description: Opaque cursor from snapshot or previous delta
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of deltas
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldDelta'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Gone:
          $ref: '#/components/responses/Gone'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/replay:
    get:
      tags:
        - world
      summary: World replay
      description: Returns minute-level replay snapshots for the requested window.
      parameters:
        - name: from
          in: query
          required: false
          description: ISO 8601 window start
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: ISO 8601 window end
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum snapshot count
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaySnapshotList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/replay/context/{eventId}:
    get:
      tags:
        - world
      summary: Event before/during/after replay context
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - name: windowMinutes
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Before/during/after snapshots around the event
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        NotFound:
          $ref: '#/components/responses/NotFound'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/replay/items:
    post:
      tags:
        - world
      summary: Create issue/task/evidence from a replay event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - eventId
                - kind
              properties:
                eventId:
                  type: string
                kind:
                  type: string
                  enum: [ issue, task, evidence ]
                title:
                  type: string
                note:
                  type: string
                replayTime:
                  type: string
      responses:
        '201':
          description: Replay-derived event created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        NotFound:
          $ref: '#/components/responses/NotFound'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/state:
    get:
      tags:
        - world
      summary: Current world state
      description: Aggregates person, device, workstation, and recent event state.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWorldState'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/world/events/chain/{eventId}:
    get:
      tags:
        - world
      summary: Event causal chain
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event id
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventChain'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices:
    get:
      tags:
        - devices
      summary: List devices
      parameters: &ref_0
        - &ref_1
          name: keyword
          in: query
          required: false
          description: Search by device id, worker name, or model
          schema:
            type: string
        - &ref_2
          name: online
          in: query
          required: false
          description: Filter by online state
          schema:
            type: boolean
        - &ref_3
          name: batteryMin
          in: query
          required: false
          description: Minimum battery percentage
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - &ref_4
          name: batteryMax
          in: query
          required: false
          description: Maximum battery percentage
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - &ref_5
          name: sourceType
          in: query
          required: false
          description: real, controlled_test, simulated, replayed, stale, or offline
          schema:
            type: string
        - &ref_6
          name: model
          in: query
          required: false
          description: Device model
          schema:
            type: string
        - &ref_category
          name: category
          in: query
          required: false
          description: "Device category filter (device-category vocabulary): exoskeleton, environment_sensor, camera, location_tag, or unknown (rows with no category)."
          schema:
            type: string
            enum:
              - exoskeleton
              - environment_sensor
              - camera
              - location_tag
              - unknown
        - &ref_7
          name: orderby
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum:
              - battery
              - batteryDesc
              - lastTelemetryAt
              - lastTelemetryAtDesc
              - deviceId
              - deviceIdDesc
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - devices
      summary: Create device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices/{id}:
    get:
      tags:
        - devices
      summary: Device detail
      parameters:
        - name: id
          in: path
          required: true
          description: Device id
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        NotFound:
          $ref: '#/components/responses/NotFound'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/device-responsibilities/coverage:
    get:
      tags:
        - devices
      summary: Responsibility coverage for a shift (NO-52a handover readiness)
      description: >-
        The question a shift handover must answer: for the incoming shift, which devices
        have nobody responsible? Coverage counts a device as covered when it has a holder
        for the given shift or an all-day holder; devices whose only holders belong to
        *other* shifts are reported as gaps (with the reason per device). The check does
        NOT require the holder to have a login account — that is a separate gap reported
        by the alert-routing path (this endpoint answers "is anyone responsible", not
        "can we reach them"). When the current shift cannot be resolved the response says
        `shiftUnknown: true` instead of guessing a default shift.
      parameters:
        - in: query
          name: shiftId
          schema:
            type: string
          required: false
          description: >-
            Shift to check (omit = current shift; empty string = explicitly unknown shift).
      responses:
        '200':
          description: Coverage snapshot (shiftId / totals / per-device gaps / notes)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/device-responsibilities:
    get:
      tags:
        - devices
      summary: Batch-read device responsibility assignments (NO-50a, tenant scoped)
      description: >-
        One request for a whole device-list page (avoids N+1). `deviceIds` is an optional
        comma-separated list of business device ids; omitting it returns every active
        assignment in the caller's tenant (capped). Tenant scope always comes from the
        caller context — a caller can never read another tenant's assignments. This is
        the fact the device ledger UI uses to show who would be alerted for a device.
      parameters:
        - in: query
          name: deviceIds
          schema:
            type: string
          required: false
          description: Comma-separated business device ids (e.g. `EXO-1,ENV-2`)
        - in: query
          name: activeOnly
          schema:
            type: boolean
            default: true
          required: false
      responses:
        '200':
          description: Responsibility rows (active by default)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices/{deviceId}/responsibilities:
    get:
      tags:
        - devices
      summary: List device responsibility assignments (NO-49a, tenant scoped)
      description: >-
        Who is responsible for this device (owner / operator / maintainer). This is the
        fact that lets alerts be addressed to a person instead of broadcast to a role.
        At most one active holder per (device, responsibility); history is kept by
        deactivating the previous row. Readable by any authenticated field/management
        role (coordination needs it); writes are restricted to workshop_lead /
        safety_admin / global_admin.
      parameters:
        - in: path
          name: deviceId
          schema:
            type: string
          required: true
        - in: query
          name: activeOnly
          schema:
            type: boolean
            default: true
          required: false
      responses:
        '200':
          description: Responsibility rows (active by default)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - devices
      summary: Assign a device responsibility to a person (NO-49a)
      description: >-
        Same responsibility set twice for the same person is idempotent (no new history
        row, no extra audit). Assigning a different person deactivates the previous
        active row in the same transaction (history preserved). The device must exist in
        this tenant's ledger (404 otherwise — the platform never invents shadow devices),
        and a concurrent change is reported as 409 instead of silently creating two
        active holders.
      parameters:
        - in: path
          name: deviceId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                personId:
                  type: string
                  description: Canonical person identity (bare uuid and `person:<uuid>` are equivalent)
                responsibility:
                  type: string
                  enum: [owner, operator, maintainer]
                shiftId:
                  type: string
                  description: >-
                    Shift this responsibility applies to (`ewoh_shift.shift_id`).
                    Omit/empty = all-day responsibility (the fallback for every shift, NO-51a).
                    Routing prefers the current shift's holder and falls back to the all-day
                    holder; holders of *other* shifts are never alerted but are reported as
                    gaps (`outOfShiftPersons`).
                note: { type: string }
              required:
                - personId
                - responsibility
      responses:
        '201':
          description: Responsibility assigned (previous holder deactivated if any)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices/{deviceId}/responsibilities/{responsibility}:
    delete:
      tags:
        - devices
      summary: Release a device responsibility (NO-49a)
      description: >-
        Deactivates the current holder (history preserved, audit written). Returns 409
        when there is no active holder — removing a responsibility nobody holds is not a
        silent success.
      parameters:
        - in: path
          name: deviceId
          schema:
            type: string
          required: true
        - in: path
          name: responsibility
          schema:
            type: string
            enum: [owner, operator, maintainer]
          required: true
        - in: query
          name: shiftId
          schema:
            type: string
          required: false
          description: Shift of the responsibility to release (omit = the all-day one, NO-51a)
      responses:
        '200':
          description: Responsibility released
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices/{id}/bindings:
    post:
      tags:
        - devices
      summary: Bind device to spatial entity or person
      parameters:
        - name: id
          in: path
          required: true
          description: Device id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindDeviceRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBinding'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/devices/{id}/capabilities/{capabilityKey}/status:
    post:
      tags:
        - devices
      summary: Disable or restore a device capability (human lifecycle action)
      description: >
        能力决定派工资格（requiredDeviceCapabilities 匹配）。停用立即从调度可见能力中移除；
        恢复前按权威契约重新校验（词表外能力名拒绝恢复）。理由必填并写入审计；
        幂等：状态未变化时 changed=false（不写库、不记审计）。
      parameters:
        - name: id
          in: path
          required: true
          description: 业务设备号（ewoh_device.device_id）
          schema:
            type: string
        - name: capabilityKey
          in: path
          required: true
          description: 能力名（如 observe.temperature）
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDeviceCapabilityStatusRequest'
      responses:
        '200':
          description: 状态变更结果（幂等 no-op 时 changed=false）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetDeviceCapabilityStatusResponse'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        NotFound:
          $ref: '#/components/responses/NotFound'
        Conflict:
          $ref: '#/components/responses/Conflict'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/now:
    get:
      tags:
        - dashboard
      summary: '工作台聚合——现在需要我做什么'
      description: >
        班组长/调度员开机第一眼：把散落在异常/通知等域的"需要人处理"事实聚合为
        统一优先级列表。范围裁决：待审批/物料缺口/逾期行动项已有各自叫人机制，
        本端点聚合的是目前没有独立叫人机制的域（开异常 + 严重级通知）。
      responses:
        '200':
          description: 聚合结果（按优先级排序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [anomaly, notification, material_gap, approval] }
                        priority: { type: integer }
                        title: { type: string }
                        ref: { type: string }
                        route: { type: string }
                        severity: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        detail: { type: string, description: '附加量化信息' }
                  generatedAt: { type: string, format: date-time }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/overview:
    get:
      tags:
        - devices
      summary: Dashboard overview
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewStats'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/environment/summary:
    get:
      tags:
        - devices
      summary: Latest environment readings per sensor
      responses:
        '200':
          description: Environment readings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    sensorId:
                      type: string
                    entityId:
                      type: string
                      nullable: true
                    temperature:
                      type: number
                      nullable: true
                    vibration:
                      type: number
                      nullable: true
                    noise:
                      type: number
                      nullable: true
                    airQuality:
                      type: number
                      nullable: true
                    ts:
                      type: string
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
  /api/dashboard/devices:
    get:
      tags:
        - devices
      summary: List dashboard devices
      parameters: *ref_0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - devices
      summary: Create device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceInfo'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/dashboard/devices/search:
    get:
      tags:
        - devices
      summary: Paginated device search
      description: Searches devices with the 19-dimension filter surface.
      parameters:
