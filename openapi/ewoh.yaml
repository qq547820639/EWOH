        - scheduler
      summary: Inject scheduling event (v0.7 B2) - event-driven partial replan
      description: >-
        Ingest / MES / edge bridge event source endpoint. Accepts a real business event (device offline, route blocked, safety event, etc.) and triggers a ReplanCoordinator partial replan (impact analysis -> freeze unrelated tasks -> solve -> persist -> circuit breaker). Idempotency and cooldown are guaranteed by TriggerService (same triggerKey dedup + cooldown window, cross-process reliable). On failure the run is marked failed and logged; the event source is never blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulingEventRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
