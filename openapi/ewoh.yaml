      responses:
        '200':
          description: Recorded handover (idempotent re-create returns existing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  record: { $ref: '#/components/schemas/ShiftHandover' }
                  created: { type: boolean }
  /api/data-quality/gap-sweep:
    post:
      tags:
        - data-quality
      summary: Sweep open data-quality alerts and notify the people who must verify them (NO-53a)
      description: >
        摄入侧自动分级开 `DataQualityAlert` 后，没人被主动叫到 → 告警只是躺在事件表里。
        本端点扫描本租户 open 的 `DataQualityAlert`（仅 `requiresHumanVerification`
        的告警码才打扰人），把"该核实这批数据"叫到 责任人（班次感知：本班优先/全天
        兜底/他班报缺口）+ 角色兜底。边界：只读业务事实（不改告警状态、不写 evidence），
        只写确定性通知与审计；人工判定只能走 POST /api/data-quality/confirmations，
        缺失字段如实进正文不猜。幂等：重复扫描只累加 duplicates。
      responses:
        '200':
          description: Sweep result (idempotent; re-running only accumulates duplicates)
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId: { type: string, format: uuid }
                  scanned: { type: integer, description: 本租户 open DataQualityAlert 数 }
                  notifyRequired: { type: integer, description: 其中需要人核实的告警数 }
                  created: { type: integer }
                  duplicates: { type: integer }
                  unresolvedResponsiblePersons:
                    type: array
                    items: { type: string }
                  outOfShiftResponsiblePersons:
                    type: array
                    items: { type: string }
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        alertEventId: { type: string }
                        bucket:
                          type: string
                          enum: [quality_alert, quality_aging]
                          description: 当前实现只产生 quality_alert；quality_aging（长时间未核实再催）为预留桶，尚未写入
                        recipients:
                          type: array
                          items: { type: string }
                  generatedAt: { type: string, format: date-time }
  /api/data-quality/confirmations:
    post:
      tags:
        - data-quality
      summary: Register human data-quality verdict for one event (DR-4, standalone_076)
      description: >
        confirmed=可信可用于决策（联动 resolve 同源 open DataQualityAlert）；
        contested=不可信相关决策需复核（告警保持 open 持续可见）。判定人取
        服务端会话（不信任客户端自报身份）。幂等：同事件改判=覆盖+审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, verdict]
              properties:
                eventId: { type: string }
                verdict: { type: string, enum: [confirmed, contested] }
                note: { type: string }
      responses:
        '200':
          description: Confirmation record + linked alert resolution count
          content:
            application/json:
              schema:
                type: object
                properties:
                  record: { $ref: '#/components/schemas/DataQualityConfirmation' }
                  created: { type: boolean }
                  linkedAlertsResolved: { type: integer }
                  resolvedNotificationCount:
                    type: integer
                    description: 同事务内被处置的"待核实提醒"条数（NO-53a 处置终态）
    get:
      tags:
        - data-quality
      summary: Batch query confirmation status for events
      parameters:
        - name: eventIds
          in: query
          required: true
          schema: { type: string, description: 逗号分隔，至多 100 个 }
      responses:
        '200':
          description: Confirmations (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DataQualityConfirmation' }
  /api/retrospective:
