  /api/control/requests:
    get:
      tags:
        - control
      summary: Device execution boundary (human read surface, NO-66a)
      description: >
        现场读面：一台设备的控制命令现在处于什么状态、为什么。平台此前只把这个事实
        开给网关（机器身份 `pending`），现场问"这台设备为什么不动"只能翻库。
        逐条返回投递态（待投递 / **排队（设备忙，一车一活）** / 已投递未回执 / 终态）、
        授权指纹方案与**是否复核通过**（两件事分开）、投递确认与执行回执事实、
        以及违规留痕（`delivery_rejected` / `authorization_violation`——安全事件不与
        "执行失败"混为一谈）。只读；租户与角色收敛（dispatcher/workshop_lead/safety_admin/device_ops）。
      parameters:
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Device execution boundary snapshot
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, commands, summary, checkedAt]
                properties:
                  deviceId: { type: string }
                  checkedAt: { type: string }
                  summary:
                    type: object
                    properties:
                      inFlight: { type: integer }
                      queued: { type: integer }
                      awaitingDelivery: { type: integer }
                      revoked: { type: integer }
                      busyBlocker:
                        type: string
                        nullable: true
                        description: 占用设备的在飞命令 `<commandKey>:<commandId>`；null = 设备空闲
                      quota:
                        type: object
                        description: NO-67b 投递配额现状（与 pending 读面同一计量口径：delivered_at + 60s 窗口）
                        properties:
                          perMinute: { type: integer }
                          usedInWindow: { type: integer }
                          remaining: { type: integer, nullable: true }
                  commands:
                    type: array
                    items:
                      type: object
                      properties:
                        commandId: { type: string }
                        requestId: { type: string }
                        commandKey: { type: string }
                        attemptNo: { type: integer }
                        status: { type: string }
                        deliveryState:
                          type: string
                          description: awaiting_delivery | queued_device_busy | gateway_received | executed | failed | revoked | expired
                        deliveryNote: { type: string, nullable: true }
                        sentAt: { type: string, nullable: true }
                        deliveredAt:
                          type: string
                          nullable: true
                          description: >
                            NO-67b：平台把命令交给网关的时刻（投递路径唯一写入点）。
                            NULL = 从未交付。与 `authorizationVerifiedAt`（授权复核通过，下发前也会写）
                            是两个事实——"下发 ≠ 交付"。
                        responseAt: { type: string, nullable: true }
                        revokedReason: { type: string, nullable: true }
                        revokedReasonLabel: { type: string, nullable: true }
                        queuedReason:
                          type: string
                          nullable: true
                          enum: [device_busy, quota]
                          description: >
                            NO-81a 排队原因：device_busy = 一车一活（等设备空下来）；
                            quota = 配额用尽（等下一分钟窗口）。null = 未排队。
                            两者都不是失败，但**解除条件不同**——现场据此决定等着还是去催。
                        fingerprintScheme: { type: string, enum: [hmac-sha256:v2, fnv1a64:v1, none] }
                        fingerprintVerified: { type: boolean }
                        executable: { type: boolean }
                        ack:
                          type: object
                          nullable: true
                          properties:
                            delivered: { type: boolean }
                            reason: { type: string, nullable: true }
                            at: { type: string, nullable: true }
                        receipt:
                          type: object
                          nullable: true
                          properties:
                            result: { type: string, nullable: true }
                            at: { type: string, nullable: true }
                        violations:
                          type: array
                          items:
                            type: object
                            properties:
                              resultType: { type: string }
                              resultCode: { type: string, nullable: true }
                              at: { type: string, nullable: true }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
    post:
      tags:
