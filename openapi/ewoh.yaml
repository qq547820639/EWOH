  /api/ingest/execution-facts:
    post:
      tags:
        - ingest
      summary: Ingest device-measured execution fact (sole writer of source=device_receipt)
      description: >
        设备执行事实接入 —— **`device_receipt` 来源的唯一写入方**。
        `execution-receipt-provenance` 的资格判定要求持久化执行行 `source='device_receipt'`，
        而此前**全仓没有任何写入方产出该值**（HTTP 回执路径只可能写 simulated/manual_report），
        所以 `real` 分支不可达、现场回执永远无法成为生产训练样本。本端点补上这条合法路径：
        由**机器身份**（X-Ingest-Key）上报设备自己测得的执行时间。

        安全边界（逐条有测试锁定）：
        (1) **只接受带 org 绑定的 ingest key** —— legacy 无绑定模式（org 由客户端 X-Org-Id 自报）
        一律 403 `DEVICE_FACT_REQUIRES_BOUND_KEY`，否则任何持无绑定 key 者可声称任意租户并产出
        "看起来合法"的训练数据；(2) **设备只能报自己的活** —— 执行行已记录的 deviceId 必须非空
        且等于上报 deviceId，否则 403；(3) **不创建计划** —— 按 (orgId, assignmentId) 解析既有执行行，
        不存在则 404；(4) **时间必须是设备测得值** —— `actualStartAt` 必填、`COMPLETED` 必须带
        `actualEndAt` 且不早于 start，服务端**不**从 now() 兜底；(5) **不推进任务状态** ——
        本端点只写执行事实，任务/方案状态推进仍由既有回执应用服务负责。

        即便写入成功也**不自动可训练**：`receiptProvenance` 仍要求 task.source=real、
        device.sourceType=real、方案非 shadow、审批人 ≠ 生成人、且 plan.confirmedAt ≤
        execution.actualStartAt。模拟与联调环境因此无法获得训练样本（设计意图）。
      security: *ref_8
      parameters: *ref_ingest_org
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, assignmentId, actualStartAt, status]
              properties:
                deviceId:
                  type: string
                  description: 上报设备（必须与该执行行已记录的 deviceId 一致）
                assignmentId:
                  type: string
                  description: 执行行定位键（设备事实附到既有执行行，不新建）
                actualStartAt:
                  type: string
                  format: date-time
                  description: 设备测得的实际开始时间（服务端不代填）
                actualEndAt:
                  type: string
                  format: date-time
                  description: 设备测得的实际结束时间（status=COMPLETED 时必填）
                status:
                  type: string
                  enum: [STARTED, COMPLETED]
                metrics:
                  type: object
                  additionalProperties: true
                  description: 设备侧附加测量（原样留存供溯源，不参与资格判定）
      responses:
        '201':
          description: 设备事实已记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionId: { type: string }
                  assignmentId: { type: string }
                  deviceId: { type: string }
                  status: { type: string }
                  source:
                    type: string
                    description: 恒为 device_receipt（本端点唯一值）
                  actualStartAt: { type: string, format: date-time }
                  actualEndAt: { type: string, format: date-time, nullable: true }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        NotFound:
          $ref: '#/components/responses/NotFound'
        TooManyRequests:
          $ref: '#/components/responses/TooManyRequests'
        InternalError:
          $ref: '#/components/responses/InternalError'
