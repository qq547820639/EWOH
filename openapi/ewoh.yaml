        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/control/delivery-backlog/sweep:
    post:
      tags:
        - control
      summary: Sweep control commands stuck in delivery backlog
      description: >
        NO-68a：把"命令下发后迟迟没投到设备"变成一条叫到人的提醒。
        扫本租户内 `status=sent` 且 `delivered_at is null` 且下发已超过投递 SLA
        （`EWOH_CONTROL_DELIVERY_SLA_MS`，默认 5 分钟）的命令，按设备聚合成
        确定性 notificationId 的提醒（收件人 dispatcher / workshop_lead / device_ops，
        重复扫描只累加 `duplicates`），并写 `control.delivery_backlog_sweep` 审计。
        **只读命令与设备事实**：不改状态、不代替人投递、不撤销任何命令。
        同一实现由定时 worker 复跑（`CONTROL_BACKLOG_WORKER_INTERVAL_MS`，默认 10 分钟，
        `CONTROL_BACKLOG_WORKER_DISABLED=1` 可关）；本端点供值班角色在排障时手动触发，
        不必等下一个周期。跨设备/跨 request 的租户级操作，故挂在 `api/control` 而非
        某条 request 之下（对齐 `/api/perception/fusion/sweep` 等同类巡检）。
      responses:
        '201':
          description: Sweep result
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned:
                    type: integer
                    description: 扫描到的超 SLA 未交付命令数
                  devicesWithBacklog:
                    type: integer
                    description: 存在投递积压的设备数
                  created:
                    type: integer
                    description: 本次新建的提醒数
                  duplicates:
                    type: integer
                    description: 幂等命中的已存在提醒数
                  slaMs:
                    type: integer
                    description: 当前投递 SLA（毫秒）
                  notificationIds:
                    type: array
                    items:
                      type: string
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
