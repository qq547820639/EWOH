  /api/scheduler/predictions/task-duration/samples:
    get:
      tags:
        - scheduler
      summary: Training-sample eligibility summary for the empirical duration model
      description: >
        训练样本资格摘要。按稳定枚举原因给出可解释计数，并区分两级资格：
        行级标记（receipt_source='real' + production_training_eligible + provenance_json）
        与**独立设备回执证据**（provenance.independentReceipt.policy='persisted-device-receipt-v1'）。
        只有两级都通过的行才计入 trainable；人工上报与模拟回执永久排除在训练集之外。
        因此 flaggedEligible 可能大于 trainable——该差额即"有标记但缺设备证据"。
        资格判定与训练加载共用同一纯函数（training-sample-eligibility.ts），
        避免"界面说可训练 N 条、训练报样本不足"的两套口径。
      responses:
        '200':
          description: Eligibility summary (tenant scoped)
          content:
            application/json:
              schema:
                type: object
                required: [orgId, trainable, minSamplesRequired, eligibilityPolicy]
                properties:
                  orgId: { type: string }
                  sampleLimit: { type: number, description: 参与统计的反馈行上限 }
                  totalFeedbackRows: { type: number }
                  flaggedEligible: { type: number, description: 通过行级标记的行数（不等于可训练数） }
                  trainable: { type: number, description: 训练实际可用样本数 }
                  minSamplesRequired: { type: number }
                  fullyTrained: { type: boolean }
                  rejected:
                    type: object
                    additionalProperties: { type: number }
                    description: 按拒绝原因计数的排除明细（稳定枚举键）
                  rejectedLabels:
                    type: object
                    additionalProperties: { type: string }
                  eligibilityPolicy:
                    type: string
                    enum: [independent-device-receipt-required]
        '400':
          description: 缺少租户上下文或训练模块未装配
  /api/scheduler/predictions/task-duration/retrain:
    post:
      tags:
        - scheduler
      summary: "Retrain the empirical task-duration model (NO-13g / ADR-056: real feedback -> statistical model -> model registry)"
      description: >
        DurationModelTrainingService.retrain()（NO-13g / ADR-056）：真实执行反馈 （ewoh_scheduling_feedback.actual_start/actual_end）→ 经验时长统计模型 → ewoh_model_registry 落版（supersede 旧 active + 版本递增）+ 内存刷新。 样本不足 → 400 retrain_not_enough_data（§33 不落版不伪造）。预测面 shadow-only。
      responses:
        '201':
          description: Retrained model summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  modelId: { type: string }
                  version: { type: string }
                  n: { type: number }
                  medianMs: { type: number }
                  lineage:
                    type: object
                    description: >
                      谱系（lineage）：新模型版本由哪些样本、按什么资格策略产生。
                      没有它就无法回答"这个模型是怎么来的"，而时长模型会影响排程预测。
                    properties:
                      trainedFrom: { type: string }
                      eligibilityPolicy: { type: string }
                      trainableSamples: { type: number, nullable: true }
                      flaggedEligible: { type: number, nullable: true }
                      minSamplesRequired: { type: number, nullable: true }
                      perTaskType:
                        type: array
                        items:
                          type: object
                          properties:
                            taskType: { type: string }
                            ok: { type: boolean }
                            version: { type: string, nullable: true }
                            notEnoughDataReason: { type: string, nullable: true }
                  p90Ms: { type: number }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/scheduler/decision-history:
    get:
      tags:
        - scheduler
      summary: "Cross-kind Decision History retrieval (NO-13p / ADR-065: unified read surface over Decision Catalog 8 kinds)"
      description: >
        DecisionHistoryService.listDecisions()（NO-13p / ADR-065）：只读聚合四表 （schedule_plan.decision_records_json + agent_approval / learning_proposal / scheduling_policy .decision_json）→ 记录级租户过滤（统一面 §15）→ validateDecision（非法显式 skippedInvalid 计数 §33）→ decidedAt 降序 + decisionId 字典序稳定 → 分页（limit 缺省 50 cap 100）。kind/status 过滤器 fail-closed（未知值 400）。
      parameters:
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: number }
        - name: offset
          in: query
          required: false
          schema: { type: number }
      responses:
        '200':
          description: Aggregated decision history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: number }
                  skippedInvalid: { type: number }
                  sources:
                    type: object
                    properties:
                      plans: { type: number }
                      agentApprovals: { type: number }
                      learningProposals: { type: number }
                      policies: { type: number }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
