  /api/scheduler/plans/{planId}/cancel:
    post:
      tags:
        - scheduler
      summary: Cancel/roll back schedule plan (DR-5, standalone_077)
      description: >
        受控部分回退：未开始 assignment（proposed/approved/dispatched/acknowledged）
        → cancelled + 释放预占 + 任务 rollback_dispatch 回 pending_dispatch；
        未开始 Execution 标记 CANCELLED。已开始的 assignment 物理不可撤销，
        显式列入 irreversibleAssignmentIds（不静默）。reason 必填（可审计）。
        方案状态 CAS → cancelled；PlanCancelled outbox 事件（SSE 可见）。
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: 取消/回滚原因（必填：回滚必须可解释、可审计）。
      responses:
        '200':
          description: Cancelled plan (with cancel summary)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlanV2'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        NotFound:
          $ref: '#/components/responses/NotFound'
        Conflict:
          $ref: '#/components/responses/Conflict'
        InternalError:
          $ref: '#/components/responses/InternalError'
