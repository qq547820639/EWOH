          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        enum:
                          - object_workbench_view
                          - approval_deeplink_click
                          - terminal_action_click
