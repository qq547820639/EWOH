                  - generatedAt
                  - authorizedRoles
                  - canDebug
                  - simulating
                  - data
                properties:
                  role:
                    type: string
                    enum: [ operator, team_lead, quality, equipment, manager ]
                  generatedAt:
                    type: string
                    format: date-time
                  authorizedRoles:
                    type: array
                    description: >
                      Workbench roles the authenticated user is allowed to view, resolved server-side from the JWT auth roles. A forged `role` query param is rejected (403) when it is not in this set.
