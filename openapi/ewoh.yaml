        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/scheduler/feedback/actuals:
    post:
      tags:
        - scheduler
      summary: Record task execution actuals (v0.7 D1) - feedback loop
      description: >-
        Task executor (mobile / edge / external system) endpoint. Called on task start / complete to backfill actual execution values (actualStart / actualEnd / actual travel / wait / resource) matched by assignmentId / planId / taskId. Repeated submission is an overwrite update (idempotent by nature). Observational only - never changes scheduling behavior; drives planned-vs-actual KPIs and policy shadow evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordActualsRequest'
