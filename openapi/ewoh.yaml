    ShiftDefinition:
      type: object
      description: 班次定义（standalone_074，DR-2）。跨零点窗口显式标记，判定用共享纯函数。
      properties:
        shiftId: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        startTime: { type: string, description: 'HH:mm 本地时区' }
        endTime: { type: string, description: 'HH:mm 本地时区' }
        crossesMidnight: { type: boolean }
        active: { type: boolean }
        leadUserId: { type: string, nullable: true }
        description: { type: string, nullable: true }
    ShiftHandoverOpenItem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        relatedObjectType: { type: string }
        relatedObjectId: { type: string }
        note: { type: string }
    ShiftHandover:
      type: object
      description: 交接班记录：结构化遗留事项 + 交接事实留痕。
      properties:
        handoverId: { type: string }
        shiftId: { type: string }
        shiftDate: { type: string, format: date }
        fromUserId: { type: string, nullable: true }
        toUserId: { type: string }
        openItems:
          type: array
          items: { $ref: '#/components/schemas/ShiftHandoverOpenItem' }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [pending, confirmed] }
        confirmedAt: { type: string, nullable: true }
    DataQualityConfirmation:
      type: object
      description: 数据质量人工确认（standalone_076，DR-4 闭环第②步）。
      properties:
        eventId: { type: string }
        verdict: { type: string, enum: [confirmed, contested] }
        note: { type: string, nullable: true }
        confirmedBy: { type: string, description: 服务端会话身份 }
        confirmedAt: { type: string }
        context:
          type: object
          nullable: true
          properties:
            dataQuality: { type: string, nullable: true }
            source: { type: string, nullable: true }
            observedAt: { type: string, nullable: true }
            receivedAt: { type: string, nullable: true }
    RetrospectiveLesson:
      type: object
      required: [title, detail]
      properties:
        title: { type: string }
        detail: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        evidenceIds:
          type: array
          items: { type: string }
    RetrospectiveRecord:
      type: object
      description: 复盘/运行记忆（standalone_075，DR-3）：闭环六段组装产物（assembled 只引用既有台账证据）。
      properties:
        retrospectiveId: { type: string }
        scope: { type: string, enum: [plan, incident, shift] }
        targetId: { type: string }
        title: { type: string }
        periodStart: { type: string, nullable: true }
        periodEnd: { type: string, nullable: true }
        triggerEventId: { type: string, nullable: true }
        status: { type: string, enum: [draft, published, superseded] }
        assembled:
          type: object
          description: 六段结构（perception/dataQuality/decision/authorization/execution/feedback + gaps）。
        narrative: { type: string, nullable: true }
        narrativeSource: { type: string, enum: [llm, rule_fallback], nullable: true }
        narrativeModel: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string }
