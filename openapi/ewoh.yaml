  /api/oee/andons/sla-sweep:
    post:
      tags:
        - oee
      summary: Escalate andons nobody has taken over (NO-48a, SLA breach sweep)
      description: >-
        Periodic/manual sweep that closes a real safety gap: the existing SLA escalation
        only fires when someone acknowledges **late**. If a red andon stays `open` and
        nobody touches it, nothing happens. This sweep escalates only those
        never-taken-over andons past their SLA — level 1 (>1x SLA) notifies
        workshop_lead + dispatcher, level 2 (>2x SLA) additionally notifies safety_admin.
        It is read-only with respect to business facts (no status/evidence writes) but
        writes deterministic, idempotent reminders plus an audit entry per escalation.
        Missing/unparseable `openedAt` is reported as `undecidable` rather than being
        treated as "not overdue". Workers scan tenants via the controlled SECURITY DEFINER
        function `ewoh_open_andon_orgs` and then re-read per tenant under GUC.
      responses:
        '201':
          description: >-
            Sweep counters (scanned/openAndons/breached/undecidable/created/duplicates)
            + per-andon escalations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
