          format: int64
    LearningEvaluation:
      type: object
      description: 七项学习指标快照（modelAccuracy v1 恒 null=显式 unknown，§10）
      properties:
        evalId:
          type: string
        orgId:
          type: string
        evaluationType:
          type: string
          enum: [ periodic, on_demand ]
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        engineVersion:
          type: string
        metrics:
          type: object
          properties:
            recommendationAcceptanceRate:
              type: [ number, 'null' ]
            planSuccessRate:
              type: [ number, 'null' ]
            taskDelayP95Ms:
              type: [ number, 'null' ]
            riskOutcomeRate:
              type: [ number, 'null' ]
            humanOverrideRate:
              type: [ number, 'null' ]
            modelAccuracy:
              type: [ number, 'null' ]
            schedulerQualityRate:
              type: [ number, 'null' ]
        basis:
          type: array
          items:
            type: string
        auditTrail:
          type: boolean
      required:
        - evalId
        - orgId
        - evaluationType
        - periodStart
        - periodEnd
        - engineVersion
        - metrics
        - basis
        - auditTrail
    LearningProposalRequest:
      type: object
      description: >
        学习提案请求（ADR-026 / NO-12b）。契约权威源： contracts/learning/learning-proposal.schema.json（kind 封闭注册表 + 影子评估前置 + 人审激活阶梯）。
      properties:
        proposalId:
          type: string
          description: 可选幂等键；缺省由服务端生成
        kind:
          type: string
          enum: [ rule_threshold ]
        change:
          type: object
          properties:
            ruleId:
              type: string
              enum: [ rule:worker-overload ]
            parameter:
              type: string
              enum: [ workloadThreshold ]
            baselineValue:
              type: number
            candidateValue:
              type: number
          required:
            - ruleId
            - parameter
            - baselineValue
            - candidateValue
        facts:
          type: array
          description: 历史事实窗口（可选；提供即确定性影子评估落 shadow_evaluated）
          items:
            type: object
            additionalProperties: true
        evaluationRef:
          type: object
          properties:
            evalId: { type: string }
      required:
        - kind
        - change
    LearningProposal:
      type: object
      properties:
        proposalId:
          type: string
        kind:
          type: string
          enum: [ rule_threshold ]
        status:
          type: string
          enum: [ proposed, shadow_evaluated, approved, rolled_back, rejected ]
        change:
          type: object
          additionalProperties: true
        shadowEval:
          type: object
          additionalProperties: true
        proposedBy:
          type: string
          description: "Operator who proposed the change (B5 generator avoidance: proposer cannot approve own proposal)"
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        rejectedBy:
          type: string
        rejectedReason:
          type: string
        rolledBackBy:
          type: string
        rolledBackReason:
          type: string
        evaluationRef:
          type: object
          additionalProperties: true
        auditTrail:
          type: boolean
      required:
        - proposalId
        - kind
        - status
        - change
        - auditTrail
    LearningProposalResponse:
      type: object
      properties:
        proposal:
          $ref: '#/components/schemas/LearningProposal'
        created:
          type: boolean
      required:
        - proposal
        - created
    LearningThresholdBaselineEntry:
      type: object
      properties:
        ruleId:
          type: string
          enum: [ 'rule:worker-overload' ]
        parameter:
          type: string
          enum: [ workloadThreshold ]
        engineDefault:
          type: number
          nullable: true
          description: "Engine built-in constant; null = not registered (source=engine_default_unknown, never fabricated)"
        effective:
          type: number
          nullable: true
          description: "Currently effective value (approved override ?? engine constant)"
        source:
          type: string
          enum: [ approved_proposal, engine_default, engine_default_unknown ]
        provenance:
          type: object
          nullable: true
          additionalProperties: true
          description: "Approving proposal + shadow-evidence provenance; null when source=engine_default"
        counts:
          type: object
          additionalProperties: true
      required:
        - ruleId
        - parameter
        - effective
        - source
        - counts
    OrderChain:
      type: object
      required: [orderNo, status, overdue, tasks, materials, gaps, notes]
      properties:
        orderNo: { type: string }
        status: { type: string }
        priority: { type: string, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean, nullable: true, description: 无期限时为 null（不猜是否逾期） }
        tasks:
          type: array
          items:
            type: object
            properties:
              taskId: { type: string }
              title: { type: string }
              status: { type: string }
              source: { type: string }
              planStart: { type: string, nullable: true }
              planEnd: { type: string, nullable: true }
              stepCount: { type: integer }
              openStepCount: { type: integer }
              stepIds: { type: array, items: { type: string } }
        materials:
          type: array
          items:
            type: object
            properties:
              materialId: { type: string }
              name: { type: string, nullable: true }
              unit: { type: string, nullable: true }
              requiredTotal: { type: number }
              onHand: { type: number }
              shortage: { type: number }
              belowThreshold: { type: boolean }
              orderNos: { type: array, items: { type: string } }
        gaps:
          type: array
          description: 链路缺口（封闭词表，页面必须逐条显示）
          items:
            type: string
            enum: [task_link_missing, steps_missing, material_link_missing, due_at_missing]
        assignedTaskCount: { type: integer }
        notes: { type: array, items: { type: string } }
    OrderChainResult:
      type: object
      required: [orgId, generatedAt, chains, summary]
      properties:
        orgId: { type: string }
        generatedAt: { type: string, format: date-time }
        chains:
          type: array
          items: { $ref: '#/components/schemas/OrderChain' }
        summary:
          type: object
          properties:
            orders: { type: integer }
            overdue: { type: integer }
            withGaps: { type: integer }
            gapCounts: { type: object, additionalProperties: { type: integer } }
            materialsInShortage: { type: integer }
            openSteps: { type: integer }
        notes: { type: array, items: { type: string } }
    PlannedVsActualSummary:
      type: object
      required: [windowDays, totalRows, comparableRows, byReason, notes]
      properties:
        windowDays: { type: integer }
        totalRows: { type: integer }
        comparableRows: { type: integer }
        coverage: { type: number, nullable: true, description: 无可比也无可判定行时为 null }
        meanAbsPctError: { type: number, nullable: true, description: 样本不足时 null（不给比率） }
        medianAbsPctError: { type: number, nullable: true }
        p90AbsPctError: { type: number, nullable: true }
        meanSignedMs: { type: number, nullable: true }
        overrunCount: { type: integer }
        underrunCount: { type: integer }
        onTimeCount: { type: integer }
        byReason: { type: object, additionalProperties: { type: integer } }
        byDeviationType: { type: object, additionalProperties: { type: integer } }
        biasNote: { type: string, nullable: true, description: 只报事实（系统性倾向），不替现场下结论 }
        notes: { type: array, items: { type: string } }
        generatedAt: { type: string, format: date-time }
    PerceptionFusion:
      type: object
      description: >
        多源感知融合快照（NO-56a §5）。置信度是**可解释加权**（可用源权重和 / 应有源权重和），
        不是标定概率；无可用源时 `confidence.level='unknown'` 且 `confidence.score=null`。
      required: [subjectId, windowStart, windowEnd, fusedAt, agreement, confidence, conflicts, ruleTrace, strongAdviceAllowed]
      properties:
        subjectId: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        fusedAt: { type: string, format: date-time }
        agreement: { type: string, enum: [consistent, partial, conflict, insufficient] }
        position:
          type: object
          nullable: true
          properties:
            x: { type: number, nullable: true }
            y: { type: number, nullable: true }
            z: { type: number, nullable: true }
            stationId: { type: string, nullable: true, description: 坐标→工位；null = 未解析（不猜） }
            basis: { type: array, items: { type: string } }
        posture:
          type: object
          nullable: true
          properties:
            pitchDeg: { type: number, nullable: true }
            action: { type: string, nullable: true }
            basis: { type: array, items: { type: string } }
        station:
          type: object
          nullable: true
          description: 多源工位结论；来源互相矛盾时 stationId=null（不投票、不取第一个）
          properties:
            stationId: { type: string, nullable: true }
            basis: { type: string }
            sources: { type: array, items: { type: string } }
        confidence:
          type: object
          required: [level, basis, usableSources, degraded, missingSources, excludedSources]
          properties:
            level: { type: string, enum: [high, medium, low, unknown] }
            score: { type: number, nullable: true, minimum: 0, maximum: 1 }
            basis: { type: string, description: 权重依据（可解释；明确写了"不是概率"） }
            usableSources: { type: array, items: { type: string } }
            degraded: { type: boolean }
            missingSources: { type: array, items: { type: string } }
            unknownConfidenceSources: { type: array, items: { type: string } }
            excludedSources:
              type: array
              description: 被排除的证据（过期/不可信/维度不符），逐条带原因
              items:
                type: object
                properties:
                  source: { type: string }
                  sourceId: { type: string }
                  dimension: { type: string }
                  status: { type: string, enum: [stale, untrusted, dimension_mismatch] }
                  reason: { type: string }
        conflicts:
          type: array
          items:
            type: object
            properties:
              dimension: { type: string }
              severity: { type: string, enum: [low, medium, high] }
              participants:
                type: array
                items:
                  type: object
                  properties:
                    source: { type: string }
                    sourceId: { type: string }
                    value: { type: string }
              detail: { type: string }
        ruleTrace:
          type: array
          description: §5 五条规则逐条留痕（哪条命中、依据是什么）
          items:
            type: object
            properties:
              rule: { type: string }
              fired: { type: boolean }
              detail: { type: string }
        strongAdviceAllowed: { type: boolean, description: 低置信度/有冲突/证据不足一律 false }
        notes: { type: array, items: { type: string } }
    PerceptionSweepResult:
      type: object
      required: [orgId, windowStart, windowEnd, subjects, persisted, byAgreement, byConfidenceLevel, conflictSubjects]
      properties:
        orgId: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        windowMinutes: { type: integer }
        bucketMinutes: { type: integer }
        subjects: { type: integer }
        persisted: { type: integer }
        created: { type: integer }
        refreshed: { type: integer }
        byAgreement: { type: object, additionalProperties: { type: integer } }
        byConfidenceLevel: { type: object, additionalProperties: { type: integer } }
        conflictSubjects: { type: array, items: { type: string } }
        degradedSubjects: { type: array, items: { type: string } }
        unmatchedVisionDetections: { type: integer, description: 视觉 track 未绑定到主体（不硬塞给某个人） }
        stationUnresolved: { type: integer, description: 坐标未解析到工位（不猜最近工位） }
        rejected:
          type: array
          items:
            type: object
            properties:
              subjectId: { type: string }
              errors: { type: array, items: { type: string } }
        notes: { type: array, items: { type: string } }
    ImprovementActionEffect:
      type: object
      description: >
        行动项复发度量（NO-58a）。`conclusion` 只有五种：no_subject / not_completed /
        insufficient_sample / recurrence_dropped / recurrence_persisted；任何结论都**只描述计数**，
        不代表因果（页面必须原样展示 reason 与"不等于这条改进有效"）。
      required: [actionId, subjectType, subjectId, status, completedAt, windowDays, before, after, conclusion, reason, notes, generatedAt]
      properties:
        actionId: { type: string }
        subjectType: { type: string, nullable: true, enum: [device, person, station, null] }
        subjectId: { type: string, nullable: true }
        status: { type: string, enum: [proposed, accepted, rejected, completed, dropped] }
        completedAt: { type: string, format: date-time, nullable: true }
        windowDays: { type: integer, description: 前后各一个窗口的天数 }
        before:
          type: object
          required: [from, to, deviations]
          properties:
            from: { type: string, description: ISO 时间；不可度量时为空串 }
            to: { type: string }
            deviations: { type: integer }
        after:
          type: object
          required: [from, to, deviations]
          properties:
            from: { type: string }
            to: { type: string }
            deviations: { type: integer }
        conclusion:
          type: string
          enum: [no_subject, not_completed, insufficient_sample, recurrence_dropped, recurrence_persisted]
        reason: { type: string, description: 结论文案（含门槛与"不等于改进有效"的说明） }
        notes:
          type: array
          items: { type: string }
          description: 观察期未结束等补充说明
        generatedAt: { type: string, format: date-time }
    ImprovementAction:
      type: object
      description: >
        改进行动项（NO-55a）：复盘经验条目/缺口 → 有人负责、有期限、有验收判据、有完成证据。
        与阈值提案并列（行动项改做法、提案改参数）；`threshold_review` 类型表示需要人去提案面板改参数。
      required: [actionId, sourceType, sourceRef, title, detail, kind, kindSource, priority, status, evidenceRefs, detectedAt]
      properties:
        actionId:
          type: string
          description: 确定性行动项号 `ACT-<lesson|gap>-<来源对象>-<slug>`（重复扫描幂等）
        sourceType: { type: string, enum: [retrospective_lesson, retrospective_gap] }
        sourceRef: { type: string, description: 来源复盘号 }
        subjectType:
          type: string
          nullable: true
          enum: [device, person, station, null]
          description: 对象归属类型（NO-58a）；与 subjectId 成对，null = 未绑定 → 复发不可度量
        subjectId: { type: string, nullable: true, description: 对象 id（incident 复盘的 targetId 派生） }
        title: { type: string }
        detail: { type: string }
        kind: { type: string, enum: [process_change, training, tooling, maintenance, threshold_review] }
        kindSource: { type: string, enum: [suggested, human], description: suggested=平台建议（接受时应确认） }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [proposed, accepted, rejected, completed, dropped] }
        evidenceRefs:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, enum: [retrospective, lesson, gap, event, plan, execution, annotation] }
              id: { type: string }
              at: { type: string, nullable: true }
              detail: { type: object }
        owner: { type: string, nullable: true, description: accepted/completed 必填 }
        dueAt: { type: string, format: date-time, nullable: true, description: accepted/completed 必填（平台不替现场承诺期限） }
        acceptanceCriteria: { type: string, nullable: true, description: accepted/completed 必填（让别人能判断做完了没有） }
        acceptedBy: { type: string, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        completedBy: { type: string, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        outcomeNote: { type: string, nullable: true, description: completed 必填（结果说明） }
        outcomeRef:
          type: string
          nullable: true
          description: 完成时回流的知识条目号（NO-57c）；null = 未回流（页面必须显式显示，不许当成已归档）
        outcomeKind: { type: string, nullable: true, enum: [knowledge_entry, null] }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedReason: { type: string, nullable: true, description: rejected/dropped 必填 }
        detectedAt: { type: string, format: date-time }
    ImprovementScanResult:
      type: object
      required: [orgId, generatedAt, scannedRetrospectives, derived, created, refreshed, decisionsPreserved, rejected, actions, memory]
      properties:
        orgId: { type: string }
        generatedAt: { type: string, format: date-time }
        scannedRetrospectives: { type: integer }
        derived: { type: integer }
        created: { type: integer }
        refreshed: { type: integer }
        decisionsPreserved: { type: integer, description: 已由人处理过、本次只刷新来源事实的行动项数 }
        rejected:
          type: array
          items:
            type: object
            properties:
              actionId: { type: string }
              errors: { type: array, items: { type: string } }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ImprovementAction' }
        memory:
          type: object
          description: 本次扫描读了什么（0 也要如实给出）
          properties:
            publishedRetrospectives: { type: integer }
            lessons: { type: integer }
            gaps: { type: integer }
    LearningSignal:
      type: object
      description: >
        运行记忆信号（NO-54a）。实测快照 + 证据引用 + 样本量 + 可信度 + 方向；
        confidence=null 表示样本不足（不给结论），此时 actionable 必为 null 且
        notActionableReason 必填（页面上要能读出"为什么只能提示"）。
      required: [signalId, kind, severity, status, subjectKey, windowDays, sampleSize, metrics, narrative, evidenceRefs, detectedAt]
      properties:
        signalId:
          type: string
          description: 确定性信号号 `SIG-<KIND>-<subject>-<window>d-<severity>`（重复扫描同窗口同严重度 → 同一行）
        kind:
          type: string
          enum: [notification_fatigue, data_quality_backlog, deviation_repeat]
        severity: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, promoted, dismissed] }
        subjectKey: { type: string }
        windowDays: { type: integer, minimum: 1, maximum: 365 }
        sampleSize: { type: integer, minimum: 0 }
        confidence:
          type: string
          nullable: true
          enum: [low, medium, high, null]
          description: 可信度；null = 样本不足（sampleSize < 5），不给结论
        metrics:
          type: object
          description: 实测快照（数字 + 口径门槛），页面据此展示"依据是什么"
        narrative:
          type: object
          required: [hypothesis, expectedEffect, risk, missing]
          properties:
            hypothesis: { type: string }
            expectedEffect: { type: string }
            risk: { type: string }
            missing:
              type: array
              description: 缺什么导致结论受限（空数组 = 没有已知缺口）
              items: { type: string }
        evidenceRefs:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, enum: [notification_kind, notification_source, quality_alert, execution_deviation, threshold_baseline] }
              id: { type: string }
              at: { type: string, nullable: true, description: 证据时间；null = 时间未知（不用扫描时刻冒充） }
              detail: { type: object }
        actionable:
          type: object
          nullable: true
          description: 可执行（可生成提案）时的方向与基线；null = 只能提示（见 notActionableReason）
          required: [ruleId, parameter, direction, baselineValue, baselineSource]
          properties:
            ruleId: { type: string }
            parameter: { type: string }
            direction: { type: string, enum: [raise, lower] }
            baselineValue: { type: number, minimum: 0, maximum: 1 }
            baselineSource: { type: string }
        notActionableReason: { type: string, nullable: true }
        detectedAt: { type: string, format: date-time }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        decidedReason: { type: string, nullable: true }
        promotedProposalId: { type: string, nullable: true }
    LearningSignalScanResult:
      type: object
      required: [orgId, windowDays, generatedAt, derived, created, refreshed, decisionsPreserved, rejected, signals, memory]
      properties:
        orgId: { type: string }
        windowDays: { type: integer }
        generatedAt: { type: string, format: date-time }
        derived: { type: integer, description: 派生出的信号总数（含已存在被刷新的） }
        created: { type: integer }
        refreshed: { type: integer }
        decisionsPreserved: { type: integer, description: 已由人处理过、本次只刷新快照的信号数 }
        rejected:
          type: array
          description: 契约校验未通过、**未落库**的信号（绝不写非法行）
          items:
            type: object
            properties:
              signalId: { type: string }
              errors: { type: array, items: { type: string } }
        signals:
          type: array
          items: { $ref: '#/components/schemas/LearningSignal' }
        memory:
          type: object
          description: 本次扫描读了什么（0 也要如实给出，"没有信号"要能追到"读了什么"）
          properties:
            notificationTruncated: { type: boolean }
            notificationScanned: { type: integer }
            openQualityAlerts: { type: integer }
            pendingQualityReminders: { type: integer }
            deviationObjects: { type: integer }
    LearningThresholdBaseline:
      type: object
      properties:
        readAt:
          type: string
          format: date-time
        engineVersion:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LearningThresholdBaselineEntry'
      required:
        - readAt
        - engineVersion
        - entries
    LearningEvaluateResponse:
      type: object
      properties:
        record:
          $ref: '#/components/schemas/LearningEvaluation'
        created:
          type: boolean
      required:
        - record
        - created
    TraceStitch:
      type: object
      description: >
        全链路 trace 三面缝合（ADR-022 / NO-10a，§19）：spans（ewoh_trace_span）+ events（evidence_json.envelope.correlationId = traceId）+ audit （ewoh_audit_log.request_id = traceId）。
      properties:
        traceId:
          type: string
        spans:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        audit:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - traceId
        - spans
        - events
        - audit
    EdgeMetricsBatchRequest:
      type: object
      description: >
        Edge→Cloud 指标上行批次（ADR-028 / NO-12d）：边缘 Prometheus 事实源 的 ewoh_* 规范家族样本（metricName 必须命中 metrics-registry 注册表， 未注册 = violation 显式，绝不静默并入）。
      properties:
        metrics:
          type: array
          items:
            type: object
            properties:
              metricName: { type: string }
              metricType: { type: string, enum: [ counter, gauge, histogram ] }
              value: { type: number }
              labels:
                type: object
