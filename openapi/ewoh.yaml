                          - object_workbench_view
                          - approval_deeplink_click
                          - terminal_action_click
                          - nav_source
                      at: { type: number, description: 'Epoch ms of the event' }
                      props:
                        type: object
                        description: 'Event properties (object ids / action names / statuses only)'
      responses:
        '200':
          description: Accepted count (never throws; invalid events are skipped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
