components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    IngestKey:
      type: apiKey
      in: header
      name: X-Ingest-Key
  parameters:
    OrgIdHeader:
      name: X-Org-Id
      in: header
      required: true
      description: Target organization UUID for machine-to-machine ingestion
      schema:
        type: string
        format: uuid
  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
    Created:
      description: Created
      content:
        application/json:
          schema:
            type: object
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State or conflict error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: Cursor expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Business or validation error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Optional structured details
          additionalProperties: true
      required:
        - code
        - message
      additionalProperties: false
    CursorPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
          description: Whether another page exists
      required: []
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: Active EWOH username
        password:
          type: string
          description: Account password
      required:
        - username
        - password
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh JWT
      required:
        - refreshToken
      additionalProperties: false
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh JWT to revoke
      required:
        - refreshToken
      additionalProperties: false
    UserSummary:
      type: object
      properties:
        userId:
          type: string
          description: User identifier
        username:
          type: string
          description: Username
        roles:
          type: array
          items:
            type: string
            description: Role name
        orgId:
          type: string
          description: Primary organization id
      required: []
      additionalProperties: false
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: Short-lived access JWT
        refreshToken:
          type: string
          description: Rotated refresh JWT
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
        - accessToken
        - refreshToken
        - user
      additionalProperties: false
    UserContext:
      type: object
      properties:
        userId:
          type: string
          description: Authenticated user identifier
        roles:
          type: array
          items:
            type: string
            description: Role name
        primaryOrgId:
          type: string
          description: Organization context
      required: []
      additionalProperties: false
    WorldEntity:
      type: object
      properties:
        id:
          type: string
          description: Entity id
        type:
          type: string
          description: Entity type
      required:
        - id
        - type
      additionalProperties: true
    WorldSnapshot:
      type: object
      properties:
        snapshotVersion:
          type: integer
          description: Monotonic snapshot version
        cursor:
          type: string
          description: Opaque cursor for delta reads
        entities:
          type: array
          items:
            $ref: '#/components/schemas/WorldEntity'
        generatedAt:
          type: string
          description: ISO 8601 generation time
      required:
        - snapshotVersion
        - cursor
        - entities
        - generatedAt
      additionalProperties: false
    WorldDelta:
      type: object
      properties:
        nextCursor:
          type: string
          description: Cursor for the next delta page
        upserts:
          type: array
          items:
            $ref: '#/components/schemas/WorldEntity'
        removals:
          type: array
          items:
            type: string
            description: Removed entity id
        hasMore:
          type: boolean
          description: Whether more deltas are available
        etag:
          type: string
          description: Entity tag for the returned page
      required:
        - nextCursor
        - upserts
        - removals
        - hasMore
        - etag
      additionalProperties: false
    ReplaySnapshot:
      type: object
      properties:
        ts:
          type: string
          description: Snapshot minute in ISO 8601
        persons:
          type: array
          items:
            type: object
            description: Person state
            additionalProperties: true
        devices:
          type: array
          items:
            type: object
            description: Device state
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            description: Event summary
            additionalProperties: true
      required: []
      additionalProperties: false
    ReplaySnapshotList:
      type: array
      items:
        $ref: '#/components/schemas/ReplaySnapshot'
    DeviceInfo:
      type: object
      properties:
        id:
          type: string
          description: Database row id
        deviceId:
          type: string
          description: External device id
        workerName:
          type: string
          description: Bound worker display name
        deviceModel:
          type: string
          description: Device model
        batteryPct:
          type: number
          description: Battery percentage 0-100
        online:
          type: boolean
          description: Current online state
        lastTelemetryAt:
          type: string
          nullable: true
        entityId:
          type: string
          description: Linked spatial entity id
        parentId:
          type: string
          nullable: true
        x:
          type: number
          description: Spatial x coordinate in mm
        y:
          type: number
          description: Spatial y coordinate in mm
        sourceType:
          type: string
          description: simulated, real, or controlled_test
        firmwareVersion:
          type: string
          nullable: true
        hardwareVersion:
          type: string
          nullable: true
        protocolVersion:
          type: string
          nullable: true
        temperatureC:
          type: number
          nullable: true
        faultCode:
          type: string
          nullable: true
        lastRawRef:
          type: string
          nullable: true
        boundPersonId:
          type: string
          nullable: true
        boundPersonName:
          type: string
          nullable: true
      required: []
      additionalProperties: false
    DeviceList:
      type: array
      items:
        $ref: '#/components/schemas/DeviceInfo'
    DeviceSearchResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInfo'
        total:
          type: integer
          description: Matching row count
        page:
          type: integer
          description: One-based page
        pageSize:
          type: integer
          description: Page size
      required:
        - items
        - total
        - page
        - pageSize
      additionalProperties: false
    CreateDeviceDto:
      type: object
      properties:
        deviceId:
          type: string
          description: Unique external device id
        workerName:
          type: string
          description: Worker display name
        deviceModel:
          type: string
          description: Device model
        batteryPct:
          type: number
          description: Initial battery percentage 0-100
        online:
          type: boolean
          description: Initial online state
        sourceType:
          type: string
          description: simulated, real, or controlled_test
        firmwareVersion:
          type: string
          description: Firmware version
        hardwareVersion:
          type: string
          description: Hardware version
        protocolVersion:
          type: string
          description: Protocol version
      required:
        - deviceId
      additionalProperties: false
    UpdateDeviceDto:
      type: object
      properties:
        workerName:
          type: string
          description: Worker display name
        deviceModel:
          type: string
          description: Device model
        batteryPct:
          type: number
          description: Battery percentage 0-100
        online:
          type: boolean
          description: Online state
        faultCode:
          type: string
          description: Fault code
        firmwareVersion:
          type: string
          description: Firmware version
        hardwareVersion:
          type: string
          description: Hardware version
        protocolVersion:
          type: string
          description: Protocol version
        temperatureC:
          type: number
          description: Device temperature in Celsius
      required: []
      additionalProperties: false
    BindDeviceRequest:
      type: object
      properties:
        spatialEntityId:
          type: string
          nullable: true
          description: Target spatial entity id
        personEntityId:
          type: string
          nullable: true
          description: Person entity id
      required: []
      additionalProperties: false
    DeviceBinding:
      type: object
      properties:
        deviceId:
          type: string
          description: Bound device id
        spatialEntityId:
          type: string
          nullable: true
        hierarchyPath:
          type: array
          items:
            type: object
            properties:
              entityId:
                type: string
                description: Spatial entity id
              name:
                type: string
                description: Entity name
              entityType:
                type: string
                description: Entity type
            required: []
            additionalProperties: false
        boundPersonId:
          type: string
          nullable: true
        boundPersonName:
          type: string
          nullable: true
      required: []
      additionalProperties: false
    DeviceBindingRecord:
      type: object
      description: ewoh_device_binding row
      additionalProperties: true
    PersonnelBindingList:
      type: array
      items:
        $ref: '#/components/schemas/DeviceBindingRecord'
    EventInfo:
      type: object
      properties:
        id:
          type: string
          description: Database row id
        eventId:
          type: string
          description: External event id
        deviceId:
          type: string
          description: Related device id
        eventCode:
          type: string
          description: Event code
        eventType:
          type: string
          description: Event type
        severity:
          type: string
          description: L1/L2/L3
        title:
          type: string
          description: Human-readable title
