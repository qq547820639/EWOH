              schema:
                type: object
                required: [personId, executions, total]
                properties:
                  personId:
                    type: string
                    description: 服务端权威的账号↔人员绑定值
                  executions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SchedulingExecution'
                  total:
                    type: integer
