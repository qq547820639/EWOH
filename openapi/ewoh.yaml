  /api/world/order-chains:
    get:
      tags:
        - world
      summary: Order → task/step → material chain view with explicit gaps (NO-57a)
      description: >
        把"订单 → 任务/工序 → 物料"在同一次读取里组装出来：订单=未完工 `ERP_ORDER` 事件；
        任务=`ewoh_schedule_task`（MES 建单时 `schedule_task_id = 订单号`，这条链一直存在）；
        工序=`ewoh_schedule_task_step`（工序总数/未完成数）；物料=MRP 缺口行（含证据订单号）。
        **断链显式**：`task_link_missing` / `steps_missing` / `material_link_missing` / `due_at_missing`
        逐单返回（原则 7），排序为逾期优先 → 期限升序 → 订单号。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: orderNo
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Order chains + summary (overdue/gaps/materials in shortage/open steps)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderChainResult' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/scheduler/planned-vs-actual:
    get:
      tags:
        - scheduler
      summary: Planned vs actual reconciliation over execution facts (NO-57b)
      description: >
        读 `ewoh_scheduling_execution`（计划/实际时间戳 + 偏差类型）给出**可复盘口径**：
        可比覆盖率、绝对偏差的中位/均值/P90、超时/提前/准时计数、不可比行按原因分类
        （缺计划/缺实际/计划为 0/未完工）、偏差类型分布。**样本不足（可比 < 5）不给比率**
        （字段为 null + notes 说明），缺失不当 0；读取触顶时显式说明"不是全体"。
      parameters:
        - name: windowDays
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        '200':
          description: Reconciliation summary (rates are null when sample is insufficient)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlannedVsActualSummary' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
