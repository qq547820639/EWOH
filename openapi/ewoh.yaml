  /api/approvals/authorizations/expiry-sweep:
    post:
      tags:
        - approvals
      summary: "Sweep execution-boundary authorizations and raise expiry reminders (NO-30a)"
      description: >-
        Creates idempotent in-app notifications for authorizations that are about to expire
        (remaining <= 2h) or have recently expired (within 24h), addressed to the
        safety_admin role. Notification ids are derived from (approvalId, bucket, channel),
        so repeated sweeps never duplicate reminders. The sweep is read-only with respect to
        authorization state. The same implementation runs on a periodic worker.
        NO-45a: when an authorization has actually expired, the "about to expire, act now"
        reminder loses its premise and is closed (`resolution=approval_expired`) in the same
        sweep, while the "already expired, re-apply" reminder stays pending — the two carry
        different meanings and are never closed together. `resolved` reports how many urging
        reminders were closed by this run.
      responses:
        '200':
          description: >-
            Sweep counters (scanned/expiringSoon/expired/created/duplicates/resolved) +
            per-approval notifications
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
