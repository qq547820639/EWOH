                items: { $ref: '#/components/schemas/RetrospectiveRecord' }
  /api/retrospective/from-plan:
    post:
      tags:
        - retrospective
      summary: Assemble a retrospective from a scheduling plan (closed-loop run memory)
      description: >
        组装感知/数据质量/决策/授权/执行/反馈六段（只引用既有台账证据，
        缺失环节显式进 gaps，不伪造）；AI 总结（LLM 事务外调用 + 规则模板
        兜底，narrativeSource 双路留痕）。同 target 重新组装 = 旧 published
        置 superseded + 新 draft。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
      responses:
        '200':
          description: Assembled retrospective
          content:
            application/json:
              schema:
                type: object
                properties:
                  record: { $ref: '#/components/schemas/RetrospectiveRecord' }
                  created: { type: boolean }
  /api/retrospective/{retrospectiveId}:
    get:
      tags:
        - retrospective
      summary: Get one retrospective record
      parameters:
        - name: retrospectiveId
          in: path
          required: true
          schema: { type: string }
