    get:
      tags:
        - scheduler
      summary: Explain whether a plan is stale and what changed (NO-62c)
      description: >
        Read-only diagnosis with the SAME implementation the approve path uses when it rejects with 409 PLAN_STALE.
        Returns per-entity version/reservation differences, separating external changes from changes the plan itself
        caused (already dispatched assignments / created reservations), so the approver learns what changed instead of
        only that the plan is stale. `snapshotFound=false` means the bound snapshot row is gone: differences cannot be
        computed (never reported as fresh).
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId:
                    type: string
                  status:
                    type: string
                  version:
                    type: integer
                  snapshotVersion:
                    type: string
                  stale:
                    type: boolean
                  replanAvailable:
                    type: boolean
                  checkedAt:
                    type: string
                    format: date-time
                  staleness:
                    $ref: '#/components/schemas/PlanStalenessReport'
        NotFound:
          $ref: '#/components/responses/NotFound'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
