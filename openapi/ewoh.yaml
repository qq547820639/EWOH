                      type: string
                      enum: [ operator, team_lead, quality, equipment, manager ]
                  canDebug:
                    type: boolean
                    description: >
                      Server-granted debug/diagnostics permission (admin only); never derived from a client localStorage flag.
                  simulating:
                    type: boolean
                    description: >
                      True when the requested role is not the user's own default role (admin simulate-as-role view).
