      tags:
        - perception
      summary: Latest multi-source perception fusion snapshots (NO-56a, §5)
      description: >
        多源（UWB 定位 / 外骨骼 IMU / 视觉检测 / 工位语义 / 任务上下文）融合后的
        主体状态快照：一致性、冲突、可解释加权置信度、被排除证据与规则留痕。
        **默认每个主体取最新一条**。`strongAdviceAllowed=false` 表示上游不得据此生成强建议
        （低置信度或存在冲突，§5 规则 5）。
      parameters:
        - name: subjectId
          in: query
          required: false
          schema: { type: string }
        - name: agreement
          in: query
          required: false
          schema: { type: string, enum: [consistent, partial, conflict, insufficient] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: Latest fusion snapshot per subject
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PerceptionFusion' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/perception/fusion/sweep:
    post:
      tags:
        - perception
      summary: Fuse multi-source observations for the window (idempotent, read-only w.r.t. facts)
      description: >
        读窗口内的真实观测（`ewoh_world_state` 定位行 / `ewoh_telemetry` 外骨骼行 /
        相机 person 检测行）与上下文（工位实体、在飞任务），按 §5 五条规则融合并落快照。
        **只读感知事实**，只写快照与 `perception.fusion_sweep` 审计；快照号确定性
        （主体 + 窗口桶）→ 重复扫描幂等。视觉检测的 track 未绑定到主体时如实计数
        （不按"最像的人"分配）；坐标超出工位半径即"工位未知"（不猜最近工位）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                windowMinutes: { type: integer, minimum: 1, maximum: 1440, default: 5 }
                bucketMinutes: { type: integer, minimum: 1, maximum: 1440, default: 5 }
      responses:
        '201':
          description: Sweep result (subjects/persisted/byAgreement/byConfidenceLevel/conflicts/notes)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerceptionSweepResult' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/control/commands/pending:
    get:
      tags:
        - control
      summary: Pending control commands for an edge gateway (NO-60a, poll-based downlink)
      description: >
        边缘网关轮询待投递命令（机器对机器；`X-Ingest-Key` 鉴权 + key→org 绑定）。
        只返回本租户 + 目标设备匹配 + 命令状态 `sent`（尚未被网关接收）+ 请求行非终态的命令。
        每条命令带**平台签发的授权号** `control:<requestId>`——高危命令在边缘侧的授权闸门
        由此满足，且授权号可回溯到真实审批过的请求。只读：不改变任何状态。
      security:
        - IngestKey: []
      parameters:
        - name: deviceId
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Pending commands for the device (each carries authorizationRef + payload)
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, commands]
                properties:
                  deviceId: { type: string }
                  commands:
                    type: array
                    items:
                      type: object
                      required: [commandId, requestId, commandKey, attemptNo, authorizationRef]
                      properties:
                        commandId: { type: string }
                        requestId: { type: string }
                        commandKey: { type: string }
                        attemptNo: { type: integer }
                        authorizationRef: { type: string, description: 平台签发：`control:<requestId>` }
                        authorizationFingerprint:
                          type: string
                          description: >
                            NO-62a/65a 授权范围指纹。配置了 `EWOH_CONTROL_FINGERPRINT_SECRET` 时为
                            `hmac-sha256:v2:<32hex>`（边缘持同一密钥可验签，验不过不碰设备）；
                            未配置时为 `fnv1a64:v1` 一致性指纹（启动会告警）。
                        authorizationScope:
                          type: object
                          description: >
                            NO-65a：**可重建的授权范围**（边缘据此重算签名材料）。
                            缺了它边缘无法验证签名，只能盲信指纹。
                          properties:
                            requestId: { type: string }
                            deviceId: { type: string }
                            commandKey: { type: string }
                            approvalInstanceId: { type: string, nullable: true }
                        priority: { type: integer, description: NO-62b 投递优先级（越小越先；stop=0） }
                        priorityLabel: { type: string }
                        payload: { type: object, nullable: true }
                        sentAt: { type: string, nullable: true }
                        orgId: { type: string, nullable: true }
                  queued: { type: integer, description: 本设备待投递积压（本轮可见范围内） }
                  revoked: { type: integer, description: 本轮因授权复核未通过被撤回的命令数 }
                  deferred:
                    type: array
                    description: >
                      NO-65b：本轮因设备仍在执行上一条运动命令（`gateway_received`）而**暂缓投递**
                      的命令。暂缓 ≠ 失败：命令保持 `sent`，设备空下来后下一轮照常投递；
                      安全动作（stop/pause/return_to_dock/clear_fault）永不暂缓。
                    items:
                      type: object
                      properties:
                        commandId: { type: string }
                        commandKey: { type: string }
                        reason:
                          type: string
                          enum: [device_busy, quota]
                          description: 'device_busy = 一车一活；quota = 配额用尽（blockedBy 以 quota-motion 前缀区分运动类更严配额；均非失败）'
                        blockedBy: { type: string, description: 占用设备的在飞命令 `<commandKey>:<commandId>` }
                  quota:
                    type: object
                    description: >
                      NO-67b 单设备投递配额（每分钟）。`usedInWindow` = 本轮开始前窗口内已投递条数；
                      `remaining` = 本轮还能投几条（null = 不限，0 = 已用尽 → 后续普通命令排队到下一分钟）。
                      安全动作（stop）永不受配额约束，也不占配额。
                    properties:
                      perMinute: { type: integer }
                      usedInWindow: { type: integer }
                      remaining: { type: integer, nullable: true }
                      motionPerMinute:
                        type: integer
                        description: NO-74c 运动类命令（dispatch_task/resume）的更严配额；默认为通用配额一半
                      motionUsedInWindow: { type: integer }
                      motionRemaining: { type: integer, nullable: true }
                  oldestSentAt: { type: string, nullable: true }
                  truncated: { type: boolean }
                  checkedAt: { type: string }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        TooManyRequests:
          $ref: '#/components/responses/TooManyRequests'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/control/commands/{commandId}/receipt:
    post:
      tags:
        - control
      summary: Edge gateway execution receipt by commandId (executed | failed)
      description: >
        机器身份（边缘网关，`X-Ingest-Key`）按 `commandId` 回执执行结果——人面回执路径
        （`POST /api/control/requests/:id/receipts`）要 Bearer 用户令牌，边缘网关没有也不该持有
        （NO-60a 实测：只用服务端密钥会 401，命令停在 `gateway_received`、执行结果丢失）。
        本端点按 commandId 定位请求与命令键，**复用同一套校验与落库**
        （终态/重复回执/租户/`ewoh_control_result`），不另写一份。
      security:
        - IngestKey: []
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [executed, failed] }
                receipt: { type: object, description: 执行细节（设备状态/适配器判定/时间等） }
      responses:
        '201':
          description: Receipt recorded (command/request status updated, control_result row written)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlRequest' }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        NotFound:
          $ref: '#/components/responses/NotFound'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/control/commands/{commandId}/ack:
    post:
      tags:
        - control
      summary: Edge gateway delivery acknowledgement (pending_gateway → gateway_received | failed)
      description: >
        投递确认（状态机 `contracts/state-machines/control.yaml`）。`delivered=true` →
        `gateway_received`；`delivered=false` **必须给原因** → `failed`（否则平台只知道
        "没送到"、不知道为什么）。幂等：已确认过同一命令 → 返回当前状态 +
        `alreadyAcked=true`（边缘 at-least-once），不重复写结果行；已进入终态 → 409。
        无论接受还是拒绝都写 `ewoh_control_result`（resultType=gateway_ack）与审计。
      security:
        - IngestKey: []
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivered]
              properties:
                delivered: { type: boolean }
                reason: { type: string, description: delivered=false 时必填（投递失败原因） }
                details: { type: object }
      responses:
        '201':
          description: Acknowledgement recorded (gateway_received / failed / alreadyAcked)
          content:
            application/json:
              schema:
                type: object
                required: [commandId, status, alreadyAcked, requestId]
                properties:
                  commandId: { type: string }
                  status: { type: string }
                  alreadyAcked: { type: boolean }
                  requestId: { type: string }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        NotFound:
          $ref: '#/components/responses/NotFound'
        Conflict:
          $ref: '#/components/responses/Conflict'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions:
    get:
      tags:
        - learning
      summary: List improvement actions derived from published retrospectives (NO-55a)
      description: >
        改进行动项 = 复盘经验条目/缺口 → **有人负责、有期限、有验收判据、有完成证据**的工作项。
        与阈值提案（可激活的参数变更）并列：行动项改"做法"，提案改"参数"。
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [proposed, accepted, rejected, completed, dropped] }
        - name: priority
          in: query
          required: false
          schema: { type: string, enum: [low, medium, high] }
        - name: owner
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Actions (org-scoped, earliest due first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImprovementAction' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions/scan:
    post:
      tags:
        - learning
      summary: Derive/refresh improvement actions from published retrospectives (idempotent, read-only)
      description: >
        扫**已发布复盘**的结构化经验条目（severity=warning|critical）与缺口清单，派生行动项候选。
        幂等：行动项号确定性，重复扫描只刷新来源事实（标题/详情/优先级/证据），
        **不覆盖人的决定**（已接受的责任/期限/完成痕迹、已拒绝/放弃的理由原样保留）。
        只读复盘记录，只写行动项与 `learning.action_scan` 审计。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retrospectiveIds:
                  type: array
                  maxItems: 20
                  description: 聚焦扫描：只扫指定复盘（不传则扫最近 100 篇已发布复盘）
                  items: { type: string }
      responses:
        '201':
          description: Scan result (created/refreshed/decisionsPreserved/rejected + 读了什么)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementScanResult' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions/overdue:
    get:
      tags:
        - learning
      summary: Overdue improvement actions (accepted + past due), earliest due first
      responses:
        '200':
          description: Overdue actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImprovementAction' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions/overdue-sweep:
    post:
      tags:
        - learning
      summary: Notify owners and workshop leads about overdue improvement actions (NO-56b)
      description: >
        逾期待办**主动叫人**：收件人 = 负责人账号（经受控函数从 person 反查，
        查不到就如实进 `unresolvedOwners`）+ 班组长角色兜底；通知号确定性
        （`NTF-ACT-<行动项号>-action_overdue-<role|user>-<收件人>-<渠道>`）→ 重复扫描只累加 duplicates。
        **只读行动项**：不改状态、不代替人完成，只写提醒与 `learning.action_overdue_sweep` 审计。
        完成/放弃/拒绝时按前缀把提醒落到终态（`action_completed` / `action_dropped`，与主事实同事务）。
      responses:
        '201':
          description: Sweep result (scanned/created/duplicates/notified/unresolvedOwners)
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId: { type: string }
                  scanned: { type: integer }
                  created: { type: integer }
                  duplicates: { type: integer }
                  notified:
                    type: array
                    items:
                      type: object
                      properties:
                        actionId: { type: string }
                        recipients: { type: array, items: { type: string } }
                  unresolvedOwners: { type: array, items: { type: string } }
                  generatedAt: { type: string, format: date-time }
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions/{actionId}/accept:
    post:
      tags:
        - learning
      summary: Human accepts an action (owner + due date + acceptance criteria are mandatory)
      description: >
        平台不替现场承诺期限：负责人、期限、验收判据三项必填；同时可纠正建议类型
        （`kindSource` 变 `human`）。状态不对（已接受/已拒绝等）→ 409；缺事实 → 400。
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, dueAt, acceptanceCriteria]
              properties:
                owner: { type: string, description: 负责人（人或角色） }
                dueAt: { type: string, format: date-time }
                acceptanceCriteria: { type: string, description: 让别人能判断"做完了没有" }
                kind:
                  type: string
                  enum: [process_change, training, tooling, maintenance, threshold_review]
      responses:
        '201':
          description: Accepted action (owner/due/criteria/acceptedBy/acceptedAt recorded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementAction' }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions/{actionId}/complete:
    post:
      tags:
        - learning
      summary: Human marks an accepted action complete (outcome note mandatory)
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcomeNote]
              properties:
                outcomeNote: { type: string, description: 对着验收判据说清楚做了什么、结果如何 }
      responses:
        '201':
          description: Completed action (completedBy/completedAt/outcomeNote recorded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementAction' }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions/{actionId}/effect:
    get:
      tags:
        - learning
      summary: Recurrence metric for an improvement action (before/after deviation counts; NO-58a)
      description: >
        复发度量：该行动项的**对象归属**（device/person/station，由复盘 incident `target_id` 派生）
        在"完成前后各一个窗口"内的执行偏差计数。诚实边界：
        ① 没有对象归属 → `conclusion=no_subject`（复发**不可度量**，不硬算）；
        ② 尚未完成 → 只给"完成前"计数（`not_completed`）；
        ③ 合计样本 < 3 → `insufficient_sample`（不给趋势结论）；
        ④ 计数下降/未下降只是**事实**，不等于"这条改进有效"（订单结构/季节变化同样影响）。
        只读：不改任何事实、不写通知。
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string }
        - name: windowDays
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 180, default: 30 }
      responses:
        '200':
          description: Recurrence metric (counts + explicit conclusion and reason)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementActionEffect' }
        NotFound:
          $ref: '#/components/responses/NotFound'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/actions/{actionId}/decision:
    post:
      tags:
        - learning
      summary: Human rejects (proposed) or drops (accepted) an action with a mandatory reason
      parameters:
        - name: actionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [rejected, dropped] }
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: Action rejected/dropped (decidedBy/decidedAt/decidedReason recorded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImprovementAction' }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/signals:
    get:
      tags:
        - learning
      summary: List run-memory learning signals for the current tenant (NO-54a)
      description: >
        运行记忆信号 = 提醒治理（处置率/账龄）、数据质量积压、执行偏差复发的**实测快照**
        加上证据引用、样本量、可信度与方向。信号**不是提案**：只有
        POST /api/learning/signals/{signalId}/promote 才会创建学习提案。
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [notification_fatigue, data_quality_backlog, deviation_repeat]
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [open, promoted, dismissed] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Signals (org-scoped, newest seen first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearningSignal' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/signals/scan:
    post:
      tags:
        - learning
      summary: Derive/refresh learning signals from run memory (idempotent, read-only w.r.t. facts)
      description: >
        扫描提醒治理指标、数据质量积压与执行偏差复发，派生带证据的信号。幂等：
        同一窗口重复扫描只刷新实测快照（`last_seen_at`），**不覆盖人的决定**
        （promoted/dismissed 原样保留）；条件恶化（严重度升级）会生成新的信号号。
        边界：只读业务事实（不改告警/偏差/提醒），只写信号与审计；样本不足的信号
        `confidence=null` 且 `actionable=null`（原则 7）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                windowDays: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Scan result (created/refreshed/decisionsPreserved/rejected + memory read counts)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningSignalScanResult' }
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/signals/{signalId}/promote:
    post:
      tags:
        - learning
      summary: Human turns an actionable signal into a learning proposal (target value supplied by the human)
      description: >
        人点"生成提案"：目标阈值由**人**填写（平台只给方向 raise/lower 与依据，不替现场定数值）。
        服务端两道防漂移：信号必须仍是 `open`；重新读取当前生效阈值并与信号扫描时的基线比对，
        不一致 → 409（必须重新扫描）。创建出的提案仍走影子评估 → 人审激活阶梯，绝不自动生效。
      parameters:
        - name: signalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateValue]
              properties:
                candidateValue: { type: number, minimum: 0, maximum: 1 }
                note: { type: string, nullable: true }
      responses:
        '201':
          description: Signal marked promoted + created proposal (proposal starts at proposed/shadow_evaluated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  signal: { $ref: '#/components/schemas/LearningSignal' }
                  proposal: { type: object }
                  created: { type: boolean }
                  proposalId: { type: string }
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Forbidden:
          $ref: '#/components/responses/Forbidden'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/learning/signals/{signalId}/dismiss:
    post:
      tags:
        - learning
      summary: Human dismisses a signal with a mandatory reason (never silently ignored)
      parameters:
        - name: signalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: Signal dismissed (decidedBy/decidedAt/decidedReason recorded; re-scan preserves it)
          content:
