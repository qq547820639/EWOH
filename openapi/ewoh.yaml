      summary: Dispatch schedule plan (V2) — supports partial dispatch (wave)
      description: >
        派工。body 省略或 assignmentIds 为空 → 派发全部待派工 assignment（原有行为）。
        提供 assignmentIds → 只派发这一波（部分执行）。波内全有或全无：出现任何
        不可派工项即拒绝整波（409 DISPATCH_WAVE_INVALID），不做半应用。
        计划状态语义：仅当本波覆盖全部待派工 assignment 时才进入契约终态
        `dispatched`（其含义是"全部转任务"）；否则保持 `approved`，并通过
        响应的 dispatch.remainingAssignmentIds 显式暴露剩余。把部分派工写成
        dispatched 会让半成品方案看起来已终结。
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                assignmentIds:
                  type: array
                  description: 本波要派发的 assignment ID；省略表示整单派工。
                  items: { type: string }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePlanV2'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        NotFound:
          $ref: '#/components/responses/NotFound'
        Conflict:
          $ref: '#/components/responses/Conflict'
        InternalError:
          $ref: '#/components/responses/InternalError'
