  /api/scheduler/events:
    post:
      tags:
        - scheduler
      summary: Inject scheduling event (v0.7 B2) - event-driven partial replan
      description: >-
        Ingest / MES / edge bridge event source endpoint. Accepts a real business event (device offline, route blocked, safety event, etc.) and triggers a ReplanCoordinator partial replan (impact analysis -> freeze unrelated tasks -> solve -> persist -> circuit breaker). Idempotency and cooldown are guaranteed by TriggerService (same triggerKey dedup + cooldown window, cross-process reliable). On failure the run is marked failed and logged; the event source is never blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulingEventRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
  /api/scheduler/feedback/actuals:
    post:
      tags:
        - scheduler
      summary: Record task execution actuals (v0.7 D1) - feedback loop
      description: >-
        Task executor (mobile / edge / external system) endpoint. Called on task start / complete to backfill actual execution values (actualStart / actualEnd / actual travel / wait / resource) matched by assignmentId / planId / taskId. Repeated submission is an overwrite update (idempotent by nature). Observational only - never changes scheduling behavior; drives planned-vs-actual KPIs and policy shadow evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordActualsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  matched:
                    type: boolean
        BadRequest:
          $ref: '#/components/responses/BadRequest'
        Unauthorized:
          $ref: '#/components/responses/Unauthorized'
        InternalError:
          $ref: '#/components/responses/InternalError'
