# EWOH 受控试点系统 - OpenAPI 3.0 规范骨架
# 说明：请求体/响应体以 $ref 占位，待补全至 components/schemas。
openapi: 3.0.3

info:
  title: EWOH API
  version: 0.6.0
  description: |
    EWOH 受控试点系统 API：外骨骼人员作业协同与风险分析平台。

    安全边界：本 API 不下发任何急停 / 限扭 / 关节实时控制 / 助力实时闭环 /
    限速放宽 / 异常退出保护 / 设备失联安全态 / 绕过本地安全检查的调试指令，
    这些能力保留在设备控制器本地。
  contact:
    name: EWOH Team

servers:
  - url: https://api.ewoh.local
    description: 试点环境（经 edge-gateway 终结 TLS）
  - url: http://127.0.0.1:8765
    description: 开发环境（进程方式）

# 默认安全策略：除显式覆盖（login）外，所有端点均需 BearerAuth
security:
  - BearerAuth: []

tags:
  - name: auth
  - name: me
  - name: devices
  - name: telemetry
  - name: events
  - name: tasks
  - name: query
  - name: audit
  - name: models
  - name: rules
  - name: scenario
  - name: system

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录获取访问令牌
      security: []   # 登录无需鉴权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': { $ref: '#/components/responses/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200': { $ref: '#/components/responses/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/me:
    get:
      tags: [me]
      summary: 当前用户信息
      responses:
        '200': { $ref: '#/components/responses/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/devices:
    get:
      tags: [devices]
      summary: 设备列表
      responses:
        '200': { $ref: '#/components/responses/DeviceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/devices/{id}:
    get:
      tags: [devices]
      summary: 设备详情
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/DeviceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/devices/{id}/health:
    get:
      tags: [devices]
      summary: 设备健康状态
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/DeviceHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/telemetry/latest:
    get:
      tags: [telemetry]
      summary: 最新遥测
      parameters:
        - $ref: '#/components/parameters/DeviceIdQuery'
      responses:
        '200': { $ref: '#/components/responses/TelemetryLatest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/telemetry/series:
    get:
      tags: [telemetry]
      summary: 遥测时序
      parameters:
        - $ref: '#/components/parameters/DeviceIdQuery'
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200': { $ref: '#/components/responses/TelemetrySeries' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/telemetry/export:
    post:
      tags: [telemetry]
      summary: 遥测导出（需导出角色）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200': { $ref: '#/components/responses/ExportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/events:
    get:
      tags: [events]
      summary: 事件列表
      parameters:
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200': { $ref: '#/components/responses/EventList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/events/{id}:
    get:
      tags: [events]
      summary: 事件详情
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200': { $ref: '#/components/responses/EventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/events/{id}/status:
    post:
      tags: [events]
      summary: 更新事件状态（幂等）
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventStatusUpdate'
      responses:
        '200': { $ref: '#/components/responses/EventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/events/{id}/comment:
    post:
      tags: [events]
      summary: 事件评论
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventComment'
      responses:
        '200': { $ref: '#/components/responses/EventDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/tasks/recommend:
    post:
      tags: [tasks]
      summary: 任务推荐
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRecommendRequest'
      responses:
        '200': { $ref: '#/components/responses/TaskRecommendation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/tasks/confirm:
    post:
      tags: [tasks]
      summary: 任务确认（幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskConfirmRequest'
      responses:
        '200': { $ref: '#/components/responses/Assignment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/tasks/assignments:
    get:
      tags: [tasks]
      summary: 任务分配列表
      responses:
        '200': { $ref: '#/components/responses/AssignmentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/query:
    post:
      tags: [query]
      summary: 综合查询（幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200': { $ref: '#/components/responses/QueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/audit:
    get:
      tags: [audit]
      summary: 审计日志查询（需审计角色）
      parameters:
        - $ref: '#/components/parameters/TimeRange'
      responses:
        '200': { $ref: '#/components/responses/AuditList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/models:
    get:
      tags: [models]
      summary: 模型列表
      responses:
        '200': { $ref: '#/components/responses/ModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/rules:
    get:
      tags: [rules]
      summary: 规则列表
      responses:
        '200': { $ref: '#/components/responses/RuleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/scenario/evaluate:
    post:
      tags: [scenario]
      summary: 场景评估
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioEvaluateRequest'
      responses:
        '200': { $ref: '#/components/responses/ScenarioResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/people/{id}/withdraw-consent:
    post:
      tags: [me]
      summary: 授权撤回（安全管理员，幂等）
      description: |
        撤回人员授权：更新 person.consent_status='withdrawn'，
        写入 consent_record，并清理该人员历史 telemetry/inference
        （保留 risk_event 与 audit_log，作为合规底线留痕）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 人员 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawConsentRequest'
      responses:
        '200': { $ref: '#/components/responses/WithdrawConsentResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/admin/retention-purge:
    post:
      tags: [system]
      summary: 数据保留清理（管理员，幂等）
      description: |
        删除早于 retention_days 的 telemetry/inference（高频数据），
        保留 risk_event 与 audit_log（合规留痕）。支持 person_id 参数
        专门清理指定人员的数据（授权撤回场景）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPurgeRequest'
      responses:
        '200': { $ref: '#/components/responses/RetentionPurgeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reset:
    post:
      tags: [system]
      summary: 受控重置（试点，需管理员角色，幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '200': { $ref: '#/components/responses/ResetResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 访问令牌（JWT），由 /api/auth/login 或 /api/auth/refresh 获取。

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 设备标识
    DeviceIdQuery:
      name: device_id
      in: query
      required: false
      schema: { type: string }
      description: 设备标识（过滤）
    EventId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 事件标识
    TimeRange:
      name: range
      in: query
      required: false
      schema:
        type: string
        example: "2026-07-01T00:00:00Z/2026-07-30T23:59:59Z"
      description: 时间范围（ISO8601 区间，start/end）

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 触发限流
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    # 业务响应占位（待补全 schema）
    TokenResponse:        { description: 令牌响应,        content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
    MeResponse:           { description: 当前用户,        content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    DeviceList:           { description: 设备列表,        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceList' } } } }
    DeviceDetail:         { description: 设备详情,        content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
    DeviceHealth:         { description: 设备健康,        content: { application/json: { schema: { $ref: '#/components/schemas/DeviceHealth' } } } }
    TelemetryLatest:      { description: 最新遥测,        content: { application/json: { schema: { $ref: '#/components/schemas/Telemetry' } } } }
    TelemetrySeries:      { description: 遥测时序,        content: { application/json: { schema: { $ref: '#/components/schemas/TelemetrySeries' } } } }
    ExportResult:         { description: 导出结果,        content: { application/json: { schema: { $ref: '#/components/schemas/ExportResult' } } } }
    EventList:            { description: 事件列表,        content: { application/json: { schema: { $ref: '#/components/schemas/EventList' } } } }
    EventDetail:          { description: 事件详情,        content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
    TaskRecommendation:   { description: 任务推荐,        content: { application/json: { schema: { $ref: '#/components/schemas/TaskRecommendation' } } } }
    Assignment:           { description: 任务分配,        content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
    AssignmentList:       { description: 任务分配列表,    content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentList' } } } }
    QueryResult:          { description: 查询结果,        content: { application/json: { schema: { $ref: '#/components/schemas/QueryResult' } } } }
    AuditList:            { description: 审计日志,        content: { application/json: { schema: { $ref: '#/components/schemas/AuditList' } } } }
    ModelList:            { description: 模型列表,        content: { application/json: { schema: { $ref: '#/components/schemas/ModelList' } } } }
    RuleList:             { description: 规则列表,        content: { application/json: { schema: { $ref: '#/components/schemas/RuleList' } } } }
    ScenarioResult:       { description: 场景评估结果,    content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioResult' } } } }
    ResetResult:          { description: 重置结果,        content: { application/json: { schema: { $ref: '#/components/schemas/ResetResult' } } } }
    WithdrawConsentResult: { description: 授权撤回结果,  content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawConsentResult' } } } }
    RetentionPurgeResult: { description: 保留清理结果,    content: { application/json: { schema: { $ref: '#/components/schemas/RetentionPurgeResult' } } } }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string, example: "auth_not_implemented" }
        message: { type: string, example: "鉴权在阶段 4 实现" }
        detail: { type: string }
        request_id: { type: string, description: 请求 ID（X-Request-ID 回显） }
      required: [code, message]
    # ---- 鉴权（阶段 4 实现，当前 501）----
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string, format: password }
      required: [username, password]
    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string }
      required: [refresh_token]
    Token:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: "Bearer" }
        expires_in: { type: integer, example: 3600 }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        roles: { type: array, items: { type: string } }
    # ---- 设备 ----
    Device:
      type: object
      properties:
        device_id: { type: string }
        device_type: { type: string, example: "exoskeleton" }
        model: { type: string }
        firmware_version: { type: string }
        person_id: { type: string }
        online: { type: boolean }
        source_type: { type: string, enum: [real, controlled_test, simulated] }
        source_label: { type: string }
        last_seen: { type: string, format: date-time }
        device_model: { type: string }
        protocol_version: { type: string }
        health: { $ref: '#/components/schemas/DeviceHealth' }
        latest: { type: object, description: 最新遥测与推理快照 }
      required: [device_id, source_type]
    DeviceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        now: { type: string, format: date-time }
        offline_after_sec: { type: integer }
      required: [items]
    DeviceHealth:
      type: object
      properties:
        device_id: { type: string }
        online: { type: boolean }
        last_seen: { type: string, format: date-time }
        last_packet_ts: { type: string, format: date-time }
        packet_loss_pct: { type: number, nullable: true }
        clock_offset_ms: { type: number, nullable: true }
        battery: { type: number, nullable: true, description: 电量百分比 }
        fault: { type: string, nullable: true, description: 故障描述 }
        reconnect_count: { type: integer, nullable: true }
        source_type: { type: string }
      required: [device_id, online]
    # ---- 遥测 ----
    Telemetry:
      type: object
      properties:
        record_id: { type: string }
        device_id: { type: string }
        timestamp: { type: string, format: date-time }
        sequence: { type: integer }
        telemetry: { type: object, description: 设备原始遥测 payload }
        quality: { type: object, properties: { status: { type: string } } }
        source_type: { type: string }
        source_label: { type: string }
        mode: { type: string, enum: [realtime, replay] }
        inference: { type: object, nullable: true }
        device_model: { type: string }
        firmware_version: { type: string }
        protocol_version: { type: string }
        raw_ref: { type: string, nullable: true, description: 原始帧 record_id 引用 }
    TelemetrySeries:
      type: object
      properties:
        device_id: { type: string }
        mode: { type: string, enum: [replay] }
        items: { type: array, items: { $ref: '#/components/schemas/Telemetry' } }
        inference: { type: array, items: { type: object } }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        now: { type: string, format: date-time }
    ExportRequest:
      type: object
      properties:
        device_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
      required: [device_id, start, end]
    ExportResult:
      type: object
      properties:
        export_type: { type: string, example: "raw_slice" }
        device_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        exported_at: { type: string, format: date-time }
        slice:
          type: object
          properties:
            record_count: { type: integer }
            records: { type: array, items: { $ref: '#/components/schemas/Telemetry' } }
            source_type: { type: string }
    # ---- 事件 ----
    Event:
      type: object
      properties:
        event_id: { type: string }
        event_code: { type: string }
        severity: { type: string, enum: [L1, L2, L3] }
        status: { type: string, enum: [open, confirmed, closed, dismissed] }
        person_id: { type: string, nullable: true }
        device_id: { type: string, nullable: true }
        task_id: { type: string, nullable: true }
        zone_id: { type: string, nullable: true }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time, nullable: true }
        trigger:
          type: object
          properties:
            type: { type: string, nullable: true }
            rule_version: { type: string, nullable: true }
            condition: { type: string, nullable: true }
        evidence:
          type: object
          properties:
            window_before_sec: { type: integer, nullable: true }
            window_after_sec: { type: integer, nullable: true }
            record_ids: { type: array, items: { type: string } }
            data_quality: { type: string, nullable: true }
            source_type: { type: string, nullable: true }
        handling: { type: object, nullable: true }
        source_type: { type: string }
        source_label: { type: string }
      required: [event_id, event_code, severity, status, start_time, source_type]
    EventList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Event' } }
        now: { type: string, format: date-time }
      required: [items]
    EventStatusUpdate:
      type: object
      properties:
        event_id: { type: string }
        status: { type: string, enum: [open, confirmed, closed, dismissed] }
        handling: { type: object }
        handled_by: { type: string, description: 操作人 }
      required: [event_id, status]
    EventComment:
      type: object
      properties:
        comment: { type: string }
        operator: { type: string }
      required: [comment]
    # ---- 任务 ----
    TaskRecommendRequest:
      type: object
      properties:
        required_skill: { type: string }
        zone_id: { type: string }
        load_level: { type: number }
    TaskRecommendation:
      type: object
      properties:
        weights: { type: object }
        requires_human_confirm: { type: boolean }
        note: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              person_id: { type: string }
              name: { type: string }
              eligible: { type: boolean }
              blocked_by: { type: array, items: { type: string } }
              score: { type: number }
              reasons: { type: object }
              metrics: { type: object }
    TaskConfirmRequest:
      type: object
      properties:
        task_id: { type: string, nullable: true }
        person_id: { type: string }
        confirmer: { type: string, description: 班组长或现场负责人 }
        required_skill: { type: string }
        zone_id: { type: string }
        load_level: { type: number }
      required: [person_id, confirmer]
    Assignment:
      type: object
      properties:
        ok: { type: boolean }
        assignment:
          type: object
          properties:
            task_id: { type: string }
            person_id: { type: string }
            confirmer: { type: string }
            status: { type: string }
            confirmed_at: { type: string, format: date-time }
        error: { type: string, nullable: true }
        blocked_by: { type: array, items: { type: string }, nullable: true }
    AssignmentList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              task_id: { type: string }
              person_id: { type: string }
              confirmer: { type: string }
              status: { type: string }
              confirmed_at: { type: string, format: date-time }
    # ---- 查询 / 审计 / 模型 / 规则 ----
    QueryRequest:
      type: object
      properties:
        question: { type: string }
        source: { type: string, nullable: true, description: 按来源过滤（real/controlled_test/simulated） }
      required: [question]
    QueryResult:
      type: object
      properties:
        answer: { type: string }
        evidence: { type: array, items: { type: object } }
        refused: { type: boolean }
        category: { type: string }
    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              audit_id: { type: string }
              actor: { type: string, nullable: true }
              action: { type: string }
              object_type: { type: string, nullable: true }
              object_id: { type: string, nullable: true }
              before: { type: object, nullable: true }
              after: { type: object, nullable: true }
              ts: { type: string, format: date-time }
              request_id: { type: string, nullable: true }
              source_ip: { type: string, nullable: true }
              result: { type: string }
        now: { type: string, format: date-time }
        filter: { type: object }
    ModelList:
      type: object
      properties:
        runtime:
          type: object
          properties:
            active: { type: string, nullable: true }
            versions: { type: array, items: { type: string } }
            mode: { type: string, enum: [model, rules_only] }
        registry:
          type: array
          items:
            type: object
            properties:
              model_id: { type: string }
              version: { type: string }
              path: { type: string, nullable: true }
              activated_at: { type: string, format: date-time, nullable: true }
              is_active: { type: boolean }
              metrics: { type: object, nullable: true }
              card_path: { type: string, nullable: true }
        rule_version: { type: string, nullable: true }
        now: { type: string, format: date-time }
    RuleList:
      type: object
      properties:
        runtime:
          type: object
          properties:
            rule_version: { type: string, nullable: true }
            config: { type: object, nullable: true }
        registry:
          type: array
          items:
            type: object
            properties:
              rule_id: { type: string }
              version: { type: string }
              config: { type: object, nullable: true }
              activated_by: { type: string, nullable: true }
              activated_at: { type: string, format: date-time, nullable: true }
              is_active: { type: boolean }
        now: { type: string, format: date-time }
    # ---- 场景评估 / 重置 / 撤回 / 保留 ----
    ScenarioEvaluateRequest:
      type: object
      properties:
        scene: { type: string }
        people: { type: integer }
        structured: { type: number }
        roi: { type: number }
        payer: { type: number }
        fit: { type: number }
        compliance: { type: number }
        replicate: { type: number }
        open_road: { type: boolean }
        no_baseline: { type: boolean }
        free_only: { type: boolean }
        ergonomic_taboo: { type: boolean }
        covert_punitive: { type: boolean }
    ScenarioResult:
      type: object
      properties:
        score: { type: number }
        rating: { type: string, enum: [高, 中, 低] }
        vetoed: { type: boolean }
        veto_reasons: { type: array, items: { type: string } }
        recommended: { type: boolean }
        score_parts: { type: object }
        recommended_devices: { type: integer }
        backup_devices: { type: integer }
        one_pager: { type: object }
        next_requests: { type: array, items: { type: string } }
        source_type: { type: string }
        disclaimer: { type: string }
    ResetRequest:
      type: object
      description: 重置请求（无必填字段，可空 body）
    ResetResult:
      type: object
      properties:
        ok: { type: boolean }
        note: { type: string }
        now: { type: string, format: date-time }
    WithdrawConsentRequest:
      type: object
      properties:
        withdrawn_at: { type: string, format: date-time, nullable: true, description: 不传则用当前时间 }
        reason: { type: string, nullable: true }
        scope: { type: string, nullable: true }
        operator: { type: string, nullable: true, description: 操作人（安全管理员） }
    WithdrawConsentResult:
      type: object
      properties:
        ok: { type: boolean }
        consent_id: { type: string }
        person_id: { type: string }
        withdrawn_at: { type: string, format: date-time }
        deleted:
          type: object
          properties:
            telemetry: { type: integer }
            inference: { type: integer }
        note: { type: string }
        now: { type: string, format: date-time }
    RetentionPurgeRequest:
      type: object
      properties:
        retention_days: { type: integer, default: 30 }
        person_id: { type: string, nullable: true, description: 指定人员时仅清理该人员数据 }
        operator: { type: string, nullable: true }
    RetentionPurgeResult:
      type: object
      properties:
        ok: { type: boolean }
        deleted:
          type: object
          properties:
            telemetry: { type: integer }
            inference: { type: integer }
        retention_days: { type: integer }
        person_id: { type: string, nullable: true }
        before_counts: { type: object }
        after_counts: { type: object }
        now: { type: string, format: date-time }
