version: 1.0
status: validated
owner: AG-06
description: EWOH role and permission access matrix, synced to the standalone
  NestJS implementation on 2026-08-03. Centers follow enforced API roles;
  known UI/API divergences are listed in the notes section.

roles:
  global_admin:
    centers: [command-center, digital-world, scheduling, ai-decision, devices, personnel, alerts, organization, model-management, data-assets, system, audit, command-map]
    high_risk:
      - global_config_write
      - cross_org_read
      - emergency_policy_manage
      # approval_bypass 的唯一合法角色由契约写死，不可在此单独放宽，见 notes
      # 「approval_bypass 裁决」。原先误记在 safety_admin 名下（R-5 漂移修复）。
      - approval_bypass
  dispatcher:
    centers: [command-center, digital-world, scheduling, ai-decision, devices, alerts, command-map]
    high_risk:
      - task_dispatch
      - plan_submit
      - control_request
  workshop_lead:
    centers: [digital-world, scheduling, personnel, alerts, command-map]
    high_risk:
      - task_approve
      - exception_recover
  safety_admin:
    centers: [command-center, personnel, alerts, audit, command-map]
    high_risk:
      - sensitive_health_read
      - risk_dispose
  device_ops:
    centers: [devices, model-management, data-assets, command-map]
    high_risk:
      - device_param_change
      - maintenance_state_write
  worker:
    centers: []
    high_risk: []

rules:
  - role: anonymous
    action: read_public
    allowed: true
  - role: any_authenticated
    action: direct_db_dml
    allowed: false
  - role: any_authenticated
    action: audit_write
    allowed: false
  - role: any_authenticated
    action: auto_approve
    allowed: false
  - role: any_authenticated
    action: auto_dispatch
    allowed: false
  - role: any_authenticated
    action: realtime_joint_control
    allowed: false
  - role: any_controller
    action: default_deny_without_role_metadata
    allowed: false

notes:
  - "approval_bypass 裁决（R-5，2026-09-13）：本行**以契约为唯一事实源**。contracts/state-machines/approval.yaml 的 `pending → bypassed` 迁移写死 role: high_privilege_admin（映射 HIGH_PRIVILEGE_ROLE = global_admin），服务层 approval-persistence.service.ts `bypass()`（:653）与控制器 @Roles（APPROVAL_BYPASS_ROLES）也只放行 global_admin。按「安全侧更严」原则裁决：矩阵原先把 approval_bypass 记在 safety_admin 名下，比契约/服务层**更宽**，属漂移，现改为与契约/服务层逐字一致（仅 global_admin）。谁要把它挪回 safety_admin，必须先改契约与服务层——矩阵不得单独放宽。"
  - "system center: GET /api/system/config is available to global_admin and safety_admin; PUT is global_admin only, matching UI visibility and write sensitivity."
  - "device contract routes: /api/devices is enforced as global_admin/dispatcher/device_ops."
  - "worker centers my-tasks/my-risk are planned but not routed or implemented; worker has no routed UI center."
  - "worker API surface (aligned to enforced controller roles on 2026-08-17, audit CFG-006): /api/me plus all ANY_AUTHENTICATED_ROLES controllers (timeline, workorder, quality, workflow, notification, knowledge, reasoning, inference, exo, agent, simulation, etc.); worker is also explicitly included in @Roles on /api/mobile/* (mobile workbench facade, worker/device_ops perspective) and /api/operations/* (operations.controller.ts)."
  - "command-map is available to all five operational roles in the current UI."
