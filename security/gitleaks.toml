# gitleaks 配置（Task 7 秘密扫描）
# 继承默认规则集，并显式声明 allowlist（当前为空，即“零豁免”）。
# 若日后需豁免某类匹配，须在此处添加并附带说明；禁止无理由放行。

title = "EWOH gitleaks config"

[extend]
useDefault = true

# allowlist 为空：不允许任何秘密匹配被放行（fail on findings）。
# 示例——如需豁免 GitHub 个人访问令牌类测试值，可取消注释并明确理由：
# [[allowlist]]
#   description = "EWOH 仓库契约测试中的假令牌（仅用于示例，非真实凭据）"
#   regexes = [
#     '''github_pat_[A-Za-z0-9_]+''',
#   ]

# 精确豁免（仅限非凭据的确定性误报，绝不放行真实凭据）。
# 以下均为 generic-api-key 按其熵值对“非秘密”常量/测试值的误报，逐条附带说明。
# 真实凭据（如历史提交中的飞书 base_token）一律不得在此豁免，而是通过
# security/gitleaks-baseline.json 基线显式登记为已知历史遗留，见 security.yml。
[allowlist]
  description = "非凭据的确定性误报豁免（迁移标记键 + 测试幂等键）"
  regexes = [
    # 前端离线队列 localStorage 迁移标记键（非凭据）
    '''pending-migrated-v1''',
    # 测试夹具幂等键（非凭据）：edge_platform/tests/test_stage2_api.py 验证 409/幂等语义的固定测试头值
    '''idem-stage2-001''',
  ]