asyncapi: '2.6.0'
info:
  title: EWOH Event Catalog
  version: 1.0.0
  description: |
    Machine-readable event contract for the EWOH embodied factory operating
    system. Every event is a CloudEvents 1.0 message carrying org_id context.
    Connectors, scenario packs, and integrations must reference this catalog
    instead of inventing private event types.
defaultContentType: application/cloudevents+json
x-event-types:
  - DeviceBirth
  - DeviceStateChanged
  - TelemetryObserved
  - TaskCreated
  - TaskStateChanged
  - TaskStepStateChanged
  - AndonRaised
  - OrderReceived
  - OrderAcknowledged
  - AssetConformanceFailed
  - FleetUpgradeStarted
  - FleetRollbackCompleted
  - AuditEntryAppended
  # --- Command Map 智能调度升级（Phase 0/1，05 §3.5 P0-5 事件目录草案） ---
  - WorldEntityUpdated
  - ResourceStateChanged
  - RunCreated
  - RunSucceeded
  - RunFailed
  - PlanCreated
  - PlanUpdated
  - PlanApproved
  - PlanRejected
  - PlanDispatched
  - AssignmentDispatched
  - ConflictDetected
  - ConflictAcknowledged
  - ConflictResolved
  - ConflictSuppressed
  - ReplanCompleted
  - ReplanApprovalRequired
  - ReplanSuppressed
  - ExecutionDeviation
  - PolicyActivated
  - PolicyRolledBack
  - EntityIdentityMapped
  - DeviceLowBattery
  - DeviceThermalRisk
  - WorkerHighLoad
  - WorkerPostureRisk
  - DeviceOffline
  - DataDegraded
  - DataQualityAlert
  - MaintenanceConditionDetected
  - MaintenanceConditionResolved
  - QualityFindingDetected
  - QualityFindingDispositioned
  - WorkOrderCreated
  - WorkOrderCompleted
  - EntityDeclared
  - EntityStateObserved
  - AgentTaskProposed
  - AgentDecisionRecorded
  - AgentTaskCreated
  - AgentTaskCompleted
  - KnowledgeEntryCreated
  - InferenceResultRecorded
  - LearningEvaluationRecorded
  - DeadLetterRecorded
  - SimulationRunCreated
  - SimulationRunCompleted
  - LearningProposalCreated
  - LearningProposalResolved
  - ExoConfigRecorded
  - ExoSessionStarted
  - ExoSessionEnded
  - OutcomeAnnotationRecorded
  # --- DR-2~DR-5 班次/复盘/数据质量确认/方案取消（2026-09-11）---
  - PlanCancelled
  - DataQualityConfirmed
  - ShiftHandoverRecorded
  - RetrospectiveRecorded
