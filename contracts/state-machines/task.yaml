version: 1.0-draft
owner: AG-05
states:
  - draft
  - pending_confirm
  - pending_approval
  - pending_dispatch
  - dispatched
  - received
  - executing
  - paused
  - exception
  - completed
  - cancelled
transitions:
  - { from: draft, to: pending_confirm, role: creator, condition: required_fields_complete, kind: guard }
  - { from: pending_confirm, to: pending_approval, role: dispatcher, condition: approval_required, kind: guard }
  - { from: pending_confirm, to: pending_dispatch, role: dispatcher, condition: no_approval_required, kind: guard }
  - { from: pending_approval, to: pending_dispatch, role: approver, condition: approved_or_bypassed, kind: guard }
  - { from: pending_approval, to: draft, role: approver, condition: rejected_with_reason, kind: guard }
  - { from: pending_dispatch, to: dispatched, role: dispatcher, condition: resources_reserved, kind: guard }
  - { from: dispatched, to: received, role: worker, condition: accept, kind: action }
  # DR-5 方案取消/回滚（2026-09-11）：任务被派发/接收但尚未开始执行时，
  # 调度侧取消派工可将其退回待派发池（重新可排程）。开始执行后不可回退
  # （物理执行不可撤销，只能走 exception/cancelled 处置路径）。
  - { from: dispatched, to: pending_dispatch, role: dispatcher, condition: rollback_before_start, kind: action }
  - { from: received, to: pending_dispatch, role: dispatcher, condition: rollback_before_start, kind: action }
  - { from: received, to: executing, role: worker, condition: start, kind: action }
  - { from: executing, to: paused, role: [worker, dispatcher], condition: reason_required, kind: guard }
  - { from: executing, to: exception, role: [system, worker], condition: anomaly, kind: action }
  - { from: paused, to: executing, role: worker, condition: resume, kind: action }
  - { from: exception, to: executing, role: dispatcher, condition: resolved, kind: action }
  - { from: executing, to: completed, role: worker, condition: all_steps_complete, kind: guard }
  - { from: any_non_terminal, to: cancelled, role: authorized, condition: reason_required, kind: guard }
terminal: [completed, cancelled]
