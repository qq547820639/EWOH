apiVersion: ewoh.io/v1alpha1
kind: ScenarioPack
metadata:
  name: quality-trace
  version: 1.0.0
spec:
  requires:
    connectors:
      - erp-order-delivery@1.x
      - equipment-state@1.x
    mappings:
      - erp-inventory-to-ewoh@1.x
    dataContracts:
      - inspection-schema@1.x
      - batch-trace@1.x
    features:
      - inspection-plan
      - auto-match
      - defect-pareto
      - first-pass-yield
      - trace-graph
  workflows:
    - inspection-plan
    - first-inspection
    - patrol-inspection
    - final-inspection
    - defect-disposition
    - trace-graph
    - defect-pareto
  policies:
    - quality-disposition
  acceptance: e2e-quality-trace
  privacy: no personnel health data in quality records; defect evidence attached with retention policy
  degradation: show data-quality warning; never infer product diagnosis from incomplete evidence
