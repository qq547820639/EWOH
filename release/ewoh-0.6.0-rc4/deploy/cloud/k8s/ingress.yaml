apiVersion: networking.k8s.io/v1
kind: Ingress
# TLS is terminated by the edge gateway; this ingress routes plaintext HTTP only
# inside the cluster. To terminate here instead, add a tls block + certificate
# secret and remove the ssl-redirect annotation.
metadata:
  name: ewoh-ingress
  namespace: ewoh
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  rules:
    - host: ewoh.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ewoh-api
                port:
                  number: 80
