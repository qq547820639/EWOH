apiVersion: v1
kind: Secret
metadata:
  name: ewoh-migration-secret
  namespace: ewoh
type: Opaque
stringData:
  EWOH_DATABASE_URL: "postgresql://ewoh_owner:REPLACE_WITH_URI_SAFE_OWNER_PASSWORD@postgres.example:5432/ewoh"
  EWOH_API_DATABASE_PASSWORD: "REPLACE_WITH_THE_SAME_URI_SAFE_RUNTIME_PASSWORD"
  EWOH_BOOTSTRAP_ADMIN_USERNAME: "admin"
  EWOH_BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_WITH_A_RANDOM_INITIAL_ADMIN_PASSWORD"
  EWOH_BOOTSTRAP_ADMIN_DISPLAY_NAME: "EWOH Administrator"
