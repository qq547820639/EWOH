apiVersion: batch/v1
kind: Job
metadata:
  name: ewoh-migrate
  namespace: ewoh
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: ewoh-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ewoh-migrate:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              node db/runner/run_migrations.js --apply-standalone
              node db/runner/run_migrations.js --verify-standalone
              node db/runner/run_migrations.js --apply-standalone-users
              node db/runner/run_migrations.js --apply-standalone-runtime-role
              node db/runner/run_migrations.js --seed-standalone-admin
          env:
            - name: EWOH_ALLOW_DDL
              value: "1"
          envFrom:
            - secretRef:
                name: ewoh-migration-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
