apiVersion: v1
kind: Service
metadata:
  name: {{ include "ewoh.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ewoh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ewoh.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
