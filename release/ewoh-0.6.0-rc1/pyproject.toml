# EWOH 受控试点系统 - 项目元数据
# 纯标准库实现：运行时无第三方依赖；开发依赖见 requirements-dev.txt
[project]
name = "ewoh"
version = "0.6.0"
description = "EWOH 受控试点系统：外骨骼人员作业协同与风险分析平台"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "EWOH Team" },
]
keywords = ["ewoh", "exoskeleton", "safety", "pilot"]
# 运行时零第三方依赖（仅使用 Python 标准库）
dependencies = []

[project.optional-dependencies]
# 仅用于可选集成测试；主测试仍使用标准库 unittest
dev = [
    "ruff",
    "bandit",
    "pytest",
]

[project.scripts]
ewoh = "edge_platform.run:main"

[build-system]
# 仅使用 setuptools，不引入复杂构建系统
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["edge_platform*"]
exclude = ["edge_platform.tests*"]

# 测试发现配置（Makefile 通过 `python -m unittest discover` 显式驱动）
[tool.ewoh.unittest]
testpaths = ["src/edge_platform/tests"]

# 可选集成测试（pytest）发现路径
# tests/ 为仓库级契约测试（适配层输出 vs 统一语义模型/协议确认书的一致性）
[tool.pytest.ini_options]
testpaths = ["src/edge_platform/tests", "tests"]
python_files = ["test_*.py"]

# Ruff 配置：代码风格与静态检查
[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    "delivery",
    "deploy",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/edge_platform/tests/*" = ["E501"]
