<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EWOH 外骨骼作业监督平台</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">EWOH</span>
      <span class="brand-title">外骨骼作业监督平台</span>
    </div>
    <div class="topbar-right">
      <span class="clock" id="clock">--:--:--</span>
      <span class="poll-indicator" id="pollIndicator" data-state="ok">已连接</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="dashboard">看板</button>
    <button class="tab" data-tab="events">事件</button>
    <button class="tab" data-tab="devices">设备</button>
    <button class="tab" data-tab="audit">审计</button>
  </nav>

  <main class="container">
    <!-- ============ 看板 ============ -->
    <section class="tab-panel active" id="panel-dashboard">
      <div class="status-cards" id="statusCards">
        <div class="status-card skeleton">加载中…</div>
        <div class="status-card skeleton">加载中…</div>
        <div class="status-card skeleton">加载中…</div>
        <div class="status-card skeleton">加载中…</div>
      </div>

      <div class="card">
        <div class="card-header">
          <span>最新遥测快照</span>
          <span class="card-sub">每 2 秒刷新 · 来源 /api/telemetry/latest</span>
        </div>
        <div class="latest-strip" id="latestStrip">
          <div class="empty">等待遥测数据…</div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="card">
          <div class="card-header">
            <span>设备健康</span>
            <span class="card-sub">点击行可在下方查看曲线</span>
          </div>
          <div id="dashDevices" class="list-scroll">
            <div class="empty">加载中…</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <span>活跃事件</span>
            <span class="card-sub">状态 = open</span>
          </div>
          <div id="dashEvents" class="list-scroll">
            <div class="empty">加载中…</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span id="dashChartTitle">实时遥测曲线</span>
          <span class="legend" id="dashLegend"></span>
        </div>
        <div class="chart-wrap">
          <canvas id="dashChart" width="1200" height="300"></canvas>
        </div>
      </div>
    </section>

    <!-- ============ 事件 ============ -->
    <section class="tab-panel" id="panel-events">
      <div class="toolbar">
        <div class="filters" id="eventFilters">
          <button class="filter active" data-status="open">进行中</button>
          <button class="filter" data-status="handled">已处理</button>
          <button class="filter" data-status="closed">已关闭</button>
          <button class="filter" data-status="">全部</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="refreshEvents">刷新</button>
      </div>
      <div class="card">
        <div id="eventsList" class="list-scroll">
          <div class="empty">加载中…</div>
        </div>
      </div>
    </section>

    <!-- ============ 设备 ============ -->
    <section class="tab-panel" id="panel-devices">
      <div class="card">
        <div class="card-header">
          <span>设备列表</span>
          <span class="card-sub">点击行查看该设备历史遥测曲线</span>
        </div>
        <div id="devicesList" class="list-scroll">
          <div class="empty">加载中…</div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <span id="deviceChartTitle">遥测曲线（点击设备查看）</span>
          <span class="legend" id="deviceLegend"></span>
        </div>
        <div class="chart-wrap">
          <canvas id="deviceChart" width="1200" height="300"></canvas>
        </div>
      </div>
    </section>

    <!-- ============ 审计 ============ -->
    <section class="tab-panel" id="panel-audit">
      <div class="toolbar">
        <div class="filters" id="auditFilters">
          <button class="filter active" data-action="">全部动作</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="refreshAudit">刷新</button>
      </div>
      <div class="card">
        <div id="auditList" class="list-scroll">
          <div class="empty">加载中…</div>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ 事件详情 Modal ============ -->
  <div class="modal-overlay" id="eventModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <span>事件详情</span>
        <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body" id="eventDetail">
        <div class="empty">加载中…</div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
