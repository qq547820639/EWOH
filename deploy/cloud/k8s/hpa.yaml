apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ewoh-api-hpa
  namespace: ewoh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ewoh-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
