{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress NetworkPolicy for the EWOH namespace. Only the API
# Service port is reachable, and only from the configured ingress/observability
# peer namespaces (default: this namespace + Kubernetes ingress namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ewoh.fullname" . }}-default-deny
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ewoh.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ewoh.fullname" . }}-api-ingress
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ewoh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ewoh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressPeers }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
---
# Workers need outbound egress to the DB/Redis/object storage; keep egress
# default-deny off unless a strict policy is required, but at minimum allow the
# API pods to receive health probes from kubelet (node-local) device.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ewoh.fullname" . }}-worker-egress
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ewoh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
{{- end }}