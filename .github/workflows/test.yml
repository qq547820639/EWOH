# EWOH 受控试点系统 - 测试与静态检查 CI
# 触发：push 与 pull_request
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装开发依赖（ruff、bandit）
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit

      - name: 运行 unittest 测试套件
        run: python -m unittest discover -s src/edge_platform/tests -v

      - name: 运行 ruff 静态检查
        run: ruff check src/edge_platform

      - name: 断言零第三方运行时依赖（护栏 P0-1）
        run: |
          grep -q '^dependencies = \[\]' pyproject.toml || (echo "ERROR: project.dependencies 必须为空 []，违反零依赖硬约束"; exit 1)
          echo "OK: 运行时零第三方依赖"
