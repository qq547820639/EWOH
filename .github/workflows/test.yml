# EWOH 受控试点系统 - 测试与静态检查 CI
# 触发：push 与 pull_request
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装开发依赖（ruff、bandit）
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit

      - name: 运行 unittest 测试套件
        run: python -m unittest discover -s edge_platform/tests -v

      - name: 运行 ruff 静态检查
        run: ruff check edge_platform
