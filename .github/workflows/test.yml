# EWOH 受控试点系统 - 测试与静态检查 CI
# 触发：push 与 pull_request
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: 安装 Python 开发依赖（ruff、bandit、pytest）
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: 运行 unittest 测试套件
        run: make test

      - name: 运行仓库级契约测试
        run: make test-contract

      - name: Edge 节点断连/乱序/重放/去重门禁（SequenceBuffer + Mesh bridge + Sparkplug session）
        # 显式门禁：SequenceBuffer 乱序/重复/补传/窗口拒绝，edge bridge 失败批缓冲与
        # 重试，Sparkplug session 序列缺口/重复检测。完整覆盖已并入 make test-contract，
        # 此处以命名步骤单独拉出以便门禁可追溯。
        run: |
          PYTHONPATH=src python3 -m pytest \
            tests/test_edge_backfill.py \
            tests/test_edge_bridge_ingest.py \
            tests/test_connector_runtime.py -q

      - name: 运行 ruff 静态检查
        run: ruff check src/edge_platform

      - name: 安装 Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ewoh-spark-app/package-lock.json

      - name: 安装前端/后端依赖
        run: npm ci
        working-directory: ewoh-spark-app

      - name: 依赖漏洞扫描（npm audit，官方 registry）
        working-directory: ewoh-spark-app
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: 许可证扫描
        working-directory: ewoh-spark-app
        run: node scripts/check-licenses.mjs --allow-unknown

      - name: 生成并校验 SBOM（CycloneDX）
        run: |
          node scripts/generate-sbom.js
          test -s release/ewoh-spark-sbom.cyclonedx.json && echo "SBOM OK: $(node -e 'const b=require("./release/ewoh-spark-sbom.cyclonedx.json");console.log(b.bomFormat+" "+b.specVersion+" components="+b.components.length)')"

      - name: 禁止生成命令/CI 使用浮动版本标记的守护检查
        run: |
          set -e
          # 用字符串拼接构造检索词，避免本守护脚本自身命中（自匹配 false positive）。
          needle='@''latest'
          if grep -rnF "$needle" ewoh-spark-app/package.json .github/workflows/ 2>/dev/null; then
            echo "::error::检测到浮动版本标记（违反 Task 11 版本固定约束）。"
            exit 1
          fi
          echo "OK: 未发现浮动版本标记"

      - name: GitHub Actions uses 必须固定到 commit SHA（Task 11）
        run: |
          set -e
          # 允许 "@<40位hex> # 注释"；禁止浮动 tag（如 @v4 / @main 等）
          if grep -rEn "uses: .+@(v[0-9]+(\.[0-9]+)*|[a-z]+)( |$|#)" .github/workflows/ 2>/dev/null; then
            echo "::error::检测到未固定到 commit SHA 的 Actions uses（浮动 tag），请改为 @<commit-sha>。"
            exit 1
          fi
          echo "OK: 所有 Actions uses 均已固定到 commit SHA"

      - name: 仓库事实源一致性校验（P0-1）
        run: |
          node scripts/audit-repo-facts.js --strict
          node scripts/collect-repo-facts.js --out "$GITHUB_WORKSPACE/output/repository-facts.json"
          node scripts/validate-repo-facts.js --snapshot "$GITHUB_WORKSPACE/output/repository-facts.json"

      - name: Work Graph 不变量与阻塞诊断（P0-6/P0-7）
        run: |
          node tools/work-indexer/index.js --root "$GITHUB_WORKSPACE" --strict --invariants
          node tools/work-console/index.js --root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/output/work-console.json" --strict

      - name: 权威制品一致性对账（Phase 1）
        run: node scripts/reconcile-authoritative-artifacts.js --strict --json --output "$GITHUB_WORKSPACE/output/reconcile.json"

      - name: NestJS 类型检查
        run: npm run type:check
        working-directory: ewoh-spark-app

      - name: NestJS Jest 测试（输出 JSON 供单一事实源收集）
        run: npm test -- --runInBand --json --outputFile=jest.results.json
        working-directory: ewoh-spark-app

      - name: 单一事实源证据清单生成与漂移校验（truth-check）
        run: make truth-check

      - name: NestJS 生产构建（跳过交互式插件初始化）
        run: EWOH_SKIP_PLUGIN_INIT=1 npm run build:prod
        working-directory: ewoh-spark-app

      - name: 性能预算校验（bundle-budget：首屏 + 单异步 chunk，超限即失败）
        working-directory: ewoh-spark-app
        run: node scripts/bundle-budget.mjs

      - name: 上传 bundle 性能预算报告（可定位）
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bundle-performance-budget-report
          path: output/bundle-report.json
          if-no-files-found: error

      - name: 真实浏览器核心指标采集（LCP/INP/CLS/长任务/JS 执行）
        # Task 9 前端性能预算：驱动 headless Chromium 采集首屏 Web 指标。
        # 被测应用需要完整后端+数据库服务才能渲染出可测的 LCP/INP/CLS；此处先以静态
        # 构建产物启动开发服务器占位运行。若应用未渲染，脚本如实写入
        # status=BLOCKED_BY_ENVIRONMENT（不伪造通过），报告仍作为可下载 artifact 保留。
        # 当完整被测服务可用时，将启动命令替换为真实服务地址后即为正式测量。
        working-directory: ewoh-spark-app
        run: |
          set -e
          npx --yes http-server dist/client -p 4173 -a 127.0.0.1 --silent &
          SERVER_PID=$!
          sleep 2
          node scripts/browser-metrics.mjs --url http://127.0.0.1:4173
          kill $SERVER_PID 2>/dev/null || true
          echo "browser-metrics 报告见 output/browser-metrics.json（status 见文件）"

      - name: 上传真实浏览器指标报告（可定位）
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-core-vitals-report
          path: output/browser-metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: 构建确定性校验（TR-11.1：同一 commit 两次构建字节一致）
        working-directory: ewoh-spark-app
        run: |
          set -e
          RELEASE_ID="$(git rev-parse HEAD)" NODE_ENV=production npx vite build --config vite.config.ts --outDir /tmp/det-a >/dev/null 2>&1
          RELEASE_ID="$(git rev-parse HEAD)" NODE_ENV=production npx vite build --config vite.config.ts --outDir /tmp/det-b >/dev/null 2>&1
          if ! diff -r /tmp/det-a /tmp/det-b >/dev/null 2>&1; then
            echo "::error::相同 commit 的两次构建产物不一致，违反确定性构建约束（TR-11.1）。"
            diff -rq /tmp/det-a /tmp/det-b || true
            exit 1
          fi
          echo "OK: 两次构建字节一致（确定性通过）"

      - name: 断言零第三方运行时依赖（护栏 P0-1）
        run: |
          grep -q '^dependencies = \[\]' pyproject.toml || (echo "ERROR: project.dependencies 必须为空 []，违反零依赖硬约束"; exit 1)
          echo "OK: 运行时零第三方依赖"
