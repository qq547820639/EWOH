# Task 7 — Large-data performance acceptance gate for the Role Workbench.
#
# Runs the deterministic seeder, the real-PostgreSQL benchmark runner and the
# hard-fail budget gate against a fresh PostgreSQL service container. The gate
# FAILS (exit non-zero) the job when any scenario exceeds its budget, when the
# data-scale requirement is not met, or when any guard (N+1 / full-table scan /
# org isolation) is violated. It NEVER fabricates a pass.
name: perf

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workbench-perf-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ewoh-ci-owner-only
          POSTGRES_DB: ewoh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ewoh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ewoh-spark-app/package-lock.json

      - name: Install dependencies
        working-directory: ewoh-spark-app
        run: npm ci

      - name: Apply workbench schema + org_id/org-isolation migrations
        # owner superuser URL bypasses RLS; --apply-standalone (standalone_001)
        # creates the ewoh_* tables, --apply-standalone-workbench-prod
        # (standalone_005) adds org_id columns + indexes + saved_views +
        # workbench_export_tasks.
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone
          node db/runner/run_migrations.js --apply-standalone-workbench-prod
          node db/runner/run_migrations.js --verify-standalone-workbench-prod

      - name: Seed deterministic 10k dataset (org-a/b/c)
        working-directory: ewoh-spark-app
        env:
          PERF_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
        run: node scripts/perf/seed-workbench-data.js --scale 10000 --truncate

      - name: Run workbench benchmark (real PostgreSQL, org-scoped)
        working-directory: ewoh-spark-app
        env:
          PERF_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
        run: node scripts/perf/workbench-benchmark.js --scale 10000 --iterations 10

      - name: Run performance budget gate (FAIL on any breach)
        working-directory: ewoh-spark-app
        run: node scripts/perf/perf-gate.js

      - name: Upload benchmark + gate artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: workbench-perf-${{ github.sha }}
          path: output/perf-workbench-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload gate verdict artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: workbench-perf-gate-${{ github.sha }}
          path: output/perf-budget-gate.json
          if-no-files-found: error
          retention-days: 30

  # Task 1 (P0) — Scheduler 大规模性能 gate（无 PG 依赖）：
  # 运行 benchmark-scheduler --matrix（10/100/500/1000，persons=0.3t/devices=0.15t，
  # 每个 size 子进程隔离 + 2GB 堆上限），硬性失败条件（宽松安全界，避免 CI 误伤）：
  #   500 tasks wall > 20s 或 1000 tasks wall > 60s 或任意 size 上报 OOM。
  # 绝不伪造 pass：OOM/超时均如实失败。
  scheduler-benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ewoh-spark-app/package-lock.json

      - name: Install dependencies
        working-directory: ewoh-spark-app
        run: npm ci

      - name: Run scheduler benchmark matrix (10/100/500/1000)
        working-directory: ewoh-spark-app
        run: npm run benchmark:scheduler:matrix

      - name: Hard-fail gate (500 <= 20s, 1000 <= 60s, no OOM)
        working-directory: ewoh-spark-app
        run: |
          node -e '
            const r = require("./output/benchmark-scheduler-matrix.json");
            if (!r || !Array.isArray(r.results)) {
              console.error("SCHEDULER BENCHMARK GATE FAILED: no matrix report");
              process.exit(1);
            }
            const by = {};
            for (const x of r.results) by[x.tasks] = x;
            const hard = [];
            if (!by[500] || by[500].solverStatus === "OOM" || by[500].wallMs > 20000) {
              hard.push("500-task gate breached (wallMs=" + (by[500] ? by[500].wallMs : "missing") + ")");
            }
            if (!by[1000] || by[1000].solverStatus === "OOM" || by[1000].wallMs > 60000) {
              hard.push("1000-task gate breached (wallMs=" + (by[1000] ? by[1000].wallMs : "missing") + ")");
            }
            if (hard.length) {
              console.error("SCHEDULER BENCHMARK GATE FAILED: " + hard.join("; "));
              process.exit(1);
            }
            console.log(
              "SCHEDULER BENCHMARK GATE PASSED: 500=" + by[500].wallMs.toFixed(1) +
              "ms peakHeap=" + by[500].peakHeapMb + "MB candidates=" + by[500].candidateCount +
              "; 1000=" + by[1000].wallMs.toFixed(1) +
              "ms peakHeap=" + by[1000].peakHeapMb + "MB candidates=" + by[1000].candidateCount
            );
          '

      - name: Upload scheduler benchmark report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scheduler-benchmark-matrix-${{ github.sha }}
          path: output/benchmark-scheduler-matrix.json
          if-no-files-found: error
          retention-days: 30

  # Task 11/11.2 — Command Map 客户端性能 gate（无 PG / 浏览器依赖，node SSR 可跑）：
  # 运行 client 端基准（jest + renderToString，1000 任务大 fixture 预置 React Query 缓存）
  # 产出 output/benchmark-command-map.json；硬性失败条件（宽松安全界，避免 CI 误伤）：
  #   1) Shell 首绘（renderToString 均值）> 15000ms；
  #   2) 1000+ 行虚拟列表可视窗口渲染行数 > 100（虚拟化必须生效）；
  #   3) SSE 批处理写放大削减 < 90%（原始事件 vs 合并后实际写出）。
  # 绝不伪造 pass：报告缺失 / 任一预算超限均如实失败。
  command-map-perf-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ewoh-spark-app/package-lock.json

      - name: Install dependencies
        working-directory: ewoh-spark-app
        run: npm ci

      - name: Run Command Map client benchmark (1000-task fixture)
        working-directory: ewoh-spark-app
        run: npm run benchmark:command-map

      - name: Hard-fail gate (shell render / virtualization / SSE batching budgets)
        working-directory: ewoh-spark-app
        run: |
          node -e '
            const r = require("./output/benchmark-command-map.json");
            if (!r || !r.budgets || !r.shellRenderMs || !r.sseBatching) {
              console.error("COMMAND-MAP PERF GATE FAILED: no benchmark report");
              process.exit(1);
            }
            const hard = [];
            if (!r.budgets.shellRenderMs.passed) {
              hard.push("shell first-paint render " + r.shellRenderMs.mean.toFixed(1) + "ms > budget " + r.budgets.shellRenderMs.budgetMs + "ms");
            }
            if (!r.budgets.maxSliceRows.passed) {
              hard.push("virtualized list renders > " + r.budgets.maxSliceRows.budgetRows + " rows per window");
            }
            if (!r.budgets.sseWriteReductionMinPct.passed) {
              hard.push("SSE batching write reduction " + r.sseBatching.writeReductionPct + "% < " + r.budgets.sseWriteReductionMinPct.minPct + "%");
            }
            if (hard.length) {
              console.error("COMMAND-MAP PERF GATE FAILED: " + hard.join("; "));
              process.exit(1);
            }
            console.log(
              "COMMAND-MAP PERF GATE PASSED: shellRender(mean)=" + r.shellRenderMs.mean.toFixed(1) +
              "ms (budget " + r.budgets.shellRenderMs.budgetMs + "ms); virtualization=" +
              r.virtualization.map((v) => v.total + "->" + v.renderedRows + "rows").join(",") +
              "; sseReduction=" + r.sseBatching.writeReductionPct + "% (raw " + r.sseBatching.rawEvents +
              " -> storeWrites " + r.sseBatching.storeWrites + ")"
            );
          '

      - name: Upload Command Map benchmark report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: command-map-perf-${{ github.sha }}
          path: output/benchmark-command-map.json
          if-no-files-found: error
          retention-days: 30