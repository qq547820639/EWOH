# EWOH 受控试点系统 - 打包发布 CI
# 触发：tag v* （语义化版本标签）
name: package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: 从 Git HEAD 打包源码 tarball
        # 只打包已提交的 tracked tree，避免工作区中的未提交文件、生成产物或
        # 本地凭证混入 release source archive；同时输出 SHA256 供 provenance 核对。
        run: |
          set -e
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/ewoh-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="ewoh-${VERSION}/" -o "$ARCHIVE" HEAD
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          sha256sum --check "${ARCHIVE}.sha256"
          ls -lh dist/

      - name: 上传构建产物与校验和
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ewoh-source-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
