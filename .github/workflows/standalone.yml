name: standalone

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ewoh-ci-owner-only
          POSTGRES_DB: ewoh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ewoh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ewoh-spark-app/package-lock.json

      - name: Install dependencies
        working-directory: ewoh-spark-app
        run: npm ci

      - name: Type check
        working-directory: ewoh-spark-app
        run: npm run type:check

      - name: Lint
        working-directory: ewoh-spark-app
        run: npm run lint

      - name: Jest
        working-directory: ewoh-spark-app
        run: npm test -- --runInBand

      - name: OpenAPI route audit (strict)
        run: node scripts/audit-openapi-routes.js --strict

      - name: Work Graph 不变量与阻塞诊断（P0-6/P0-7）
        run: |
          node tools/work-indexer/index.js --root "$GITHUB_WORKSPACE" --strict --invariants
          node tools/work-console/index.js --root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/output/work-console.json" --strict

      - name: Build standalone
        working-directory: ewoh-spark-app
        run: npm run build:prod:standalone

      - name: DDL runner plans
        run: |
          node db/runner/run_migrations.js --plan > /tmp/plan.sql
          node db/runner/run_migrations.js --plan rollback > /tmp/rollback.sql
          node db/runner/run_migrations.js --plan seed > /tmp/seed.sql
          node db/runner/run_migrations.js --plan users > /tmp/users.sql
          node db/runner/run_migrations.js --plan users_rollback > /tmp/users_rollback.sql
          node db/runner/run_migrations.js --plan users_seed > /tmp/users_seed.sql
          node db/runner/run_migrations.js --plan standalone > /tmp/standalone.sql
          node db/runner/run_migrations.js --plan standalone_rollback > /tmp/standalone_rollback.sql
          node db/runner/run_migrations.js --plan standalone_verify > /tmp/standalone_verify.sql
          node db/runner/run_migrations.js --plan standalone_domain > /tmp/standalone_domain.sql
          node db/runner/run_migrations.js --plan standalone_domain_rollback > /tmp/standalone_domain_rollback.sql
          node db/runner/run_migrations.js --plan standalone_domain_verify > /tmp/standalone_domain_verify.sql
          node db/runner/run_migrations.js --plan standalone_seed > /tmp/standalone_seed.sql
          node db/runner/run_migrations.js --plan standalone_users > /tmp/standalone_users.sql
          node db/runner/run_migrations.js --plan standalone_users_rollback > /tmp/standalone_users_rollback.sql
          node db/runner/run_migrations.js --plan standalone_runtime_role > /tmp/standalone_runtime_role.sql
          node db/runner/run_migrations.js --plan standalone_runtime_role_rollback > /tmp/standalone_runtime_role_rollback.sql

      - name: PostgreSQL 17 migration, RLS, audit, and rollback
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_BOOTSTRAP_ADMIN_USERNAME: ci_admin
          EWOH_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Admin
        run: |
          runtime_password="$(openssl rand -hex 24)"
          admin_password="$(openssl rand -hex 24)"
          export EWOH_API_DATABASE_PASSWORD="$runtime_password"
          export EWOH_RUNTIME_DATABASE_URL="postgresql://ewoh_api:${runtime_password}@127.0.0.1:5432/ewoh"
          export EWOH_BOOTSTRAP_ADMIN_PASSWORD="$admin_password"
          echo "EWOH_API_DATABASE_PASSWORD=${runtime_password}" >> "$GITHUB_ENV"
          echo "EWOH_RUNTIME_DATABASE_URL=postgresql://ewoh_api:${runtime_password}@127.0.0.1:5432/ewoh" >> "$GITHUB_ENV"
          bash scripts/standalone-postgres-check.sh

      - name: F61-02 domain migrations (apply, verify, rollback, re-apply)
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
        run: |
          # Upgrade path: apply the 6 domain tables and verify their presence.
          node db/runner/run_migrations.js --apply-standalone-domain
          node db/runner/run_migrations.js --verify-standalone-domain
          # Rollback then re-apply to prove the migration is reversible + re-entrant.
          node db/runner/run_migrations.js --rollback-standalone-domain
          node db/runner/run_migrations.js --apply-standalone-domain
          # Re-applying the same migration again must be a no-op (re-entrant safety).
          node db/runner/run_migrations.js --apply-standalone-domain
          node db/runner/run_migrations.js --verify-standalone-domain
          node scripts/migrate-domain-state.js --dry-run

      - name: F61-02 dual-instance concurrency & upgrade/rollback verification
        # 2.D/2.F: two independent connections (two instances) race on the domain
        # primitives (unique-constraint lock race, optimistic version CAS, holder
        # checks, expired-lock takeover, re-entrant safety). Requires a real PG.
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
        run: |
          node db/runner/run_migrations.js --verify-standalone-domain
          node scripts/verify-domain-concurrency.js

      - name: E2E HTTP + PostgreSQL
        # F61-02 领域表的持久化/幂等/多实例/事务一致性由 test:e2e 覆盖。CI 在此提供
        # PostgreSQL Service Container，并通过 EWOH_E2E_RUNTIME_DATABASE_URL 使
        # f61-02-persistence.e2e.spec.ts 真实执行；无该环境时该套件以
        # BLOCKED_BY_ENVIRONMENT 显式失败，绝不伪造通过或静默跳过。
        working-directory: ewoh-spark-app
        env:
          EWOH_E2E_OWNER_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_E2E_RUNTIME_DATABASE_URL: postgresql://ewoh_api:${{ env.EWOH_API_DATABASE_PASSWORD }}@127.0.0.1:5432/ewoh
        run: npm run test:e2e

      - name: Install Playwright browsers
        working-directory: ewoh-spark-app
        run: npx playwright install --with-deps chromium

      - name: Browser authenticated flows
        working-directory: ewoh-spark-app
        env:
          EWOH_E2E_OWNER_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_E2E_RUNTIME_DATABASE_URL: postgresql://ewoh_api:${{ env.EWOH_API_DATABASE_PASSWORD }}@127.0.0.1:5432/ewoh
        run: npm run test:browser

      - name: Build Docker image
        run: |
          docker build -f deploy/cloud/Dockerfile.api -t ewoh-api:ci .
          docker build -f deploy/cloud/Dockerfile.migrate -t ewoh-migrate:ci .

      - name: Collect F61-02 CI evidence
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fs_logs"
          pg_container="$(docker ps -q --filter 'publish=5432' | head -n1)"
          {
            echo "commit_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            if [ -n "$pg_container" ]; then
              echo "--- postgres version() ---"
              docker exec "$pg_container" psql -U postgres -d ewoh -tAc 'select version();'
              echo "--- ewoh_% public table count ---"
              docker exec "$pg_container" psql -U postgres -d ewoh -tAc \
                "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname like 'ewoh_%' and c.relkind in ('r','p');"
              echo "--- ewoh_% public tables ---"
              docker exec "$pg_container" psql -U postgres -d ewoh -tAc \
                "select c.relname from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname like 'ewoh_%' and c.relkind in ('r','p') order by c.relname;"
            fi
          } > "$GITHUB_WORKSPACE/fs_logs/f61-02-ci-evidence.txt" 2>&1 || true
          cat "$GITHUB_WORKSPACE/fs_logs/f61-02-ci-evidence.txt"

      - name: Upload F61-02 CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f61-02-ci-evidence-${{ github.sha }}
          path: fs_logs/f61-02-ci-evidence.txt
          retention-days: 30
