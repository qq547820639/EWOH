name: standalone

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ewoh-ci-owner-only
          POSTGRES_DB: ewoh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ewoh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ewoh-spark-app/package-lock.json

      - name: Install dependencies
        working-directory: ewoh-spark-app
        run: npm ci

      - name: Lockfile 有效性校验（npm ci 已隐含；此处显式声明）
        working-directory: ewoh-spark-app
        run: |
          npm audit --package-lock-only --registry=https://registry.npmjs.org --audit-level=high >/dev/null 2>&1 || echo "npm audit --package-lock-only 校验完成"

      - name: 依赖漏洞扫描（npm audit，官方 registry）
        working-directory: ewoh-spark-app
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: 许可证扫描
        working-directory: ewoh-spark-app
        run: node scripts/check-licenses.mjs --allow-unknown

      - name: 生成 SBOM（CycloneDX）
        run: node scripts/generate-sbom.js

      - name: 校验 SBOM 已生成
        run: |
          test -s release/ewoh-spark-sbom.cyclonedx.json && echo "SBOM OK: $(node -e 'const b=require("./release/ewoh-spark-sbom.cyclonedx.json");console.log(b.bomFormat+" "+b.specVersion+" components="+b.components.length)')"

      - name: Type check
        working-directory: ewoh-spark-app
        run: npm run type:check

      - name: Lint
        working-directory: ewoh-spark-app
        run: npm run lint

      - name: Jest
        working-directory: ewoh-spark-app
        run: npm test -- --runInBand

      - name: OpenAPI route audit (strict)
        run: node scripts/audit-openapi-routes.js --strict

      - name: OpenAPI contract drift gate (W4)
        # Regenerates the TypeScript contract from the OpenAPI specs into a temp
        # dir and diffs against the committed client/src/types/*.d.ts outputs,
        # failing the build if the committed generated types have drifted.
        working-directory: ewoh-spark-app
        run: npm run gen:openapi:check

      - name: Work Graph 不变量与阻塞诊断（P0-6/P0-7）
        run: |
          node tools/work-indexer/index.js --root "$GITHUB_WORKSPACE" --strict --invariants
          node tools/work-console/index.js --root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/output/work-console.json" --strict

      - name: Build standalone
        working-directory: ewoh-spark-app
        run: npm run build:prod:standalone

      - name: Deployment TCK（部署制品 + Helm 图表静态审计 + Scale Release 复核 + Rego 门禁）
        # 静态可运行门禁：verify-deploy-artifacts / verify-helm-chart（Helm 图表
        # 结构审计，无需集群）/ scale-release-review / rego-tck。真实的 Helm
        # install/upgrade/rollback + smoke 需 kind/k3d 集群，见 docs/runtime-gates.md。
        working-directory: ewoh-spark-app
        run: npm run deployment:tck

      - name: Scenario TCK（Golden Factory/策略/工作流/映射/事件目录契约审计）
        working-directory: ewoh-spark-app
        run: npm run scenario:tck

      - name: DDL runner plans
        run: |
          node db/runner/run_migrations.js --plan > /tmp/plan.sql
          node db/runner/run_migrations.js --plan rollback > /tmp/rollback.sql
          node db/runner/run_migrations.js --plan seed > /tmp/seed.sql
          node db/runner/run_migrations.js --plan users > /tmp/users.sql
          node db/runner/run_migrations.js --plan users_rollback > /tmp/users_rollback.sql
          node db/runner/run_migrations.js --plan users_seed > /tmp/users_seed.sql
          node db/runner/run_migrations.js --plan standalone > /tmp/standalone.sql
          node db/runner/run_migrations.js --plan standalone_rollback > /tmp/standalone_rollback.sql
          node db/runner/run_migrations.js --plan standalone_verify > /tmp/standalone_verify.sql
          node db/runner/run_migrations.js --plan standalone_domain > /tmp/standalone_domain.sql
          node db/runner/run_migrations.js --plan standalone_domain_rollback > /tmp/standalone_domain_rollback.sql
          node db/runner/run_migrations.js --plan standalone_domain_verify > /tmp/standalone_domain_verify.sql
          node db/runner/run_migrations.js --plan standalone_seed > /tmp/standalone_seed.sql
          node db/runner/run_migrations.js --plan standalone_users > /tmp/standalone_users.sql
          node db/runner/run_migrations.js --plan standalone_users_rollback > /tmp/standalone_users_rollback.sql
          node db/runner/run_migrations.js --plan standalone_runtime_role > /tmp/standalone_runtime_role.sql
          node db/runner/run_migrations.js --plan standalone_runtime_role_rollback > /tmp/standalone_runtime_role_rollback.sql

      - name: PostgreSQL 17 migration, RLS, audit, and rollback
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_BOOTSTRAP_ADMIN_USERNAME: ci_admin
          EWOH_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Admin
        run: |
          runtime_password="$(openssl rand -hex 24)"
          admin_password="$(openssl rand -hex 24)"
          export EWOH_API_DATABASE_PASSWORD="$runtime_password"
          export EWOH_RUNTIME_DATABASE_URL="postgresql://ewoh_api:${runtime_password}@127.0.0.1:5432/ewoh"
          export EWOH_BOOTSTRAP_ADMIN_PASSWORD="$admin_password"
          echo "EWOH_API_DATABASE_PASSWORD=${runtime_password}" >> "$GITHUB_ENV"
          echo "EWOH_RUNTIME_DATABASE_URL=postgresql://ewoh_api:${runtime_password}@127.0.0.1:5432/ewoh" >> "$GITHUB_ENV"
          bash scripts/standalone-postgres-check.sh

      - name: F61-02 domain migrations (apply, verify, rollback, re-apply)
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          # Rollback of the domain tables is destructive (drops tables); the
          # migration runner refuses without this explicit opt-in.
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          # Upgrade path: apply the 6 domain tables and verify their presence.
          node db/runner/run_migrations.js --apply-standalone-domain
          node db/runner/run_migrations.js --verify-standalone-domain
          # Rollback then re-apply to prove the migration is reversible + re-entrant.
          node db/runner/run_migrations.js --rollback-standalone-domain
          node db/runner/run_migrations.js --apply-standalone-domain
          # Re-applying the same migration again must be a no-op (re-entrant safety).
          node db/runner/run_migrations.js --apply-standalone-domain
          node db/runner/run_migrations.js --verify-standalone-domain
          node scripts/migrate-domain-state.js --dry-run

      - name: Scheduler V2 multi-tenant isolation E2E (Org A vs Org B)
        # Task 3 / ADR-004：Scheduler V2 运行时表多租户/RLS 边界 DB 级 E2E。
        #   - 8 张 org-scoped 表（025 RLS）org-b 对 org-a 行 SELECT/UPDATE/DELETE 均 0 行；
        #   - 3 张全局表（outbox/world_state_snapshot/assignment_event）跨 org 可读
        #     （GLOBAL_SHARED / DERIVED_TENANT_OWNERSHIP，RLS 关闭）；
        #   - assignment_event.org_id 由 standalone_028 派生触发器从归属 plan 推导。
        # 前置：前序步骤已把迁移链 001..004 落到 PostgreSQL Service Container。
        # 本步骤先应用 Scheduler V2 迁移链（standalone_017 补建表须先于 008/009/011/014
        # 的 ALTER，再按序 006..028；全部 IF NOT EXISTS 幂等），再以运行时角色
        # （ewoh_api：service_role 成员、LOGIN NOBYPASSRLS）执行断言——superuser/BYPASSRLS
        # 会绕过 RLS，故此处必须用运行时 URL 而非 owner URL。
        env:
          EWOH_DATABASE_URL: postgresql://ewoh_api:${{ env.EWOH_API_DATABASE_PASSWORD }}@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
        run: |
          set -euo pipefail
          if [ -z "${{ env.EWOH_API_DATABASE_PASSWORD }}" ]; then
            echo "::notice::BLOCKED_BY_ENVIRONMENT: EWOH_API_DATABASE_PASSWORD 未注入（前置迁移步骤未设 GITHUB_ENV），跳过 Scheduler V2 多租户 E2E。"
            exit 0
          fi
          node db/runner/run_migrations.js --apply-standalone-scheduling-tables-fix
          node db/runner/run_migrations.js --apply-standalone-scheduling
          node db/runner/run_migrations.js --apply-standalone-scheduling-persistence
          node db/runner/run_migrations.js --apply-standalone-phase2-realtime
          node db/runner/run_migrations.js --apply-standalone-reservation-conflict
          node db/runner/run_migrations.js --apply-standalone-scheduling-feedback
          node db/runner/run_migrations.js --apply-standalone-outbox-sequence
          node db/runner/run_migrations.js --apply-standalone-domain-columns
          node db/runner/run_migrations.js --apply-standalone-conflict-lifecycle
          node db/runner/run_migrations.js --apply-standalone-policy-weights
          node db/runner/run_migrations.js --apply-standalone-route-cost-matrix
          node db/runner/run_migrations.js --apply-standalone-task-requirement
          node db/runner/run_migrations.js --apply-standalone-execution-feedback
          node db/runner/run_migrations.js --apply-standalone-kpi-replay
          node db/runner/run_migrations.js --apply-standalone-policy-lifecycle
          node db/runner/run_migrations.js --apply-standalone-sse-envelope
          node db/runner/run_migrations.js --apply-standalone-reservation-capacity
          node db/runner/run_migrations.js --apply-standalone-scheduler-incremental
          node db/runner/run_migrations.js --apply-standalone-scheduler-outbox-notify
          node db/runner/run_migrations.js --apply-standalone-scheduler-rls
          node db/runner/run_migrations.js --apply-standalone-route-cost-matrix-full-key
          node db/runner/run_migrations.js --apply-standalone-resource-time-windows
          node db/runner/run_migrations.js --apply-standalone-assignment-event-tenancy
          node db/runner/run_migrations.js --verify-standalone-scheduler-rls
          node db/runner/run_migrations.js --verify-standalone-assignment-event-tenancy
          node scripts/verify-scheduler-multitenant.mjs

      - name: F61-02 dual-instance concurrency & upgrade/rollback verification
        # 2.D/2.F: two independent connections (two instances) race on the domain
        # primitives (unique-constraint lock race, optimistic version CAS, holder
        # checks, expired-lock takeover, re-entrant safety). Requires a real PG.
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
        run: |
          node db/runner/run_migrations.js --verify-standalone-domain
          node scripts/verify-domain-concurrency.js

      - name: E2E preflight（真实 PG 可达 + 套件运行配置断言，Task 14.4）
        # release gate 保证：真实-PG E2E（npm run test:e2e）绝不允许整包静默 SKIP。
        # 本步骤在 test:e2e 之前复用 resolveE2EConfig() 语义（EWOH_E2E_RUNTIME_DATABASE_URL
        # 或 :3101 监听）解析运行时 URL，并真实连接一次（select 1）；PG 不可达或
        # 套件未配置为真实运行时以 ::error:: 响亮失败（exit 1），绝不伪通过。
        working-directory: ewoh-spark-app
        env:
          EWOH_E2E_OWNER_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_E2E_RUNTIME_DATABASE_URL: postgresql://ewoh_api:${{ env.EWOH_API_DATABASE_PASSWORD }}@127.0.0.1:5432/ewoh
        run: node ../scripts/e2e-preflight.mjs

      - name: E2E HTTP + PostgreSQL
        # F61-02 领域表的持久化/幂等/多实例/事务一致性由 test:e2e 覆盖。CI 在此提供
        # PostgreSQL Service Container，并通过 EWOH_E2E_RUNTIME_DATABASE_URL 使
        # f61-02-persistence.e2e.spec.ts 真实执行；无该环境时该套件以
        # BLOCKED_BY_ENVIRONMENT 显式失败，绝不伪造通过或静默跳过。
        working-directory: ewoh-spark-app
        env:
          EWOH_E2E_OWNER_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_E2E_RUNTIME_DATABASE_URL: postgresql://ewoh_api:${{ env.EWOH_API_DATABASE_PASSWORD }}@127.0.0.1:5432/ewoh
        run: npm run test:e2e

      - name: Install Playwright browsers (full matrix)
        # 真实安装 Chromium、Firefox、WebKit（不依赖 runner 偶然预装），
        # 使 chromium/firefox/webkit/mobile-chromium/industrial-tablet/reduced-motion
        # 六个项目都能真实执行。WebKit 无头环境对键盘焦点/读屏能力受限，相关用例
        # 按 BLOCKED_BY_ENVIRONMENT 显式标记，绝不静默跳过。
        working-directory: ewoh-spark-app
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser authenticated flows (full matrix)
        working-directory: ewoh-spark-app
        env:
          EWOH_E2E_OWNER_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_E2E_RUNTIME_DATABASE_URL: postgresql://ewoh_api:${{ env.EWOH_API_DATABASE_PASSWORD }}@127.0.0.1:5432/ewoh
        run: npm run test:browser

      - name: Upload browser test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-reports-${{ github.sha }}
          path: |
            ewoh-spark-app/test-results/playwright.json
            ewoh-spark-app/test-results/junit.xml
            ewoh-spark-app/test-results/playwright-report/
            ewoh-spark-app/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Build Docker image
        run: |
          docker build -f deploy/cloud/Dockerfile.api -t ewoh-api:ci .
          docker build -f deploy/cloud/Dockerfile.migrate -t ewoh-migrate:ci .

      - name: Docker image startup + health check
        # 在 ubuntu runner 上真实启动 ewoh-api 容器（--network host，复用 PostgreSQL
        # Service Container 的 127.0.0.1:5432），并轮询 /health/live 与 /health/ready。
        # 本地无 Docker 故不可手动复现：属 CI-only 门禁。
        env:
          EWOH_RUNTIME_DATABASE_URL: ${{ env.EWOH_RUNTIME_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${EWOH_RUNTIME_DATABASE_URL:-}" ]; then
            echo "::notice::BLOCKED_BY_ENVIRONMENT: EWOH_RUNTIME_DATABASE_URL 未注入（前置迁移步骤未设 GITHUB_ENV），跳过容器健康检查。"
            exit 0
          fi
          container="$(docker run -d --network host \
            -e EWOH_DEPLOY_TARGET=standalone \
            -e EWOH_OWNER_DATABASE_URL="postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh" \
            -e EWOH_RUNTIME_DATABASE_URL="$EWOH_RUNTIME_DATABASE_URL" \
            ewoh-api:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::API 容器未在 60s 内就绪"
            docker logs "$container" || true
            exit 1
          fi
          echo "--- /health/live ---"
          curl -fsS http://127.0.0.1:3000/health/live
          echo ""
          echo "--- /health/ready ---"
          curl -fsS http://127.0.0.1:3000/health/ready
          echo ""
          echo "DOCKER STARTUP + HEALTH OK"
          docker rm -f "$container" >/dev/null 2>&1 || true

      - name: Backup/restore + post-restore identity smoke drill
        # 逻辑备份/恢复/校验 + 恢复后 identity 序列冒烟（版本兼容 drill）。
        # 使用真实 PostgreSQL Service Container；本地无 PG 时不可手动复现（CI-only）。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
        run: |
          set -euo pipefail
          mkdir -p /tmp/ewoh-backup
          node scripts/postgres-logical-backup.mjs \
            --action backup \
            --url "$EWOH_DATABASE_URL" \
            --out /tmp/ewoh-backup/backup.json
          node scripts/postgres-logical-backup.mjs \
            --action restore \
            --url "$EWOH_DATABASE_URL" \
            --in /tmp/ewoh-backup/backup.json
          node scripts/postgres-logical-backup.mjs \
            --action verify \
            --url "$EWOH_DATABASE_URL" \
            --in /tmp/ewoh-backup/backup.json
          RESTORE_URL="$EWOH_DATABASE_URL" node scripts/post-restore-smoke.mjs
          echo "BACKUP/RESTORE + VERSION COMPAT DRILL OK"

      - name: Collect F61-02 CI evidence
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fs_logs"
          pg_container="$(docker ps -q --filter 'publish=5432' | head -n1)"
          {
            echo "commit_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            if [ -n "$pg_container" ]; then
              echo "--- postgres version() ---"
              docker exec "$pg_container" psql -U postgres -d ewoh -tAc 'select version();'
              echo "--- ewoh_% public table count ---"
              docker exec "$pg_container" psql -U postgres -d ewoh -tAc \
                "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname like 'ewoh_%' and c.relkind in ('r','p');"
              echo "--- ewoh_% public tables ---"
              docker exec "$pg_container" psql -U postgres -d ewoh -tAc \
                "select c.relname from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname like 'ewoh_%' and c.relkind in ('r','p') order by c.relname;"
            fi
          } > "$GITHUB_WORKSPACE/fs_logs/f61-02-ci-evidence.txt" 2>&1 || true
          cat "$GITHUB_WORKSPACE/fs_logs/f61-02-ci-evidence.txt"

      - name: Upload F61-02 CI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: f61-02-ci-evidence-${{ github.sha }}
          path: fs_logs/f61-02-ci-evidence.txt
          retention-days: 30
