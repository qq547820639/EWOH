          docker build -f deploy/cloud/Dockerfile.migrate -t ewoh-migrate:ci .

      - name: Docker image startup + health check
        # 在 ubuntu runner 上真实启动 ewoh-api 容器（--network host，复用 PostgreSQL
        # Service Container 的 127.0.0.1:5432），并轮询 /health/live 与 /health/ready。
        # 本地无 Docker 故不可手动复现：属 CI-only 门禁。
        env:
          EWOH_RUNTIME_DATABASE_URL: ${{ env.EWOH_RUNTIME_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${EWOH_RUNTIME_DATABASE_URL:-}" ]; then
            echo "::error::EWOH_RUNTIME_DATABASE_URL 未注入：容器健康门禁不能静默 SKIP。"
            exit 1
          fi
          container="$(docker run -d --network host \
            -e EWOH_DEPLOY_TARGET=standalone \
            -e EWOH_OWNER_DATABASE_URL="postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh" \
            -e EWOH_RUNTIME_DATABASE_URL="$EWOH_RUNTIME_DATABASE_URL" \
            ewoh-api:ci)"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health/live >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::API 容器未在 60s 内就绪"
            docker logs "$container" || true
            exit 1
          fi
          echo "--- /health/live ---"
          curl -fsS http://127.0.0.1:3000/health/live
          echo ""
          echo "--- /health/ready ---"
          curl -fsS http://127.0.0.1:3000/health/ready
          echo ""
          echo "DOCKER STARTUP + HEALTH OK"
          docker rm -f "$container" >/dev/null 2>&1 || true

      - name: Backup/restore + post-restore identity smoke drill
        # 逻辑备份/恢复/校验 + 恢复后 identity 序列冒烟（版本兼容 drill）。
        # 使用真实 PostgreSQL Service Container；本地无 PG 时不可手动复现（CI-only）。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
        run: |
          set -euo pipefail
          mkdir -p /tmp/ewoh-backup
          node scripts/postgres-logical-backup.mjs \
            --action backup \
            --url "$EWOH_DATABASE_URL" \
            --out /tmp/ewoh-backup/backup.json
          node scripts/postgres-logical-backup.mjs \
            --action restore \
            --url "$EWOH_DATABASE_URL" \
            --in /tmp/ewoh-backup/backup.json
          node scripts/postgres-logical-backup.mjs \
            --action verify \
            --url "$EWOH_DATABASE_URL" \
            --in /tmp/ewoh-backup/backup.json
          RESTORE_URL="$EWOH_DATABASE_URL" node scripts/post-restore-smoke.mjs
          echo "BACKUP/RESTORE + VERSION COMPAT DRILL OK"

      - name: Collect F61-02 CI evidence
        if: always()
