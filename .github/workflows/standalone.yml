name: standalone

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ewoh-ci-owner-only
          POSTGRES_DB: ewoh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ewoh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ewoh-spark-app/package-lock.json

      - name: Install dependencies
        working-directory: ewoh-spark-app
        run: npm ci

      - name: Lockfile install consistency
        # npm ci is the authoritative lockfile gate: it fails on drift rather
        # than rewriting the lockfile. Keep this assertion explicit.
        working-directory: ewoh-spark-app
        run: test -f package-lock.json && npm ci --ignore-scripts

      - name: 依赖漏洞扫描（npm audit，官方 registry）
        working-directory: ewoh-spark-app
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: 许可证扫描
        working-directory: ewoh-spark-app
        run: node scripts/check-licenses.mjs --allow-unknown

      - name: 生成 SBOM（CycloneDX）
        run: node scripts/generate-sbom.js

      - name: 校验 SBOM 已生成
        run: |
          test -s release/ewoh-spark-sbom.cyclonedx.json && echo "SBOM OK: $(node -e 'const b=require("./release/ewoh-spark-sbom.cyclonedx.json");console.log(b.bomFormat+" "+b.specVersion+" components="+b.components.length)')"

      - name: Type check
        working-directory: ewoh-spark-app
        run: npm run type:check

      - name: Lint
        working-directory: ewoh-spark-app
        run: npm run lint

      - name: Jest
        working-directory: ewoh-spark-app
        run: npm test -- --runInBand

      - name: OpenAPI route audit (strict)
        run: node scripts/audit-openapi-routes.js --strict

      - name: OpenAPI contract drift gate (W4)
        # Regenerates the TypeScript contract from the OpenAPI specs into a temp
        # dir and diffs against the committed client/src/types/*.d.ts outputs,
        # failing the build if the committed generated types have drifted.
        working-directory: ewoh-spark-app
        run: npm run gen:openapi:check

      - name: Work Graph 不变量与阻塞诊断（P0-6/P0-7）
        run: |
          node tools/work-indexer/index.js --root "$GITHUB_WORKSPACE" --strict --invariants
          node tools/work-console/index.js --root "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/output/work-console.json" --strict

      - name: Build standalone
        working-directory: ewoh-spark-app
        run: npm run build:prod:standalone

      - name: Deployment TCK（部署制品 + Helm 图表静态审计 + Scale Release 复核 + Rego 门禁）
        # 静态可运行门禁：verify-deploy-artifacts / verify-helm-chart（Helm 图表
        # 结构审计，无需集群）/ scale-release-review / rego-tck。真实的 Helm
        # install/upgrade/rollback + smoke 需 kind/k3d 集群，见 docs/runtime-gates.md。
        working-directory: ewoh-spark-app
        run: npm run deployment:tck

      - name: Scenario TCK（Golden Factory/策略/工作流/映射/事件目录契约审计）
        working-directory: ewoh-spark-app
        run: npm run scenario:tck

      - name: DDL runner plans
        run: |
          node db/runner/run_migrations.js --plan > /tmp/plan.sql
          node db/runner/run_migrations.js --plan rollback > /tmp/rollback.sql
          node db/runner/run_migrations.js --plan seed > /tmp/seed.sql
          node db/runner/run_migrations.js --plan users > /tmp/users.sql
          node db/runner/run_migrations.js --plan users_rollback > /tmp/users_rollback.sql
          node db/runner/run_migrations.js --plan users_seed > /tmp/users_seed.sql
          node db/runner/run_migrations.js --plan standalone > /tmp/standalone.sql
          node db/runner/run_migrations.js --plan standalone_rollback > /tmp/standalone_rollback.sql
          node db/runner/run_migrations.js --plan standalone_verify > /tmp/standalone_verify.sql
          node db/runner/run_migrations.js --plan standalone_domain > /tmp/standalone_domain.sql
          node db/runner/run_migrations.js --plan standalone_domain_rollback > /tmp/standalone_domain_rollback.sql
          node db/runner/run_migrations.js --plan standalone_domain_verify > /tmp/standalone_domain_verify.sql
          node db/runner/run_migrations.js --plan standalone_seed > /tmp/standalone_seed.sql
          node db/runner/run_migrations.js --plan standalone_users > /tmp/standalone_users.sql
          node db/runner/run_migrations.js --plan standalone_users_rollback > /tmp/standalone_users_rollback.sql
          node db/runner/run_migrations.js --plan standalone_runtime_role > /tmp/standalone_runtime_role.sql
          node db/runner/run_migrations.js --plan standalone_runtime_role_rollback > /tmp/standalone_runtime_role_rollback.sql

      - name: PostgreSQL 17 migration, RLS, audit, and rollback
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_BOOTSTRAP_ADMIN_USERNAME: ci_admin
          EWOH_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI Admin
        run: |
          runtime_password="$(openssl rand -hex 24)"
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$runtime_password"
          echo "::add-mask::$admin_password"
          export EWOH_API_DATABASE_PASSWORD="$runtime_password"
          export EWOH_RUNTIME_DATABASE_URL="postgresql://ewoh_api:${runtime_password}@127.0.0.1:5432/ewoh"
          export EWOH_BOOTSTRAP_ADMIN_PASSWORD="$admin_password"
          echo "EWOH_API_DATABASE_PASSWORD=${runtime_password}" >> "$GITHUB_ENV"
          echo "EWOH_RUNTIME_DATABASE_URL=postgresql://ewoh_api:${runtime_password}@127.0.0.1:5432/ewoh" >> "$GITHUB_ENV"
          bash scripts/standalone-postgres-check.sh

      - name: F61-02 domain migrations (apply, verify, rollback, re-apply)
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          # Rollback of the domain tables is destructive (drops tables); the
          # migration runner refuses without this explicit opt-in.
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          # Upgrade path: apply the 6 domain tables and verify their presence.
          node db/runner/run_migrations.js --apply-standalone-domain
          node db/runner/run_migrations.js --verify-standalone-domain
          # Rollback then re-apply to prove the migration is reversible + re-entrant.
          node db/runner/run_migrations.js --rollback-standalone-domain
          node db/runner/run_migrations.js --apply-standalone-domain
          # Re-applying the same migration again must be a no-op (re-entrant safety).
          node db/runner/run_migrations.js --apply-standalone-domain
          node db/runner/run_migrations.js --verify-standalone-domain
          node scripts/migrate-domain-state.js --dry-run

      - name: "Identity mapping migrations (ADR-006/NO-02b: apply, verify, rollback, re-apply)"
        # ewoh_identity_mapping（TENANT_SCOPED，RLS identity_mapping_org_isolation）+
        # ewoh_telemetry.entity_id。apply → verify → rollback → re-apply 证明可逆且可重入。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          # Rollback drops the new table + additive column (destructive opt-in required).
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-identity-mapping
          node db/runner/run_migrations.js --verify-standalone-identity-mapping
          node db/runner/run_migrations.js --rollback-standalone-identity-mapping
          node db/runner/run_migrations.js --apply-standalone-identity-mapping
          # Re-applying the same migration again must be a no-op (re-entrant safety).
          node db/runner/run_migrations.js --apply-standalone-identity-mapping
          node db/runner/run_migrations.js --verify-standalone-identity-mapping

      - name: "Maintenance/Quality migrations (ADR-010/NO-05b: apply, verify, rollback, re-apply)"
        # ewoh_maintenance_condition + ewoh_quality_finding（TENANT_SCOPED + RLS +
        # CHECK 约束）。apply → verify → rollback → re-apply 证明可逆且可重入。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-maintenance-quality
          node db/runner/run_migrations.js --verify-standalone-maintenance-quality
          node db/runner/run_migrations.js --rollback-standalone-maintenance-quality
          node db/runner/run_migrations.js --apply-standalone-maintenance-quality
          node db/runner/run_migrations.js --apply-standalone-maintenance-quality
          node db/runner/run_migrations.js --verify-standalone-maintenance-quality

      - name: "Work Order migrations (ADR-012/NO-05e-b: apply, verify, rollback, re-apply)"
        # ewoh_work_order（TENANT_SCOPED + RLS work_order_org_isolation + completion/
        # cancellation CHECK + 唯一业务键）。apply → verify → rollback → re-apply
        # 证明可逆且可重入。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-work-order
          node db/runner/run_migrations.js --verify-standalone-work-order
          node db/runner/run_migrations.js --rollback-standalone-work-order
          node db/runner/run_migrations.js --apply-standalone-work-order
          node db/runner/run_migrations.js --apply-standalone-work-order
          node db/runner/run_migrations.js --verify-standalone-work-order

      - name: "Event dedup migrations (ADR-009/NO-04b: apply, verify, rollback, re-apply)"
        # ewoh_ingest_event_dedup（TENANT_SCOPED + RLS ingest_event_dedup_org_isolation +
        # 唯一 (org_id, source, event_id) + is_late/clock_drift 时间语义列）。
        # apply → verify（含重复插入唯一约束自证）→ rollback → re-apply 证明可逆可重入。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-event-dedup
          node db/runner/run_migrations.js --verify-standalone-event-dedup
          node db/runner/run_migrations.js --rollback-standalone-event-dedup
          node db/runner/run_migrations.js --apply-standalone-event-dedup
          node db/runner/run_migrations.js --apply-standalone-event-dedup
          node db/runner/run_migrations.js --verify-standalone-event-dedup

      - name: "Agent manifest migrations (ADR-016/NO-06b: apply, verify, rollback, re-apply)"
        # ewoh_agent_manifest（TENANT_SCOPED + RLS agent_manifest_org_isolation +
        # 唯一 (org_id, agent_id) + status/risk/level CHECK（L4 排除））。
        # apply → verify（含 L4/非法 status 自证拒绝）→ rollback → re-apply。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-agent-manifest
          node db/runner/run_migrations.js --verify-standalone-agent-manifest
          node db/runner/run_migrations.js --rollback-standalone-agent-manifest
          node db/runner/run_migrations.js --apply-standalone-agent-manifest
          node db/runner/run_migrations.js --apply-standalone-agent-manifest
          node db/runner/run_migrations.js --verify-standalone-agent-manifest

      - name: "Agent task migrations (ADR-017/NO-06f: apply, verify, rollback, re-apply)"
        # ewoh_agent_task（TENANT_SCOPED + RLS agent_task_org_isolation +
        # 唯一 (org_id, task_id) + kind/priority/status CHECK）。
        # apply → verify（含非法 kind/status 自证拒绝）→ rollback → re-apply。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-agent-task
          node db/runner/run_migrations.js --verify-standalone-agent-task
          node db/runner/run_migrations.js --rollback-standalone-agent-task
          node db/runner/run_migrations.js --apply-standalone-agent-task
          node db/runner/run_migrations.js --apply-standalone-agent-task
          node db/runner/run_migrations.js --verify-standalone-agent-task

      - name: "Knowledge entry hardening (ADR-018-Amendment-1/NO-07b: apply, verify, rollback, re-apply)"
        # ewoh_knowledge_entry 硬化（standalone_039：契约列 + 五层 scope CHECK
        # （scope-tenant 一致性：共享层=哨兵 org）+ provenance CHECK +
        # knowledge_entry_service_all RLS + UNIQUE (org_id, entry_id)）。
        # apply → verify（含非法 kind/scope/status/共享层落租户 org/
        # private_operational 带 provenance 自证拒绝 + 合法行写入清理）→
        # rollback → 幂等 re-apply → verify。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-knowledge-entry
          node db/runner/run_migrations.js --verify-standalone-knowledge-entry
          node db/runner/run_migrations.js --rollback-standalone-knowledge-entry
          node db/runner/run_migrations.js --apply-standalone-knowledge-entry
          node db/runner/run_migrations.js --apply-standalone-knowledge-entry
          node db/runner/run_migrations.js --verify-standalone-knowledge-entry

      - name: "Inference result ledger (ADR-019/NO-08a: apply, verify, rollback, re-apply)"
        # ewoh_inference_result（TENANT_SCOPED + RLS inference_result_org_isolation +
        # 唯一 (org_id, inference_id) + level/confidence/data_quality/ood 一致性 CHECK）。
        # apply → verify（含非法 level/confidence 越界/OOD 失配自证拒绝 + 合法行清理）→
        # rollback → 幂等 re-apply → verify。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-inference-result
          node db/runner/run_migrations.js --verify-standalone-inference-result
          node db/runner/run_migrations.js --rollback-standalone-inference-result
          node db/runner/run_migrations.js --apply-standalone-inference-result
          node db/runner/run_migrations.js --apply-standalone-inference-result
          node db/runner/run_migrations.js --verify-standalone-inference-result

      - name: "Learning evaluation ledger (ADR-021/NO-09a: apply, verify, rollback, re-apply)"
        # ewoh_learning_evaluation（TENANT_SCOPED + RLS learning_evaluation_org_isolation +
        # 唯一 (org_id, eval_id) + evaluation_type/period CHECK）。
        # apply → verify（含非法 type/倒置 period 自证拒绝 + 合法行清理）→
        # rollback → 幂等 re-apply → verify。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-learning-evaluation
          node db/runner/run_migrations.js --verify-standalone-learning-evaluation
          node db/runner/run_migrations.js --rollback-standalone-learning-evaluation
          node db/runner/run_migrations.js --apply-standalone-learning-evaluation
          node db/runner/run_migrations.js --apply-standalone-learning-evaluation
          node db/runner/run_migrations.js --verify-standalone-learning-evaluation

      - name: "Trace span ledger (ADR-022/NO-10a: apply, verify, rollback, re-apply)"
        # ewoh_trace_span（trace_span_org_or_global 可见性策略（org lineage 或全局
        # 管理员，非 loose）+ status/duration/time CHECK + 唯一 (trace_id, span_id)）。
        # apply → verify（含非法 status/负 duration 自证拒绝 + 合法行清理）→
        # rollback → 幂等 re-apply → verify。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-trace-span
          node db/runner/run_migrations.js --verify-standalone-trace-span
          node db/runner/run_migrations.js --rollback-standalone-trace-span
          node db/runner/run_migrations.js --apply-standalone-trace-span
          node db/runner/run_migrations.js --apply-standalone-trace-span
          node db/runner/run_migrations.js --verify-standalone-trace-span

      - name: "Dead letter ledger (ADR-024/NO-11a: apply, verify, rollback, re-apply)"
        # ewoh_dead_letter（TENANT_SCOPED + RLS dead_letter_org_isolation +
        # 唯一 (org_id, letter_id) + reason/status/attempts/discard CHECK）。
        # apply → verify（含非法 reason/零 attempts/无理由 discard 自证拒绝 +
        # 合法行清理）→ rollback → 幂等 re-apply → verify。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-dead-letter
          node db/runner/run_migrations.js --verify-standalone-dead-letter
          node db/runner/run_migrations.js --rollback-standalone-dead-letter
          node db/runner/run_migrations.js --apply-standalone-dead-letter
          node db/runner/run_migrations.js --apply-standalone-dead-letter
          node db/runner/run_migrations.js --verify-standalone-dead-letter

      - name: "Digital twin simulation ledger (ADR-025/NO-12a: apply, verify, rollback, re-apply)"
        # ewoh_simulation_run（TENANT_SCOPED + RLS simulation_run_org_isolation +
        # 唯一 (org_id, run_id) + kind/status/isolation/completed/failed CHECK）。
        # apply → verify（含非法 kind/is_simulation=false/completed 无 results/
        # failed 无理由自证拒绝 + 合法行清理）→ rollback → 幂等 re-apply → verify。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-simulation-run
          node db/runner/run_migrations.js --verify-standalone-simulation-run
          node db/runner/run_migrations.js --rollback-standalone-simulation-run
          node db/runner/run_migrations.js --apply-standalone-simulation-run
          node db/runner/run_migrations.js --apply-standalone-simulation-run
          node db/runner/run_migrations.js --verify-standalone-simulation-run

      - name: "Learning proposal ledger (ADR-026/NO-12b: apply, verify, rollback, re-apply)"
        # ewoh_learning_proposal（TENANT_SCOPED + RLS learning_proposal_org_isolation +
        # 唯一 (org_id, proposal_id) + kind/status/values/shadow-gate/approval/rollback CHECK）。
        # apply → verify（含非法 kind/approved 无影子证据/approved 无 approver/
        # rolled_back 无理由/no-op 变更自证拒绝 + 合法行清理）→ rollback →
        # 幂等 re-apply → verify。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-learning-proposal
          node db/runner/run_migrations.js --verify-standalone-learning-proposal
          node db/runner/run_migrations.js --rollback-standalone-learning-proposal
          node db/runner/run_migrations.js --apply-standalone-learning-proposal
          node db/runner/run_migrations.js --apply-standalone-learning-proposal
          node db/runner/run_migrations.js --verify-standalone-learning-proposal

      - name: "Exo session ledger (ADR-032/§7: apply, verify, rollback, re-apply)"
        # ewoh_exo_session（TENANT_SCOPED + RLS exo_session_org_isolation +
        # 唯一 (org_id, session_id) + 部分唯一 (org_id, exo_id) WHERE active +
        # status/identity/end-complete/time-order CHECK）。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
        run: |
          node db/runner/run_migrations.js --apply-standalone-exo-session
          node db/runner/run_migrations.js --verify-standalone-exo-session
          node db/runner/run_migrations.js --rollback-standalone-exo-session
          node db/runner/run_migrations.js --apply-standalone-exo-session
          node db/runner/run_migrations.js --apply-standalone-exo-session
          node db/runner/run_migrations.js --verify-standalone-exo-session

      - name: "Outcome annotation ledger (ADR-034/§10: apply, verify, rollback, re-apply)"
        # ewoh_outcome_annotation（TENANT_SCOPED + RLS outcome_annotation_org_isolation +
        # 唯一 (org_id, annotation_id) + target/kind/judger CHECK）。
        env:
          EWOH_DATABASE_URL: postgresql://postgres:ewoh-ci-owner-only@127.0.0.1:5432/ewoh
          EWOH_ALLOW_DDL: "1"
          EWOH_ALLOW_DESTRUCTIVE_ROLLBACK: "1"
