apiVersion: ewoh.io/v1alpha1
kind: ConnectorPackage
metadata:
  name: wms-inventory
  version: 1.0.0
spec:
  runtime: edge-python
  protocol: http-rest
  outputEvents:
    - StockBalanceChanged
    - InventorySnapshotTaken
    - MaterialShortageObserved
  configSchema:
    type: object
    required: [baseUrl, inventoryEndpoint, snapshotEndpoint]
    properties:
      baseUrl:
        type: string
      inventoryEndpoint:
        type: string
      snapshotEndpoint:
        type: string
  secrets:
    - clientSecret
  permissions:
    network:
      - wms-gateway:443
    api:
      - POST /api/ingestion/*
  compatibility:
    edgeRuntime: ">=1.1.0 <2.0.0"
    core: ">=0.6.0-rc2 <1.0.0"
  tck: connector-tck.yaml
  sbom: sbom.cdx.json
  rollback: supported
  connectorContract:
    schemaRef: ewoh:///connector-contract/v1
    canonicalModel:
      schemaRef: ewoh:///events/event-catalog.yaml
      entityType: StockBalance
      version: 1.0.0
    mappingTemplate:
      templateRef: catalog/mappings/erp-order-to-ewoh.yaml
      direction: source-to-ewoh
    cursor:
      field: updatedAt
      type: timestamp
      mode: both
    idempotency:
      keyField: messageId
      ttlSeconds: 172800
    replay:
      supported: true
      window: 30d
      mode: full-resync
    compensation:
      supported: true
      strategy: reverse-api
    deadLetter:
      enabled: true
      topic: ewoh.wms.inventory.dlq
      retryPolicy:
        maxRetries: 3
        backoffSeconds: 30
    rateLimit:
      enabled: true
      requestsPerSecond: 15
      burst: 30
    dataQuality:
      validateRequired: true
      schemaValidation: true
      rejectOnInvalid: true
      rules:
        - field: sku
          rule: non-empty
        - field: location
          rule: non-empty
        - field: quantity
          rule: ">= 0"
    observability:
      metrics:
        - ewoh_connector_ingest_total
        - ewoh_connector_snapshot_total
        - ewoh_connector_dlq_total
      healthEndpoint: /healthz
      trace:
        enabled: true
        correlationIdField: traceId