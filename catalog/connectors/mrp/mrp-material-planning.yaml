apiVersion: ewoh.io/v1alpha1
kind: ConnectorPackage
metadata:
  name: mrp-material-planning
  version: 1.0.0
spec:
  runtime: edge-python
  protocol: http-rest
  outputEvents:
    - MaterialPlanChanged
    - RequirementCreated
    - MaterialShortageObserved
  configSchema:
    type: object
    required: [baseUrl, planEndpoint, requirementEndpoint]
    properties:
      baseUrl:
        type: string
      planEndpoint:
        type: string
      requirementEndpoint:
        type: string
  secrets:
    - clientSecret
  permissions:
    network:
      - mrp-gateway:443
    api:
      - POST /api/ingestion/*
  compatibility:
    edgeRuntime: ">=1.1.0 <2.0.0"
    core: ">=0.6.0-rc2 <1.0.0"
  tck: connector-tck.yaml
  sbom: sbom.cdx.json
  rollback: supported
  connectorContract:
    schemaRef: ewoh:///connector-contract/v1
    canonicalModel:
      schemaRef: ewoh:///events/event-catalog.yaml
      entityType: MaterialPlan
      version: 1.0.0
    mappingTemplate:
      templateRef: catalog/mappings/erp-order-to-ewoh.yaml
      direction: source-to-ewoh
    cursor:
      field: planSeq
      type: incrementing-id
      mode: incremental
    idempotency:
      keyField: requirementId
      ttlSeconds: 86400
    replay:
      supported: true
      window: 90d
      mode: cursor-replay
    compensation:
      supported: true
      strategy: correction-event
    deadLetter:
      enabled: true
      topic: ewoh.mrp.plan.dlq
      retryPolicy:
        maxRetries: 5
        backoffSeconds: 60
    rateLimit:
      enabled: true
      requestsPerSecond: 10
      burst: 20
    dataQuality:
      validateRequired: true
      schemaValidation: true
      rejectOnInvalid: true
      rules:
        - field: materialCode
          rule: non-empty
        - field: requirementQty
          rule: "> 0"
    observability:
      metrics:
        - ewoh_connector_ingest_total
        - ewoh_connector_requirement_total
        - ewoh_connector_dlq_total
      healthEndpoint: /healthz
      trace:
        enabled: true
        correlationIdField: traceId