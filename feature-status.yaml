# ============================================================================
# feature-status.yaml — 仓库功能事实清单（单一事实源，Task 11 P2 Repository Truth Gate）
#
# 字段语义（全部必填，布尔型）：
#   implemented        代码中是否已实现
#   tested             是否有测试证据（单元/契约/CI 门禁步骤）
#   deployable         是否具备可部署工件（镜像 / compose / 迁移链）
#   productionEnabled  是否已在生产环境启用（当前一律 false：系统尚未部署生产）
#   runtimeVerified    是否在真实运行环境验证过（CI 真实 PG / 容器 / 生产模式启动）
#   docsUpdated        README / CHANGELOG / ADR 等文档是否与代码现状一致
#   evidence           证据列表（文件路径 / 测试名 / CI 步骤名，字符串数组）
#
# 硬性不变量（由 scripts/truth-feature-status.js 强制，任何违反即 FAIL）：
#   a) productionEnabled=true  ⇒ runtimeVerified=true ∧ docsUpdated=true ∧ evidence 非空
#   b) docsUpdated=true        ⇒ README.md 或 CHANGELOG.md 提及该功能
#   c) 任一 true 字段          ⇒ evidence 非空
#   d) productionEnabled=false ⇒ README/CHANGELOG 不得出现"已生产启用/生产就绪"等声明
#   e) OpenAPI 契约无漂移（npm run openapi:no-drift，可 --skip-openapi 跳过）
#   f) CP-SAT 部署漂移守卫：docker-compose.cpsat.yml 存在、ortools 版本三处锁定一致
#
# 当前汇总（2026-08-10）：无任何功能生产启用；调度 V2 / 求解器 / 预测影子等
# 均为代码就绪但生产门控中；CP-SAT 未部署 OR-Tools（OPTIONAL/EXPERIMENTAL）。
# ============================================================================

