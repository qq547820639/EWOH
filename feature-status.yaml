  freshnessContentVersionGate:
    # 事实变化 vs 证据老化的分档闸门（NO-64a）：快照除 `entityVersions`（全量摘要）外，
    # 再记 `entityContentVersions`（**内容版本**：排除随时间自然变化的派生字段——设备
    # status/online、证据时钟 telemetryUpdatedAt、过期后的状态标签）与 `entityEvidence`
    # （来源时间/质量/状态）。审批与派工共用同一判定：
    #   ① 内容版本不同 → 事实变了 → 拒绝（CONTENT_CHANGED）；
    #   ② 仅版本不同（内容相同）→ 证据老化：方案**依赖**该实体且其 dataQuality≠FRESH →
    #      拒绝（EVIDENCE_STALE，不拿过期证据背书）；与方案无关 → **不阻断**并如实报告；
    #   ③ 老快照缺内容版本 → 一律严格判定（fail-closed，不静默放宽）。
    # 缺口审计（第 61–63 轮反复记录的 PLAN_STALE 泛发）：设备"没人上报"只是证据变旧，
    # 却被当成"世界变了"→ 任何方案都批不下去；心跳本身（内容未变）也会让方案即刻过期。
    implemented: true
    tested: true                       # 诊断/闸门 7 例（心跳、依赖/非依赖沉默、内容变化、老快照、分档）+ 客户端 2 例
    deployable: true                   # 无迁移（快照 JSON 增字段，向后兼容）
    productionEnabled: false
    runtimeVerified: true              # e2e:agv-transport 11/11（真实 PG：审批经诊断→重排→再审批通过 + 派工 200 + assignment=dispatched + 本设备执行行已生成）
    docsUpdated: true
