  signedAuthorizationFingerprint:
    # 签名的授权范围指纹（NO-65a）：平台用**密钥**对授权范围做 HMAC-SHA256
    # （`hmac-sha256:v2:<32hex>`，材料 = 请求/设备/命令/审批实例/参数），随命令下发；
    # `pending` 同时携带**可重建的 `authorizationScope`**，边缘持同一密钥即可**验签**，
    # 验不过不碰设备（`fingerprint_signature_invalid`）。平台复核按**已存指纹的方案**
    # 进行：v2 行缺密钥 → 显式拒绝（`revoked_reason=fingerprint_key_missing`，迁移 094），
    # 绝不退回无密钥的一致性校验。未配密钥时退化为 v1 并**启动告警**（不静默降级）。
    # 缺口审计：v1 只能发现偶然漂移，任何持有 ingest key 的一方能算出"看起来对"的指纹
    # ——真实产线上那是一条伪造通道。
    implemented: true
    tested: true                       # 服务端签发/复核 7 例 + 跨语言固定向量（TS/Python 各 1）+ 边缘验签 6 例 + E2E 2 项（12b/16）
    deployable: true                   # standalone_094（撤回原因词表扩展；快照/命令列无新增）
    productionEnabled: false
    runtimeVerified: true              # e2e:control-actuator 26/26（真实 PG：v2 签名 + scope 下发 + 改写参数被撤回且设备拿不到）
